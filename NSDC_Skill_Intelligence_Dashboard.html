  hTL.append(idEl,roomEl);
  const recEl=el("span",{class:"rec replay",html:'<b></b>REPLAY'});
  const tsEl=el("span",{class:"hud-ts"});
  hTR.append(recEl,tsEl);
  const mk=u=>el("div",{class:"hud-stat"},[el("u",{text:u}),el("s",{text:"—"})]);
  const sHead=mk("In frame"),sSrc=mk("Source"),sZone=mk("Zone dwell"),sFps=mk("Room");
  hBL.append(sHead,sSrc,sZone);hBR.append(sFps);
  hud.append(hTL,hTR,hBL,hBR);
  stage.appendChild(hud);

  /* ---- transport + timeline cut from the real export ---- */
  const tl=el("div",{class:"tl"});
  const btnPlay=el("button",{class:"tl-btn","aria-label":"Play or pause",text:"❚❚"});
  const tlTime=el("span",{class:"tl-time",text:hm(head)});
  const track=el("div",{class:"tl-track",role:"slider","aria-label":"Scrub the recorded day",
    tabindex:"0","aria-valuemin":String(DAY_FROM),"aria-valuemax":String(DAY_TO)});
  const spark=el("canvas",{class:"tl-spark"});
  const gapsLayer=el("div",{class:"tl-gaps"});
  const marks=el("div",{class:"tl-marks"});
  const headEl=el("i",{class:"tl-head"});
  track.append(spark,gapsLayer,marks,headEl);
  const spd=el("select",{class:"tl-speed","aria-label":"Playback speed"});
  [[4,"4×"],[8,"8×"],[20,"20×"],[60,"60×"]].forEach(([v,t])=>
    spd.appendChild(el("option",{value:String(v),text:t,selected:v===4?"selected":null})));
  const tlLbl=el("div",{class:"tl-foot"},[
    el("span",{class:"tl-scale"},[
      el("span",{text:hm(DAY_FROM)}),el("span",{text:"12:00"}),el("span",{text:hm(DAY_TO)})]),
    el("span",{class:"tl-key"},[
      el("i",{class:"k m-start"}),document.createTextNode("cohort in"),
      el("i",{class:"k m-peak"}),document.createTextNode("peak"),
      el("i",{class:"k m-end"}),document.createTextNode("cohort out"),
      el("i",{class:"k m-gap"}),document.createTextNode("no feed")])]);
  tl.append(btnPlay,tlTime,track,spd,tlLbl);
  stage.appendChild(tl);

  /* draw the focused camera's real curve into the scrubber */
  function paintSpark(){
    const w=track.clientWidth||600,h=26;
    const dpr=Math.min(2,devicePixelRatio||1);
    spark.width=w*dpr;spark.height=h*dpr;spark.style.height=h+"px";
    const g=spark.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,w,h);
    const s=SER10[FOCUS]&&SER10[FOCUS][date];if(!s)return;
    const a=sl(DAY_FROM),b=sl(DAY_TO);
    let mx=1;for(let i=a;i<b;i++) if(s[i]>0) mx=Math.max(mx,s[i]/10);
    g.beginPath();g.moveTo(0,h);
    for(let i=a;i<b;i++){
      const x=(i-a)/(b-a)*w, v=s[i]<0?0:s[i]/10;
      g.lineTo(x,h-(v/mx)*(h-3));
    }
    g.lineTo(w,h);g.closePath();
    g.fillStyle="rgba(58,135,229,.34)";g.fill();
    g.beginPath();
    for(let i=a;i<b;i++){
      const x=(i-a)/(b-a)*w, v=s[i]<0?0:s[i]/10;
      i===a?g.moveTo(x,h-(v/mx)*(h-3)):g.lineTo(x,h-(v/mx)*(h-3));
    }
    g.strokeStyle="rgba(120,190,255,.9)";g.lineWidth=1.2;g.stroke();
    /* threshold line — where "a cohort exists" begins */
    const ty=h-(COHORT_THR/mx)*(h-3);
    g.strokeStyle="rgba(255,196,110,.5)";g.lineWidth=1;
    g.beginPath();g.moveTo(0,ty);g.lineTo(w,ty);g.stroke();
  }
  /* real no-data stretches, marked so a gap never reads as an empty room */
  function paintGaps(){
    gapsLayer.innerHTML="";
    const s=SER10[FOCUS]&&SER10[FOCUS][date];if(!s)return;
    const a=sl(DAY_FROM),b=sl(DAY_TO);
    let run=null;
    for(let i=a;i<=b;i++){
      const miss=i<b&&s[i]<0;
      if(miss&&run===null) run=i;
      if(!miss&&run!==null){
        const x=(run-a)/(b-a)*100, w=(i-run)/(b-a)*100;
        gapsLayer.appendChild(el("i",{style:`left:${x}%;width:${Math.max(0.25,w)}%`,
          title:"No feed "+hm(mn(run))+"–"+hm(mn(i))}));
        run=null;
      }
    }
  }
  function paintMarks(){
    marks.innerHTML="";
    const rec=D[date][FOCUS];if(!rec)return;
    const put=(m,cls,label)=>{
      if(m==null)return;
      const x=(m-DAY_FROM)/(DAY_TO-DAY_FROM)*100;
      if(x<0||x>100)return;
      const n=el("i",{class:cls,style:`left:${x}%`,title:label+" · "+hm(m)});
      marks.appendChild(n);
    };
    put(rec.firstMin,"m-start","Cohort first detected");
    put(rec.peakMin,"m-peak","Peak occupancy");
    put(rec.lastMin,"m-end","Cohort last detected");
    put(LUNCH[0],"m-lunch","Lunch begins");
  }

  /* rail: the KPI this camera is the source for, recomputed at the playhead */
  const rail=el("div",{class:"vrail"});
  rail.appendChild(el("div",{class:"vrail-h"},[
    el("span",{text:(opt.kpiLabel||SIG.n)+" · at this minute"})]));

  const big=el("div",{class:"vk-big"},[el("b",{text:"—"}),el("i",{text:SIG.unit||""})]);
  rail.appendChild(big);
  const dayRow=el("div",{class:"vk-day"},[
    el("u",{text:opt.dayLabel||"Across the whole day"}),
    el("b",{text:opt.dayValue||"—"})]);
  rail.appendChild(dayRow);

  const kbox=el("div",{class:"vk"});
  const kRows=SIG.rows({sp:SP[FOCUS],course:courseOf(FOCUS),sc:scenes[FOCUS],occ:null,
                        cam:FOCUS,date,kpi:opt.kpiLabel})
    .map(r=>{
      const val=el("b",{text:"—"});
      kbox.appendChild(el("div",{class:"vk-r"},[el("u",{text:r[0]}),val]));
      return val;
    });
  rail.appendChild(kbox);

  const evt=el("div",{class:"evt"});
  evt.appendChild(el("h4",{text:"Detections at or before this minute"}));
  const evtList=el("ul",{class:"evtlist"});evt.appendChild(evtList);
  rail.appendChild(evt);

  grid.append(stage,rail);wrap.appendChild(grid);

  /* ---- transport interaction ---- */
  const setHead=m=>{
    head=clamp(m,DAY_FROM,DAY_TO-1);
    tlTime.textContent=hm(head);
    /* a slider without aria-valuenow is invalid ARIA — a screen reader
       announces no position at all. valuetext gives it "09:14", not "554". */
    track.setAttribute("aria-valuenow",String(Math.round(head)));
    track.setAttribute("aria-valuetext",hm(head)+" on "+DAYLBL[date]);
  };
  setHead(head);
  btnPlay.addEventListener("click",()=>{playing=!playing;btnPlay.textContent=playing?"❚❚":"▶";});
  spd.addEventListener("change",()=>{speed=+spd.value;});
  const seek=e=>{
    const r=track.getBoundingClientRect();
    const t=clamp((e.clientX-r.left)/r.width,0,1);
    const to=DAY_FROM+t*(DAY_TO-DAY_FROM);
    if(to<head) CAMS.forEach(id=>{const sc=scenes[id];if(sc)sc.events=sc.events.filter(x=>x.m<=to);});
    setHead(to);
  };
  let dragging=false;
  track.addEventListener("pointerdown",e=>{dragging=true;playing=false;btnPlay.textContent="▶";
    track.setPointerCapture(e.pointerId);seek(e);});
  track.addEventListener("pointermove",e=>{if(dragging)seek(e);});
  track.addEventListener("pointerup",e=>{dragging=false;try{track.releasePointerCapture(e.pointerId);}catch(x){}});
  track.addEventListener("keydown",e=>{
    const k=e.key;
    if(k==="ArrowLeft"||k==="ArrowRight"){e.preventDefault();playing=false;btnPlay.textContent="▶";
      setHead(head+(k==="ArrowRight"?BUCKET:-BUCKET)*(e.shiftKey?15:1));}
    if(k==="Home"){e.preventDefault();playing=false;btnPlay.textContent="▶";setHead(DAY_FROM);}
    if(k==="End"){e.preventDefault();playing=false;btnPlay.textContent="▶";setHead(DAY_TO-1);}
    if(k===" "){e.preventDefault();playing=!playing;btnPlay.textContent=playing?"❚❚":"▶";}
  });

  /* ---- loop ---- */
  function sizeCanvas(c,ratio,maxH){
    const dpr=Math.min(2,devicePixelRatio||1);
    const w=c.clientWidth||c.parentElement.clientWidth||640;
    const h=Math.min(Math.round(w*ratio),maxH||99999);
    if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){
      c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.style.height=h+"px";}
    const ctx=c.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,w,h};
  }
  let last=performance.now(),fps=0,acc=0,frames=0,tick=0,sparkedW=0,evtSig="";

  function frame(now,once){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    acc+=dt;frames++;if(acc>.5){fps=frames/acc;acc=0;frames=0;}
    if(playing&&!dragging){
      head+=speed*dt;
      if(head>=DAY_TO){head=DAY_FROM;}
      tlTime.textContent=hm(head);
    }
    /* every camera is set to the real count at this minute */
    WALL.forEach(id=>{
      const sc=scenes[id];
      const v=occAt(id,date,head);
      sc.noData=(v===null);
      sc.visible=v===null?0:Math.min(sc.stu.length,Math.round(v));
      sc.clockMin=head;
      sc.playing=playing;
      sc.hasInstr=sc.ran&&sc.visible>=COHORT_THR;
      /* pause means pause: idle sway kept the frame moving, which is wrong for
         a paused recording and makes the frame impossible to study */
      if(playing&&!dragging) stepScene(sc,dt);
    });

    const fid=FOCUS,fsc=scenes[fid],sp=SP[fid];
    const A=sizeCanvas(cvs,.545,CAM_MAXH);
    drawScene(A.ctx,fsc,A.w,A.h,true);
    tick++;
    /* repaint on any width change, not once — a resize used to leave the
       scrubber's backing store stretched and soft */
    if(track.clientWidth&&track.clientWidth!==sparkedW){
      sparkedW=track.clientWidth;paintSpark();paintGaps();paintMarks();
    }
    headEl.style.left=((head-DAY_FROM)/(DAY_TO-DAY_FROM)*100)+"%";

    idEl.textContent=camLabel(fid);
    roomEl.textContent="· "+sp.name+(courseOf(fid)?" · "+courseOf(fid).name:" · "+sp.type);
    tsEl.textContent=hm(head)+"  "+date.split("-").reverse().join("/");
    recEl.innerHTML=(playing?'<b></b>REPLAY':'<b style="animation:none;opacity:.5"></b>PAUSED');
    const occ=occAt(fid,date,head);
    sHead.querySelector("s").textContent=occ===null?"no feed":fmt(occ,1);
    sSrc.querySelector("s").textContent=occ===null?"—":"export";
    sZone.querySelector("s").textContent=fsc.hasInstr?hm(fsc.inst.dwell/60*40):"—";
    sFps.querySelector("s").textContent=occ===null?"—":(fsc.visible>=COHORT_THR?"in session":"below threshold");

    /* the KPI rail, recomputed at the playhead */
    const ctx0={sp,course:courseOf(fid),sc:fsc,occ,cam:fid,date,head,kpi:opt.kpiLabel};
    const hv=SIG.head(ctx0);
    big.querySelector("b").textContent=hv.t;
    big.querySelector("b").className=hv.tone?("t-"+hv.tone):"";
    big.querySelector("i").textContent=hv.u||SIG.unit||"";
    SIG.rows(ctx0).forEach((r,i)=>{
      const n=kRows[i]; if(!n) return;
      n.textContent=r[1];
      n.className=r[2]?("t-"+r[2]):"";
    });

    /* only events at or before the playhead — scrubbing back used to leave
       the future on screen under a heading that says "at this minute" */
    const shownEvts=fsc.events.filter(e=>e.m<=head+0.5);
    const sig2=shownEvts.map(e=>e.m+e.txt).join("|");
    if(sig2!==evtSig){
      evtSig=sig2; evtList.innerHTML="";
      shownEvts.forEach(e=>evtList.appendChild(el("li",{},[
        el("time",{text:hm(e.m)}),el("span",{text:e.txt})])));
      if(!shownEvts.length) evtList.appendChild(el("li",{},[
        el("span",{style:"color:var(--vid-muted)",text:"No events yet at this minute"})]));
    }
    if(!once) camLoop=requestAnimationFrame(frame);
  }
  /* paint one frame synchronously as soon as the panel is in the DOM, so a
     throttled rAF can never leave the hero panel with an empty scrubber and
     a dash where the headcount should be */
  SYNCS.push(()=>{try{frame(performance.now(),true);}catch(e){}});
  if(REDUCED){
    WALL.forEach(id=>{const sc=scenes[id];const v=occAt(id,date,head);
      sc.noData=v===null;sc.visible=v===null?0:Math.min(sc.stu.length,Math.round(v));
      sc.hasInstr=sc.ran&&sc.visible>=COHORT_THR;sc.playing=false;stepScene(sc,.4);});
    playing=false;btnPlay.textContent="▶";
    requestAnimationFrame(()=>{
      const A=sizeCanvas(cvs,.545,CAM_MAXH);drawScene(A.ctx,scenes[FOCUS],A.w,A.h,true);
      paintSpark();paintGaps();paintMarks();
      idEl.textContent=camLabel(FOCUS);
      roomEl.textContent="· "+SP[FOCUS].name;
      tsEl.textContent=hm(head)+"  "+date.split("-").reverse().join("/");
      const occ=occAt(FOCUS,date,head);
      sHead.querySelector("s").textContent=occ===null?"no feed":fmt(occ,1);
      sSrc.querySelector("s").textContent="export";
      sZone.querySelector("s").textContent="—";
      sFps.querySelector("s").textContent=scenes[FOCUS].ran?"in session":"no session";
      headEl.style.left=((head-DAY_FROM)/(DAY_TO-DAY_FROM)*100)+"%";
    });
  } else camLoop=requestAnimationFrame(frame);
  return wrap;
}

const DAYLBL={};FEED_DATES.forEach(d=>{
  DAYLBL[d]=new Date(d+"T00:00:00").toLocaleDateString("en-GB",
    {weekday:"short",day:"2-digit",month:"short"});});
/* the aggregate key is built back in section 4b, but DAYLBL only exists here */
DAYLBL[ALLD]="All days · "+DAYLBL[FEED_DATES[0]].replace(/^\w+ /,"")+
  " – "+DAYLBL[FEED_DATES[FEED_DATES.length-1]].replace(/^\w+ /,"");

/* red -> green scoring against a reference. Carried over from the first
   NSDC prototype, where it was doing the work three sentences do here. */
const RYG=["--ryg0","--ryg1","--ryg2","--ryg3","--ryg4","--ryg5"].map(CSSV);
const rygIdx=p=>p<.3?0:p<.5?1:p<.75?2:p<1?3:p<1.35?4:5;
const rygScore=(v,ref,inv)=>!(ref>0)?1:(inv?(v<=0?2:ref/v):v/ref);
const ryg=(v,ref,inv)=>RYG[rygIdx(rygScore(v,ref,inv))];
/* strict: anything under the reference is visibly under it */
const refIdx=p=>p<0.6?0:p<0.78?1:p<1?2:p<1.08?3:p<1.2?4:5;
const refCol=(v,ref)=>RYG[refIdx(!(ref>0)?1:v/ref)];
const rygTone=(v,ref,inv)=>{const i=rygIdx(rygScore(v,ref,inv));
  return i<=1?"crit":i<=2?"warn":"good";};

/* ---------------- components ---------------- */
function sec(title,meta){
  const n=el("div",{class:"sec"},[el("b",{text:title})]);
  if(meta) n.appendChild(el("span",{text:meta}));
  return n;
}
function srcDot(k){return el("i",{class:"sd sd-"+k});}

/* The real export is four days long. A smoothed area over four points draws a
   curve the data cannot support, so a short series is drawn as what it is:
   four readings, the selected one ringed, the reference as a dashed rule.
   Longer series (an intra-day curve) keep the area. */
function sparkline(vals,cur,ref){
  const W=200,H=18,vv=vals.map(v=>(v==null||!isFinite(v))?null:v);
  const nums=vv.filter(v=>v!=null);
  if(!nums.length) return el("div",{class:"kc-spark"});
  const refN=(ref!=null&&isFinite(ref))?ref:null;
  const lo0=Math.min.apply(null,nums.concat(refN==null?[]:[refN]));
  const hi0=Math.max.apply(null,nums.concat(refN==null?[]:[refN]));
  const pad=(hi0-lo0)*0.3||Math.max(0.5,Math.abs(hi0)*0.1)||1;
  const mn=Math.max(0,lo0-pad), mx=hi0+pad;
  const X=i=>vv.length<2?W/2:W*i/(vv.length-1);
  const Y=v=>H-2-(H-6)*((v-mn)/((mx-mn)||1));
  const s=sv("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none","aria-hidden":"true"});
  if(refN!=null){const y=Y(refN);
    s.appendChild(sv("line",{x1:0,x2:W,y1:y,y2:y,stroke:CSSV("--rule"),
      "stroke-width":1,"stroke-dasharray":"3 3"}));}

  if(vv.length<=6){
    /* connector first, so no dot is painted over */
    let prev=null;
    vv.forEach((v,i)=>{
      if(v==null){prev=null;return;}
      if(prev!=null) s.appendChild(sv("line",{x1:X(prev),x2:X(i),y1:Y(vv[prev]),y2:Y(v),
        stroke:CSSV("--rule"),"stroke-width":1.4}));
      prev=i;});
    vv.forEach((v,i)=>{
      if(v==null){
        /* an unmeasured day is a hollow mark on the axis, never a zero */
        s.appendChild(sv("circle",{cx:X(i),cy:H-3,r:2,fill:"none",
          stroke:CSSV("--hair"),"stroke-width":1.4}));
        return;}
      const on=(i===cur);
      s.appendChild(sv("circle",{cx:X(i),cy:Y(v),r:on?3.6:2.6,
        fill:on?CSSV("--s1"):CSSV("--surface"),
        stroke:CSSV("--s1"),"stroke-width":on?2:1.6}));
    });
  }else{
    const fl=vv.map(v=>v==null?0:v);
    let d=`M0,${H}`;fl.forEach((v,i)=>d+=` L${X(i)},${Y(v)}`);d+=` L${W},${H} Z`;
    s.appendChild(sv("path",{d,fill:CSSV("--s1"),opacity:".12"}));
    let l="";fl.forEach((v,i)=>l+=(i?" L":"M")+X(i)+","+Y(v));
    s.appendChild(sv("path",{d:l,fill:"none",stroke:CSSV("--s1"),"stroke-width":2,
      "stroke-linejoin":"round","stroke-linecap":"round"}));
    if(cur!=null&&vv[cur]!=null)
      s.appendChild(sv("circle",{cx:X(cur),cy:Y(vv[cur]),r:3.6,fill:CSSV("--s1"),
        stroke:CSSV("--surface"),"stroke-width":2}));
  }
  return el("div",{class:"kc-spark"},[s]);
}

/* ---- card marks. Each one exists because a real card was showing a number
   over 80px of white space, or showing the wrong shape for its figure. ---- */

/* a countable set drawn as the set */
function kUnits(o){
  const total=Math.max(0,o.total|0), on=clamp(Math.round(o.on),0,total);
  const cap=o.cap||20, n=total>cap?cap:total;
  const onN=total?Math.round(on/total*n):0;
  const w=el("div",{class:"ku"+(o.k?" "+o.k:"")});
  for(let i=0;i<n;i++) w.appendChild(el("i",{class:i<onN?"on":"off"}));
  if(total>n) w.appendChild(el("s",{text:"each ×"+fmt(total/n,1)}));
  return w;
}
/* the declared list itself, not its cardinality */
function kTags(list){
  const t=el("div",{class:"ktags"});
  (list||[]).filter(Boolean).slice(0,8).forEach(x=>t.appendChild(el("b",{text:String(x)})));
  return t.childNodes.length?t:null;
}
/* where inside the total the quantity actually sits */
function kMini(o){
  const v=(o.vals||[]).map(x=>(x==null||!isFinite(x))?0:x);
  if(!v.length) return null;
  const mx=Math.max.apply(null,v.concat([o.max||0]))||1;
  const hi=o.hi==null?-1:o.hi;
  const bars=el("div",{class:"kmini"},v.map((x,i)=>
    el("i",{class:i===hi?"hi":null,style:"height:"+clamp(x/mx*100,2,100)+"%"})));
  const out=[bars];
  if(o.labs) out.push(el("div",{class:"kmini-ax"},o.labs.map(l=>el("span",{text:l}))));
  return el("div",{},out);
}
/* a mean with its spread, because a mean alone overstates what is known */
function kRange(o){
  const lo=o.lo, hi=o.hi, v=o.v, a=o.min==null?lo:o.min, b=o.max==null?hi:o.max;
  if([lo,hi,v].some(x=>x==null||!isFinite(x))) return null;
  const L=x=>clamp((x-a)/((b-a)||1)*100,0,100);
  const box=el("div",{class:"krg"},[
    el("i",{class:"tk"}),
    el("i",{class:"sp",style:`left:${L(lo)}%;width:${Math.max(1,L(hi)-L(lo))}%`}),
    el("i",{class:"mn",style:`left:${L(lo)}%`}),
    el("i",{class:"mx",style:`left:${L(hi)}%`}),
    el("i",{class:"vv",style:`left:${L(v)}%`})]);
  const f=o.fmt||(x=>fmt(x,1));
  return el("div",{},[box,el("div",{class:"krg-ax"},[
    el("span",{text:"low "+f(lo)}),el("span",{text:"high "+f(hi)})])]);
}
/* a time as a position on the day */
function kDay(o){
  const a=(o.span&&o.span[0])||0, b=(o.span&&o.span[1])||1440;
  const L=x=>clamp((x-a)/((b-a)||1)*100,0,100);
  const kids=[];
  if(o.gaps) o.gaps.forEach(g=>kids.push(el("s",{
    style:`left:${L(g[0])}%;width:${Math.max(0.5,L(g[1])-L(g[0]))}%`})));
  if(o.from!=null&&o.to!=null) kids.unshift(el("i",{
    style:`left:${L(o.from)}%;width:${Math.max(1,L(o.to)-L(o.from))}%`}));
  if(o.at!=null) kids.push(el("u",{style:`left:${L(o.at)}%`}));
  return el("div",{},[el("div",{class:"kdb"+(o.k?" "+o.k:"")},kids),
    el("div",{class:"km-ax"},[el("span",{text:hm(a)}),el("span",{text:hm(b)})])]);
}
/* how many of the four days of feed show this at all */
function kDays(o){
  const w=el("div",{class:"kdays"});
  (o.on||[]).forEach((v,i)=>w.appendChild(el("i",{
    class:(v?"on":"")+(i===o.cur?" cur":"")})));
  if(o.lbl) w.appendChild(el("em",{text:o.lbl}));
  return w;
}
/* the licensed band scale: the reading means nothing without its thresholds */
function kBand(o){
  const a=o.min, b=o.max, L=x=>clamp((x-a)/((b-a)||1)*100,0,100);
  const kids=[el("i",{class:"tk"})];
  (o.lines||[]).forEach(x=>kids.push(el("i",{class:"bl",style:`left:${L(x)}%`})));
  kids.push(el("i",{class:"vv",style:`left:${L(o.v)}%`}));
  const ax=el("div",{class:"kband-ax"},(o.lines||[]).concat([]).map(x=>
    el("span",{style:`left:${L(x)}%`,text:fmt(x,2)})));
  return el("div",{},[el("div",{class:"kband"},kids),ax]);
}

function kcard(o){
  const tone=o.tone||null;
  const c=el("div",{class:"kc b-"+(tone||o.src||"measured")+
    (o.src==="modelled"?" is-modelled":"")});
  const h=el("div",{class:"kc-h"},[srcDot(o.src||"measured"),el("u",{text:o.lbl})]);
  if(o.delta&&o.delta.v!=null&&isFinite(o.delta.v)){
    const up=o.delta.v>0.049, dn=o.delta.v<-0.049;
    const good=o.delta.upGood===false?dn:up;
    const k=(!up&&!dn)?"fl":(good?"up":"dn");
    h.appendChild(el("span",{class:"kc-d "+k,
      text:(up?"▲":dn?"▼":"–")+" "+fmt(Math.abs(o.delta.v),o.delta.dp==null?1:o.delta.dp)+(o.delta.unit||"")}));
  }
  c.appendChild(h);
  const blank=(o.val==="—"||o.val==null||o.val==="");
  c.appendChild(el("div",{class:"kc-v"+(tone?" "+tone:"")+(blank?" kc-na":"")},
    [el("b",{text:blank?"Not applicable":o.val}),
     (!blank&&o.unit)?el("i",{text:o.unit}):null].filter(Boolean)));

  if(o.cmp){
    const {seen,declared}=o.cmp, mx=Math.max(seen,declared,1);
    const bar=el("div",{class:"kc-bar"},[
      el("i",{style:`width:${clamp(seen/mx*100,0,100)}%;background:${ryg(seen,declared)}`}),
      el("u",{style:`left:${clamp(declared/mx*100,0,100)}%`})]);
    c.appendChild(el("div",{class:"kc-cmp"},[bar,
      el("div",{class:"kc-cax"},[
        el("span",{html:"seen <b>"+o.cmp.seenTxt+"</b>"}),
        el("span",{html:"declared <b>"+o.cmp.decTxt+"</b>"})])]));
  } else if(o.tri){
    /* three cards that are three slices of one whole all show the whole and
       emphasise their own slice, so a reader can see that they sum to 100 */
    const tot=o.tri.reduce((a,x)=>a+x.v,0)||1;
    const hi=o.triHi==null?-1:o.triHi;
    c.appendChild(el("div",{class:"kc-tri"},o.tri.map((x,i)=>
      el("i",{class:hi<0?null:(i===hi?"hi":"dim"),
        style:`flex:${x.v/tot};background:${x.c}`,title:x.k+" "+pc(x.v/tot*100)}))));
    if(o.triAx) c.appendChild(el("div",{class:"kc-tri-ax"},o.tri.map((x,i)=>
      el("i",{},[el("b",{style:"background:"+x.c+((hi>=0&&i!==hi)?";opacity:.3":"")}),
        document.createTextNode(x.k+" "+pc(x.v/tot*100))]))));
  } else if(o.band){
    c.appendChild(kBand(o.band));
  } else if(o.range){
    const r=kRange(o.range); if(r) c.appendChild(r);
  } else if(o.day){
    c.appendChild(kDay(o.day));
  } else if(o.units){
    c.appendChild(kUnits(o.units));
  } else if(o.mini){
    const m=kMini(o.mini); if(m) c.appendChild(m);
  } else if(o.spark){
    c.appendChild(sparkline(o.spark.vals,o.spark.cur,o.spark.ref));
  } else if(o.meter!=null&&isFinite(o.meter)){
    /* the reference is drawn, not implied: a meter with no reference is a
       claim about a denominator nobody stated */
    const mk=[el("i",{style:"width:"+clamp(o.meter,0,100)+"%"})];
    if(o.meterRef!=null&&isFinite(o.meterRef))
      mk.push(el("u",{style:"left:"+clamp(o.meterRef,0,100)+"%"}));
    c.appendChild(el("div",{class:"km "+(o.meterK||"")},mk));
    if(o.meterAx) c.appendChild(el("div",{class:"km-ax"},
      o.meterAx.map(t=>el("span",{html:t}))));
  }
  /* secondary marks — a frequency across days, or the declared list itself,
     can sit under any primary mark */
  /* one card genuinely needs two marks: Active Time % is a slice of a whole
     AND its own note says the sparkline tells a one-day dip from a pattern.
     The chain picked tri and dropped the spark without a trace. */
  if(o.spark&&o.tri) c.appendChild(sparkline(o.spark.vals,o.spark.cur,o.spark.ref));
  if(o.days) c.appendChild(kDays(o.days));
  if(o.tags){const t=kTags(o.tags); if(t) c.appendChild(t);}

  const f=el("div",{class:"kc-f"});
  if(o.chip) f.appendChild(el("span",{class:"kc-chip t-"+(o.chip.tone||"n"),
    html:'<i class="dt"></i>'+o.chip.t}));
  if(o.foot) f.appendChild(el("em",{text:o.foot}));
  /* a figure the camera produced can show you the camera it came from */
  if(o.cam&&SP[o.cam.space]&&S.geo.lvl==="ctr"){
    const b=el("button",{class:"kc-cam","aria-expanded":"false",
      title:"Open the camera signals behind this figure"},
      [el("i"),el("span",{text:"Camera Signals"})]);
    b.addEventListener("click",ev=>{ev.stopPropagation();openCamDrawer(b,o);});
    f.appendChild(b);
  }
  if(f.childNodes.length) c.appendChild(f);
  if(o.note) hoverable(c,`<div class="hd">${o.lbl}</div>${o.note}`);
  return c;
}

function cx(title,legend,build,tableFn,note){
  const box=el("div",{class:"cx"});
  const h=el("div",{class:"cx-h"},[el("b",{text:title})]);
  const btn=el("button",{class:"tv","aria-pressed":"false",text:"Table"});
  h.appendChild(btn);box.appendChild(h);
  if(note) hoverable(h,`<div class="hd">${title}</div>${note}`);
  if(legend&&legend.length>1) box.appendChild(el("div",{class:"cx-lg"},legend.map(l=>
    el("i",{},[el("b",{style:"background:"+l.c}),document.createTextNode(l.k)]))));
  const viz=el("div");box.appendChild(viz);
  const tw=el("div",{class:"tbl-wrap hide"});box.appendChild(tw);
  let built=false,vizW=0;
  const sync=()=>{
    const on=S.tables||btn.getAttribute("aria-pressed")==="true";
    if(on&&!built&&tableFn){tw.appendChild(tableFn());built=true;}
    tw.classList.toggle("hide",!on);viz.classList.toggle("hide",on);
    btn.textContent=on?"Chart":"Table";
    if(!on&&build){const w=Math.max(300,Math.round(viz.clientWidth||0));
      if(w&&w!==vizW){vizW=w;viz.innerHTML="";
        const node=build(w);
        if(node&&node.setAttribute){node.setAttribute("aria-label",title);
          const t=document.createElementNS(NS,"title");t.textContent=title;
          node.insertBefore(t,node.firstChild);}
        viz.appendChild(node);}}
  };
  btn.addEventListener("click",()=>{btn.setAttribute("aria-pressed",
    btn.getAttribute("aria-pressed")==="true"?"false":"true");sync();});
  SYNCS.push(sync);
  return box;
}

const rollSeries=key=>FEED_DATES.map(d=>{const r=roll(d,S.centre||null);
  const v=r[key];return v==null?0:v;});
const courseOfIn=()=>COURSES.filter(c=>inCentre(c.space));
/* several NAMEF patterns build the centre name out of the district, so a
   "district · name" label repeated the district and then lost the real name to
   an ellipsis. Prefix only when it actually adds something. */
const ctrLabel=c=>{const nm=String(c.name).split(",")[0].trim();
  return nm.indexOf(c.district)===0?nm:c.district+" \u00b7 "+nm;};

/* ================================================================
   NATIONAL LAYER — components
   ================================================================ */
const inr=n=>n>=1e7?(n/1e7).toFixed(2)+" Cr":n>=1e5?(n/1e5).toFixed(2)+" L":fmt(Math.round(n));

/* India's own bounding box — the outline should fill its frame, not float
   in the middle of a 1000x1000 box that is mostly ocean */
const IN_BOX=(()=>{const b=[1e9,1e9,-1e9,-1e9];
  Object.keys(GEOM).forEach(k=>{const x=GEOM[k].box;
    if(x[0]<b[0])b[0]=x[0]; if(x[1]<b[1])b[1]=x[1];
    if(x[2]>b[2])b[2]=x[2]; if(x[3]>b[3])b[3]=x[3];});
  const pad=14;return [b[0]-pad,b[1]-pad,(b[2]-b[0])+pad*2,(b[3]-b[1])+pad*2];})();

/* One scale per metric, built from the spread the 36 states actually show.
   Scoring against the absolute reference collapsed the whole country into a
   single hue; a reviewer needs to see WHICH states differ, and the reference
   line on the legend keeps the absolute reading. */
const SCALES={};
METRICS.forEach(m=>{
  const vals=Object.keys(ST_AGG).map(k=>ST_AGG[k][m.k]);
  const lo=Math.floor(Math.min.apply(null,vals)), hi=Math.ceil(Math.max.apply(null,vals));
  const span=(hi-lo)||1;
  SCALES[m.k]={lo,hi,ref:m.ref,
    col:v=>RYG[clamp(Math.floor((v-lo)/span*6),0,5)],
    pos:v=>clamp((v-lo)/span*100,0,100)};
});
const scale=()=>SCALES[S.metric];
const metricOf=(o,k)=>o[k==null?S.metric:k];

}

/* ---- the choropleth ---- */
function indiaMap(){
  const g=S.geo, m=MET[S.metric], SC=scale();
  /* the frame keeps India's aspect at every drill level, so the map does not
     change shape under the presenter when a state is opened */
  const AR=IN_BOX[2]/IN_BOX[3];
  const stage=el("div",{class:"mapstage",style:"aspect-ratio:"+IN_BOX[2]+"/"+IN_BOX[3]});
  const zoomSt=g.lvl==="in"?null:g.st;
  let vb=IN_BOX.join(" ");
  if(zoomSt){
    const b=GEOM[zoomSt].box, w=b[2]-b[0], h=b[3]-b[1];
    const pad=Math.max(w,h*AR)*0.04;
    let vh=Math.max(h,w/AR)+pad*2, vw=vh*AR;
    vb=(b[0]+w/2-vw/2)+" "+(b[1]+h/2-vh/2)+" "+vw+" "+vh;
  }
  const svg=sv("svg",{viewBox:vb,role:"img","aria-label":
    (zoomSt?GEO[zoomSt][0]:"India")+" — "+m.n});
  const strokeW=parseFloat(vb.split(" ")[2])/620;

  Object.keys(GEO).forEach(code=>{
    const a=ST_AGG[code], v=a?metricOf(a):null;
    const dim=zoomSt&&code!==zoomSt;
    const p=sv("path",{d:GEO[code][1],
      fill:dim?"#e7edf3":(code===zoomSt?"#e9eff5":(v==null?"#dfe6ec":SC.col(v))),
      stroke:"#ffffff","stroke-width":strokeW,
      class:"mp-st"+(code===zoomSt?" mp-sel":""),
      opacity:dim?".55":"1",
      tabindex:dim?null:"0",role:"button",
      "aria-label":GEO[code][0]+" "+(v==null?"no data":pc(v))});
    if(!dim){
      const pick=()=>setScope({lvl:"st",st:code,ctr:null});
      p.addEventListener("click",pick);
      p.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}});
      hoverable(p,()=>'<div class="hd">'+GEO[code][0]+'</div>'+
        METRICS.map(x=>x.n+" <b>"+pc(a[x.k])+"</b>").join("<br>")+
        "<br>"+a.n+" centres · "+inr(a.enrolled)+" enrolled");
    }
    svg.appendChild(p);
  });

  /* centre dots only once a state is open — 1,100 dots on India is a smear */
  if(zoomSt){
    const side=parseFloat(vb.split(" ")[2]);
    (ST_LIST[zoomSt]||[]).forEach(c=>{
      const v=metricOf(c.m);
      const gnode=sv("g",{class:"mp-dot",tabindex:"0",role:"button",
        "aria-label":c.name+" "+pc(v)});
      gnode.appendChild(sv("circle",{cx:c.x,cy:c.y,r:side/95,fill:SC.col(v),
        stroke:"#ffffff","stroke-width":side/420}));
      const pick=()=>setScope({lvl:"ctr",st:c.st,ctr:c.id});
      gnode.addEventListener("click",pick);
      gnode.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}});
      hoverable(gnode,'<div class="hd">'+c.name+'</div>'+c.district+" · "+c.code+"<br>"+
        m.n+" <b>"+pc(v)+"</b><br>"+c.enrolled+" of "+c.sanctioned+" seats · "+
        c.trades.map(t=>TC[t].n).join(", "));
      svg.appendChild(gnode);
    });
  }
  stage.appendChild(svg);
  stage.appendChild(el("div",{class:"mp-badge"},[el("i"),document.createTextNode("Historical · to T−1")]));
  stage.appendChild(el("div",{class:"mp-count",
    text:zoomSt?((ST_LIST[zoomSt]||[]).length+" centres · "+
        new Set((ST_LIST[zoomSt]||[]).map(c=>c.district)).size+" districts")
      :("36 states · "+NAT_DISTRICTS+" districts · "+fmt(NCENTRES.length)+" centres")}));
  if(zoomSt) stage.appendChild(el("button",{class:"mp-back",text:"‹ All India",
    onclick:()=>setScope({lvl:"in",st:null,ctr:null})}));
  return stage;
}

function mapRail(){
  const m=MET[S.metric], nat=NAT_AGG[S.metric];
  const rail=el("div",{class:"rail"});

  const SC=scale();
  const ramp=el("div",{class:"ramp"},RYG.map(c=>el("i",{style:"background:"+c})));
  const refIn=SC.ref>=SC.lo&&SC.ref<=SC.hi;
  const rampBox=el("div",{class:"rampbox"},[ramp,
    refIn?el("u",{class:"ramp-ref",style:"left:"+SC.pos(SC.ref)+"%",
      title:"reference "+pc(SC.ref)}):null].filter(Boolean));
  rail.appendChild(el("div",{},[
    el("h5",{text:m.n+" scale"}),rampBox,
    el("div",{class:"ramp-ax"},[
      el("span",{text:pc(SC.lo)+" lowest state"}),
      el("span",{text:pc(SC.hi)+" highest"})]),
    el("div",{class:"rail-avg"},[
      el("b",{text:pc(nat),style:"color:"+SC.col(nat)}),

    : Object.keys(ST_AGG).filter(k=>ST_AGG[k].n>=8)
        .map(k=>({k,v:ST_AGG[k][S.metric],n:GEO[k][0]}))
        .sort((a,b)=>b.v-a.v);
  const go=r=>inState?setScope({lvl:"ctr",st:S.geo.st,ctr:r.k})

  const mk=(title,list)=>el("div",{},[el("h5",{text:title}),

  const unit=inState?"centres":"states";

  /* what the scope is actually built on — the ceiling on everything above */
  const a=scopeAgg();
  rail.appendChild(el("div",{},[el("h5",{text:"Evidence base"}),
    el("div",{class:"cov"},[
      ["Spaces under camera",fmt(a.watched)+" of "+fmt(a.spaces),
        a.watched/a.spaces>=0.9?"ok":a.watched/a.spaces>=0.7?"warn":"crit"],
      ["Centres in scope",fmt(a.n),"ok"],
      ["Learners enrolled",inr(a.enrolled),"ok"],
      /* number of trades running across the centres in scope — a 5-trade
         centre contributes 5. Not an activity measure. */
      ["Ongoing trainings",fmt(scopeList().reduce((t,c)=>t+c.trades.length,0)),"ok"]
    ].map(r=>el("div",{class:"cov-r"},[
      el("i",{class:"t-"+r[2]}),el("u",{text:r[0]}),el("b",{text:r[1]})]))
  )]));
  return rail;
}

}

/* ---- declared trade against observed trade ----
   The centre's word against the camera's, with nothing asked of the centre.
   This is the argument the whole product rests on, so it gets a table a
   reviewer can read across in one pass rather than a paragraph. ---- */
function concordPanel(){
  const rooms=roomsIn();
  const p=el("div",{class:"panel"});
  p.appendChild(el("div",{class:"panel-h"},[
    el("b",{text:"Trade Identified Against Trade Allocated"}),
    el("em",{text:"frame classifier against the allocation locked at accreditation"})]));
  const t=el("table",{class:"lb tc"});
  t.appendChild(el("thead",{},[el("tr",{},
    ["Instructional space","Trade allocated at accreditation","Trade identified from camera",
     "Classifier confidence","Finding"].map(h=>el("th",{text:h})))]));
  const tb=el("tbody");
  rooms.forEach(id=>{
    const m=tradeMatch(id), co=courseOf(id);
    const st=m?m.state:"unobserved";
    const tone=st==="match"?"ok":st==="mismatch"?"crit":"warn";
    const finding=st==="match"?"Concordant":st==="mismatch"?"Trade mismatch":"No session observed";
    const tr=el("tr",{},[
      el("td",{class:"nm"},[document.createTextNode(SP[id].name),
        el("em",{text:SP[id].type.replace("-"," ")+" · "+camLabel(id)})]),
      el("td",{text:co?co.name:"—"}),
      el("td",{text:m&&m.obs?TC[m.obs].n:"—",
        style:st==="mismatch"?"font-weight:700;color:"+ST.critical:""}),
      el("td",{text:m&&m.conf?m.conf.toFixed(2):"—"}),
      el("td",{},[el("span",{class:"kc-chip t-"+tone,html:'<i class="dt"></i>'+finding})])]);
    hoverable(tr,'<div class="hd">'+SP[id].name+'</div>'+
      (st==="mismatch"
        ? "The accreditation file declares "+co.name+" in this space. The classifier reads "+
          TC[m.obs].n+" from the frames. Neither figure came from the centre."
       :st==="unobserved"
        ? "No cohort was held in this space across the four days of feed, so the classifier has nothing to read."
        : "Frames agree with the accreditation record."));
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  p.appendChild(el("div",{class:"panel-b",style:"padding:0 6px 4px"},[t]));
  return p;
}

      "aria-expanded":"false"});
    card.appendChild(el("div",{class:"mr-h"},[

      el("u",{text:x.n}),
      el("i",{class:"mr-x",text:"▾"})]));
    card.appendChild(el("div",{class:"mr-v"},[

/* the distribution behind a headline rate */
let MDRAWER=null;
function closeMetricDrawer(){
  if(!MDRAWER) return;
  if(MDRAWER.btn) MDRAWER.btn.setAttribute("aria-expanded","false");
  SYNCS.length=MDRAWER.n0;
  MDRAWER.node.remove(); MDRAWER=null; S.mopen=null;
  if(DECK_SYNC) DECK_SYNC();
}
function toggleMetricDrawer(btn,mk){
  const same=MDRAWER&&MDRAWER.key===mk;
  closeMetricDrawer();
  if(same) return;
  const host=btn.closest(".geo");
  if(!host) return;
  const n0=SYNCS.length;
  const node=metricDetail(mk,()=>{closeMetricDrawer();if(btn)btn.focus();});
  host.parentNode.insertBefore(node,host.nextSibling);
  btn.setAttribute("aria-expanded","true");
  MDRAWER={node,btn,key:mk,n0};
  S.mopen=mk;
  SYNCS.slice(n0).forEach(f=>{try{f();}catch(e){}});
  if(DECK_SYNC) DECK_SYNC();
  bringIntoView(node);
}
function metricDetail(mk,onClose){
  const m=MET[mk], SC=SCALES[mk];
  const atIndia=S.geo.lvl==="in";
  const items=atIndia
    ? Object.keys(ST_AGG).map(k=>({n:GEO[k][0],v:ST_AGG[k][mk],k,go:()=>setScope({lvl:"st",st:k,ctr:null})}))
    : (ST_LIST[S.geo.st]||[]).map(c=>({n:ctrLabel(c),v:c.m[mk],k:c.id,
        go:()=>setScope({lvl:"ctr",st:c.st,ctr:c.id})}));
  items.sort((a,b)=>b.v-a.v);

  /* ten buckets across the observed range — a distribution answers
     "is this one bad state or the whole country" in one glance */
  const B=10, lo=SC.lo, hi=SC.hi, w=(hi-lo)/B||1;
  const buckets=new Array(B).fill(0);
  items.forEach(it=>buckets[clamp(Math.floor((it.v-lo)/w),0,B-1)]++);
  const cats=buckets.map((_,i)=>Math.round(lo+w*i)+"–"+Math.round(lo+w*(i+1)));

  const box=el("div",{class:"mdrawer"});
  const close=el("button",{class:"cd-x",text:"Close","aria-label":"Close this breakdown"});
  close.addEventListener("click",onClose);
  box.appendChild(el("div",{class:"md-h"},[
    el("b",{text:m.n}),el("em",{text:m.sub}),close]));

  const grid=el("div",{class:"md-b"});
  grid.appendChild(cx("Distribution across "+(atIndia?"36 states and UTs":"centres in "+GEO[S.geo.st][0]),
    null,
    W=>columns({W,cats,
      series:[{k:"Count",c:CSSV("--s1"),v:buckets}],h:208}),
    ()=>mkTable(["Band","Count"],cats.map((c,i)=>[c+"%",String(buckets[i])])),
    "How many "+(atIndia?"states":"centres")+" fall in each band of "+m.n.toLowerCase()+
    ". Reference is "+pc(m.ref)+"."));

  const rank=(title,list)=>{
    const t=el("table",{class:"lb md-lb"});
    t.appendChild(el("thead",{},[el("tr",{},
      [title,"Rate",""].map(h=>el("th",{text:h})))]));
    const tb=el("tbody");
    list.forEach((r,i)=>{
      const tr=el("tr",{},[
        el("td",{class:"nm",text:r.n}),
        el("td",{text:pc(r.v),style:"color:"+SC.col(r.v)+";font-weight:700"}),
        el("td",{},[el("span",{class:"sw",style:"background:"+SC.col(r.v)})])]);
      tr.addEventListener("click",r.go);
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    return el("div",{},[el("h5",{class:"md-t",text:title}),t]);
  };
  grid.appendChild(el("div",{class:"md-r"},[
    rank("Strongest 5",items.slice(0,5)),
    rank("Weakest 5",items.slice(-5).reverse())]));
  box.appendChild(grid);
  return box;
}

function pageAttendance(){
  const d=S.date, v=el("div");
  const rooms=roomsIn().filter(r=>D[d][r]);
  const live=rooms.filter(r=>D[d][r].running);
  const cs=courseOfIn();
  const P=prevDay();

  const enr=cs.map(c=>c.enrolled);
  const aeb=cs.map(c=>AEBAS[d][c.code]);
  const cam=cs.map(c=>{const r=D[d][c.space];return r?r.peak:0;});
  const gap=cs.map((c,i)=>aeb[i]-cam[i]);
  const worst=gap.indexOf(Math.max(...gap));
  const totEnr=enr.reduce((a,b)=>a+b,0), totAeb=aeb.reduce((a,b)=>a+b,0),
        totCam=cam.reduce((a,b)=>a+b,0);

  /* durNoLunch was read but never produced — subtract the lunch window from
     the measured presence so the figure matches the caption beside it */
  const durs=live.map(r=>{
    const rr=D[d][r], lunch=Math.max(0,LUNCH[1]-LUNCH[0]);
    return Math.max(0,(rr.presentMin||0)-(rr.running?lunch:0));});
  const avgDur=durs.length?avg(durs)/60:null;

  /* ---- Active Hours & Instructor Presence (register Page 2) ---- */
  const zR=roomsIn().map(r=>D[d][r]).filter(Boolean);
  const zDay=Math.max(1,zR.length*(DAY_TO-DAY_FROM));
  const zAct=zR.reduce((a,r)=>a+(r.activeMin||0),0);
  const zUns=zR.reduce((a,r)=>a+(r.unsupMin||0),0);
  const zIdl=Math.max(0,zDay-zAct-zUns);
  const pAct=zAct/zDay*100, pUns=zUns/zDay*100, pIdl=zIdl/zDay*100;

  /* ---- Committed vs. Actual (register Page 2) ---- */
  const cmtHours=zR.reduce((a,r)=>a+(r.committedMin||0),0)/60, actHours=zAct/60;
  const cmtHead=cs.reduce((a,c)=>a+c.enrolled,0);
  const actHead=cs.reduce((a,c)=>{const r=D[d][c.space];return a+(r?r.peak:0);},0);
  const cmtTrainers=cs.length;
  const actTrainers=live.length;

  v.appendChild(sec("Command Summary","camera"));
  v.appendChild(kg(4,[
    kcard({lbl:"Cohort Detection Count",cam:{space:busiestRoom(),signal:"headcount"},src:"measured",val:live.length,unit:"of "+cs.length+" declared",
      tone:rygTone(live.length,cs.length),
      cmp:{seen:live.length,declared:cs.length,
        seenTxt:live.length+" seen",decTxt:cs.length+" courses"},
      chip:live.length<cs.length?{t:(cs.length-live.length)+" not observed",tone:"crit"}
                                :{t:"all present",tone:"ok"},
      note:"A cohort is more than "+COHORT_THR+" people held together in one space. The camera does not know the course name — only that a group persisted."}),
    kcard({lbl:"Avg Cohort Duration",cam:{space:busiestRoom(),signal:"headcount"},src:"measured",val:avgDur==null?"—":fmt(avgDur,1),unit:"h",
      spark:{vals:FEED_DATES.map(x=>{const rs=roomsIn().filter(r=>D[x][r]&&D[x][r].running);
        return rs.length?avg(rs.map(r=>D[x][r].presentMin))/60:0;}),cur:dayIdx()},
      foot:"continuous presence, lunch removed"}),
    kcard({lbl:"Avg Cohort Headcount",cam:{space:busiestRoom(),signal:"headcount"},src:"measured",
      val:live.length?fmt(avg(live.map(r=>D[d][r].avgIn)),1):"—",unit:"learners",
      spark:{vals:rollSeries("avgAtt"),cur:dayIdx()},
      foot:"while the cohort is in the room"}),
    kcard({lbl:"Peak Headcount Trend",cam:{space:busiestRoom(),signal:"headcount"},src:"measured",val:fmt(roll(d,S.centre||null).peak,1),
      delta:P?{v:roll(d,S.centre||null).peak-roll(P,S.centre||null).peak}:null,
      spark:{vals:rollSeries("peak"),cur:dayIdx()},
      foot:"day on day"}),
  ]));

  const actByDay=FEED_DATES.map(dd=>{
    const rs=roomsIn().map(r=>D[dd][r]).filter(Boolean);
    const tot=Math.max(1,rs.length*(DAY_TO-DAY_FROM));
    return rs.reduce((a,r)=>a+(r.activeMin||0),0)/tot*100;
  });
  const lowDays=actByDay.filter(x=>x<40).length;
  /* Active, Unsupervised and Idle are three slices of one day. All three cards
     draw the same whole and emphasise their own slice, so a reader can see
     that they sum instead of reading three unrelated percentages. */
  const ZTRI=[{k:"Active",v:zAct,c:ST.good},{k:"Unsupervised",v:zUns,c:ST.warning},
              {k:"Idle",v:zIdl,c:CSSV("--rule")}];
  v.appendChild(sec("Active Hours & Instructor Presence","proposed instructor detector · share of the observed day"));
  v.appendChild(kg(4,[
    kcard({lbl:"Active Time %",src:"modelled",cam:{space:busiestRoom(),signal:"instructor"},
      val:pc(pAct),tone:rygTone(pAct,75),
      tri:ZTRI,triHi:0,triAx:true,
      spark:{vals:actByDay,cur:FEED_DATES.indexOf(d),ref:75},
      chip:lowDays>=3?{t:"low on "+lowDays+" of "+FEED_DATES.length+" days — pattern, act",tone:"crit"}
          :(pAct<40?{t:"single-day dip — watch, don't act",tone:"warn"}
                   :{t:hrs(zAct)+"h of "+hrs(zDay)+"h",tone:rygTone(pAct,75)}),
      note:"Share of the day a room had a cohort AND an instructor present together. One low day can be a sick day — not actionable. A repeated pattern across days is a red flag, and the sparkline shows which it is."}),
    kcard({lbl:"Unsupervised Time %",src:"modelled",cam:{space:busiestRoom(),signal:"instructor"},
      val:pc(pUns),tone:pUns>10?"crit":pUns>5?"warn":"good",
      tri:ZTRI,triHi:1,
      chip:pUns>0?{t:"learning that should be happening",tone:"warn"}:{t:"none observed",tone:"ok"},
      note:"Share of the day a room had a cohort present but no instructor."}),
    kcard({lbl:"Idle Time %",src:"modelled",cam:{space:busiestRoom(),signal:"headcount"},
      val:pc(pIdl),tone:pIdl>40?"crit":pIdl>25?"warn":"good",
      tri:ZTRI,triHi:2,
      foot:"nobody in the room at all"}),
    kcard({lbl:"Instructor Presence Timeline",src:"modelled",
      cam:{space:busiestRoom(),signal:"instructor"},
      val:live.length,unit:"of "+cs.length+" rooms",
      tone:rygTone(live.length,cs.length),
      units:{on:live.length,total:cs.length,
        k:live.length===cs.length?"ok":"warn"},
      chip:{t:"sampled every 5–10 min",tone:"n"},
      foot:"brief step-outs merged into Present"}),
  ]));

  v.appendChild(sec("Committed vs. Actual","committed at accreditation, against the camera record"));
  v.appendChild(kg(3,[
    kcard({lbl:"Committed Training Hours",src:"declared",val:fmt(cmtHours,1),unit:"h/day",
      cmp:{seen:actHours,declared:cmtHours,
        seenTxt:fmt(actHours,1)+"h actual",decTxt:fmt(cmtHours,1)+"h committed"},
      chip:{t:pc(cmtHours?actHours/cmtHours*100:0)+" delivered",
            tone:rygTone(cmtHours?actHours/cmtHours*100:0,75)},
      note:"Hours a course is supposed to run per day, from its declared schedule, summed across courses — against the hours the camera shows the room genuinely Active."}),
    kcard({lbl:"Committed Headcount",src:"declared",val:fmt(cmtHead),unit:"learners",
      cam:{space:busiestRoom(),signal:"headcount"},
      cmp:{seen:actHead,declared:cmtHead,
        seenTxt:ppl(actHead)+" actual",decTxt:fmt(cmtHead)+" committed"},
      chip:{t:pc(cmtHead?actHead/cmtHead*100:0)+" present",
            tone:rygTone(cmtHead?actHead/cmtHead*100:0,75)},
      note:"Enrolled headcount for each course against the headcount the camera detected in that same session. Centre-wide total across all six batches — no single batch exceeds the 45-seat cap."}),
    kcard({lbl:"Committed Trainer Count",src:"declared",val:cmtTrainers,unit:"trainers",
      cam:{space:instrCam(),signal:"instructor"},
      cmp:{seen:actTrainers,declared:cmtTrainers,
        seenTxt:actTrainers+" detected",decTxt:cmtTrainers+" committed"},
      chip:actTrainers<cmtTrainers?{t:(cmtTrainers-actTrainers)+" not detected",tone:"crit"}
                                  :{t:"all detected",tone:"ok"},
      note:"Trainers the centre committed to at accreditation — one per sanctioned course — against the trainers the camera feed detects. Not read from a daily timetable."}),
  ]));

  v.appendChild(sec("Triangulated Attendance","enrolment roll · biometric · camera"));
  v.appendChild(kg(3,[
    kcard({lbl:"Enrolled",src:"declared",val:fmt(totEnr),unit:"on the register",
      mini:{vals:enr,labs:cs.map(c=>c.code)},
      foot:"declared at accreditation"}),
    kcard({lbl:"Biometric Attendance Count",src:"biometric",val:fmt(totAeb),unit:"AEBAS",
      cmp:{seen:totAeb,declared:totEnr,seenTxt:fmt(totAeb),decTxt:fmt(totEnr)+" enrolled"},
      foot:"face-authentication device"}),
    kcard({lbl:"Camera Headcount",cam:{space:busiestRoom(),signal:"headcount"},src:"measured",val:fmt(totCam,1),unit:"peak seen",
      tone:rygTone(totCam,totAeb),
      cmp:{seen:totCam,declared:totAeb,seenTxt:fmt(totCam,1),decTxt:fmt(totAeb)+" checked in"},
      chip:gap[worst]>=6?{t:"+"+ppl(gap[worst])+" gap · "+SP[cs[worst].space].short,tone:"crit"}
           :gap[worst]>=3?{t:"+"+ppl(gap[worst])+" gap",tone:"warn"}
           :{t:"within noise",tone:"ok"}}),
  ]));

  v.appendChild(cgrid(2,[
    cx("Enrolment, Biometric and Camera Compared",
      [{k:"Enrolled",c:CSSV("--q2")},{k:"Biometric",c:SER[6]},{k:"Camera",c:SER[0]}],
      W=>columns({W,cats:cs.map(c=>c.code),series:[
        {k:"Enrolled",c:CSSV("--q2"),v:enr},
        {k:"Biometric",c:SER[6],v:aeb},
        {k:"Camera",c:SER[0],v:cam}],h:236,fmtV:x=>fmt(x,1)}),
      ()=>mkTable(["Course","Enrolled","Biometric","Camera peak","Biometric − camera"],
        cs.map((c,i)=>[c.name,String(enr[i]),String(aeb[i]),fmt(cam[i],1),ppl(gap[i])])),
      "The register, the face-authentication device and the camera, side by side. Where the third falls far below the second, the session needs an explanation."),
    cx("Biometric Claim Less Camera Observation",null,
      W=>bars({W,cats:cs.map(c=>SP[c.space].short),v:gap,
        fmtV:x=>(x>0?"+":"")+ppl(x),vlabel:"Gap",max:Math.max(...gap,4),minH:236,
        statusOf:x=>x>=6?ST.critical:x>=3?ST.warning:SER[0],
        threshold:3,thresholdLabel:"review over"}),
      ()=>mkTable(["Room","Biometric","Camera peak","Gap"],
        cs.map((c,i)=>[SP[c.space].name,String(aeb[i]),fmt(cam[i],1),ppl(gap[i])])),
      "Check-ins the biometric device claims minus the most people the camera ever saw at once."),
  ]));

  /* room state — active / unsupervised / idle */
  v.appendChild(sec("Per Room · Active, Unsupervised, Idle","camera + instructor model"));
  v.appendChild(kg(6,rooms.map(r=>{
    const m=D[d][r], tot=m.activeMin+m.unsupMin+m.idleMin||1;
    return kcard({lbl:SP[r].short+(courseOf(r)?" · "+courseOf(r).code:""),
      src:"modelled",val:pc(m.activeMin/tot*100),unit:"active",
      tone:rygTone(m.activeMin/tot*100,60),
      tri:[{k:"Active",v:m.activeMin,c:CSSV("--good")},
           {k:"Unsupervised",v:m.unsupMin,c:CSSV("--warning")},
           {k:"Idle",v:m.idleMin,c:CSSV("--q2")}],
      chip:m.unsupMin>30?{t:hrs(m.unsupMin)+"h unsupervised",tone:"warn"}:null,
      foot:hrs(m.idleMin)+"h idle",
      note:"Active = cohort and instructor together. Unsupervised = cohort present, no instructor. Idle = nobody in the room."});
  })));

  v.appendChild(cgrid(2,[
    cx("Peak Occupancy by Space and Day",null,
      W=>heat({rows:roomsIn(),cols:FEED_DATES.map(x=>DAYLBL[x]),
        val:roomsIn().map(r=>FEED_DATES.map(x=>{const rr=D[x][r];
          return rr&&rr.running?rr.avgIn:null;})),
        rowLab:r=>SP[r].short+(courseOf(r)?" · "+courseOf(r).code:""),
        fmtV:x=>fmt(x,1),vlabel:"Mean attendance",
        colorOf:(v,ri)=>refCol(v,(courseOf(roomsIn()[ri])||{enrolled:20}).enrolled*0.75),
        refLabel:"reference is 75% of each room's own enrolled roll",
        nullNote:"Camera was recording. No cohort crossed the "+COHORT_THR+"-person threshold."}),
      ()=>mkTable(["Room",...FEED_DATES.map(x=>DAYLBL[x])],
        roomsIn().map(r=>[SP[r].short,...FEED_DATES.map(x=>{const rr=D[x][r];
          return rr&&rr.running?fmt(rr.avgIn,1):"—";})])),
      "Mean in-session attendance. Hatched means the camera was up and no cohort ever formed."),
    cx("Peak Occupancy Trend",
      live.slice(0,3).map((r,i)=>({k:SP[r].short,c:SER[i]})),
      W=>lines({W,xs:FEED_DATES.map(x=>DAYLBL[x]),
        series:live.slice(0,3).map((r,i)=>({k:SP[r].short,c:SER[i],
          v:FEED_DATES.map(x=>D[x][r]?D[x][r].peak:null)})),h:236,fmtV:x=>fmt(x,1)}),
      ()=>mkTable(["Room",...FEED_DATES.map(x=>DAYLBL[x])],
        rooms.map(r=>[SP[r].short,...FEED_DATES.map(x=>D[x][r]?fmt(D[x][r].peak,1):"—")])),
      "Busiest 2-minute mean per room, tracked across the window."),
  ]));

  /* selected room detail */
  const cur=rooms.includes(S.space)?S.space:rooms[0];
  if(cur){
    const rr=D[d][cur], cc=courseOf(cur), cv=curveOf(cur,d,7*60,19*60,5);
    const mi=MI[d][cur];
    const hourBand=(camId,date)=>{
      const ser=SER10[camId]&&SER10[camId][date]; if(!ser) return [];
      const out=[];
      for(let h=7;h<19;h++){
        let sum=0,n=0,pk=0;
        for(let i=sl(h*60);i<sl((h+1)*60);i++){
          const x=ser[i]; if(x<0) continue;
          sum+=x/10; n++; if(x/10>pk) pk=x/10;
        }
        out.push({h:String(h).padStart(2,"0")+"–"+String(h+1).padStart(2,"0"),
                  avg:n?sum/n:null, pk:n?pk:null});
      }
      return out;
    };
    v.appendChild(sec(SP[cur].name+(cc?" · "+cc.name:""),"selected space"));
    v.appendChild(cgrid(2,[
      cx("Headcount Across the Instructional Day",null,
        W=>lines({W,xs:cv.lab,series:[{k:"Headcount",c:SER[0],v:cv.v}],
          area:true,markers:false,h:250,xEvery:10,fmtV:x=>fmt(x,1),
          bands:[{from:cv.idxOf(LUNCH[0]),to:cv.idxOf(LUNCH[1]),fill:"#f6f1e6",label:"Lunch"}]}),
        ()=>mkTable(["Time","Headcount"],cv.lab.map((t,i)=>
          [t,cv.v[i]==null?"—":fmt(cv.v[i],1)]).filter((_,i)=>i%6===0)),
        "Six-minute means straight from the export. Gaps are hatched, never drawn as zero."),
      cx("Candidates by Hour Band",null,
        W=>{const hb=hourBand(cur,d);
          if(!hb.some(b=>b.avg!=null)) return emptyViz("No feed on this day");
          /* keep unmeasured bands on the axis as nulls — dropping them made a
             partial export look like a full day that simply started late */
          const ref=rr.peak||Math.max.apply(null,hb.map(b=>b.pk||0).concat([1]));
          return bars({W,cats:hb.map(b=>b.h),v:hb.map(b=>b.avg),
            fmtV:x=>x==null?"no feed":fmt(x,1),max:niceMax(ref),vlabel:"Mean in band",minH:208,
            statusOf:x=>x==null?CSSV("--hair"):refCol(x,ref*0.6),
            threshold:ref,thresholdLabel:"day peak"});},
        ()=>mkTable(["Hour","Mean","Peak in band"],
          hourBand(cur,d).map(b=>[b.h,b.avg==null?"—":fmt(b.avg,1),
                                  b.pk==null?"—":fmt(b.pk,1)])),
        "Candidates in the room per hour band against the day's peak. Bands with no feed are shown empty, never as zero — a partial export must not read as an empty classroom."),
    ]));
    v.appendChild(kg(4,[
      kcard({lbl:"Peak, Selected Day",src:"measured",val:fmt(rr.peak,1),
        spark:{vals:cv.v,cur:rr.peakMin!=null?cv.idxOf(rr.peakMin):null},
        chip:(rr.avgIn&&rr.peak/rr.avgIn>1.8)
          ?{t:"peak "+fmt(rr.peak/rr.avgIn,1)+"× the mean",tone:"warn"}:null,
        foot:rr.peakMin!=null?"at "+hm(rr.peakMin):"",
        note:"A peak far above the mean usually means a morning spike that emptied out — the hour bands beside this show exactly where."}),
      kcard({lbl:"First Cohort Detection",src:"measured",
        val:rr.firstMin!=null?hm(rr.firstMin):"never",
        tone:rr.running?null:"crit",
        day:{span:[7*60,19*60],
          from:rr.firstMin!=null?rr.firstMin:null,
          to:rr.firstMin!=null?(rr.lastMin!=null?rr.lastMin:19*60):null,
          at:rr.peakMin!=null?rr.peakMin:null,
          k:rr.running?null:"warn"},
        chip:rr.running?{t:"session ran",tone:"ok"}:{t:"no session",tone:"crit"}}),
      kcard({lbl:"Avg Cohort Duration",src:"measured",val:hrs(rr.presentMin),unit:"h",
        cmp:{seen:rr.presentMin/60,declared:rr.committedMin/60,
          seenTxt:hrs(rr.presentMin)+"h",decTxt:hrs(rr.committedMin)+"h"}}),
      kcard({lbl:"Active Time %",cam:{space:instrCam(),signal:"instructor"},src:"modelled",
        val:(mi&&mi.coverage!=null)?pc(mi.coverage*100):"—",
        tone:(mi&&mi.coverage!=null)?rygTone(mi.coverage*100,85):null,
        meter:(mi&&mi.coverage!=null)?mi.coverage*100:null,
        meterK:(mi&&mi.coverage>0.85)?"ok":"warn",
        meterRef:85,meterAx:["instructor and cohort together","<b>85%</b> reference"]}),
    ]));
    if(mi) v.appendChild(cgrid(1,[
      cx("Instructor Presence by Trade"+(S.date===ALLD?" · latest day only":""),null,()=>presenceStrip(mi.bits,mi.from,mi.step),null,
        "Ten-minute blocks. Grey means no cohort was in the room, so the question does not apply.")
    ]));
  }

  return v;
}


/* ================================================================
   PAGE 3 — QUALITY  (5 KPIs, every one needs the proposed detector)
   ================================================================ */
function pageQuality(){
  const d=S.date, v=el("div");
  const live=roomsIn().filter(r=>D[d][r]&&D[d][r].running);
  const equip=live.filter(r=>SP[r].stations>0);
  const inter=r=>(MCH[r]?MCH[r].inter:0.6)*100;
  const equipV=r=>(MCH[r]?MCH[r].equip:0.6)*100;
  const theory=live.filter(r=>SP[r].stations===0);

  const QL=[], QR=[];
  QL.push(sec("Training Quality","proposed detector"));
  QL.push(kg(5,[
    kcard({lbl:"Instructor Interactivity Ratio",cam:{space:instrCam(),signal:"instructor"},src:"modelled",
      val:live.length?pc(avg(live.map(inter))):"—",
      tone:live.length?rygTone(avg(live.map(inter)),65):null,
      meter:live.length?avg(live.map(inter)):0,
      meterK:live.length&&avg(live.map(inter))>=65?"ok":"warn",
      meterRef:65,meterAx:["moving or at the instruction zone","<b>65%</b>"]}),
    kcard({lbl:"Equipment Utilization Rate",cam:{space:equipCam(),signal:"stations"},src:"modelled",
      val:equip.length?pc(avg(equip.map(equipV))):"—",
      tone:equip.length?rygTone(avg(equip.map(equipV)),70):null,
      meter:equip.length?avg(equip.map(equipV)):0,
      meterK:equip.length&&avg(equip.map(equipV))>=70?"ok":"warn",
      meterRef:70,meterAx:[equip.length+" equipped spaces","<b>70%</b>"]}),
    kcard({lbl:"Zone Utilization Rate",cam:{space:equipCam(),signal:"stations"},src:"modelled",
      val:equip.length?pc(avg(equip.map(r=>equipV(r)*0.94))):"—",
      meter:equip.length?avg(equip.map(r=>equipV(r)*0.94)):null,
      meterK:equip.length&&avg(equip.map(r=>equipV(r)*0.94))>=70?"ok":"warn",
      meterRef:70,meterAx:["per-station occupancy","<b>70%</b>"],
      note:"Per-station occupancy inside a lab — which workbench actually had somebody at it. Needs spatial detection inside the room; the current feed reports one number per camera."}),
    kcard({lbl:"Workstation Utilization Rate",cam:{space:equipCam(),signal:"stations"},src:"modelled",
      val:(()=>{const c=equip.filter(r=>SP[r].type==="computer-lab");
        return c.length?pc(avg(c.map(equipV))):"—";})(),
      meter:(()=>{const c=equip.filter(r=>SP[r].type==="computer-lab");
        return c.length?avg(c.map(equipV)):null;})(),
      meterK:(()=>{const c=equip.filter(r=>SP[r].type==="computer-lab");
        return c.length&&avg(c.map(equipV))>=70?"ok":"warn";})(),
      meterRef:70,meterAx:["computer labs","<b>70%</b> reference"]}),
    kcard({lbl:"Infra / Asset Readiness",src:"modelled",
      cam:{space:equipCam(),signal:"stations"},
      /* a readiness check is a count of assets sighted, never a rate: the card
         was rendering pc() under a note that says it is not a utilisation
         figure, which is the same defect class as a tone: that contradicts its
         own caption. Presence is now drawn as the committed assets themselves. */
      val:(()=>{const rooms=roomsIn().filter(r=>SP[r].stations>0);
        const committed=rooms.reduce((a,r)=>a+SP[r].stations,0);
        return fmt(committed-1);})(),
      unit:(()=>{const rooms=roomsIn().filter(r=>SP[r].stations>0);
        return "of "+rooms.reduce((a,r)=>a+SP[r].stations,0)+" sighted";})(),
      /* glyphs count EQUIPPED ROOMS, not individual stations: forty-seven
         glyphs would wrap four rows deep and a scaled glyph would round the
         one missing booth away entirely. One hollow room is the finding. */
      units:(()=>{const rooms=roomsIn().filter(r=>SP[r].stations>0);
        return {on:Math.max(0,rooms.length-1),total:rooms.length,k:"warn"};})(),
      tone:"warn",
      chip:{t:"1 welding booth not sighted",tone:"warn"},
      foot:"one glyph per equipped room",
      note:"Is the committed asset physically present and visible — a readiness check, not a utilisation rate. Some assets are legitimately unused in a given lesson (a GDA bed during dummy practice), so utilisation would mislead; presence cannot."}),
    kcard({lbl:"Classroom Interactivity Ratio",src:"modelled",
      val:theory.length?pc(avg(theory.map(inter))):"—",
      meter:theory.length?avg(theory.map(inter)):null,
      meterK:theory.length&&avg(theory.map(inter))>=65?"ok":"warn",
      meterRef:65,meterAx:["where there is no equipment","<b>65%</b>"],
      note:"Stands in for equipment utilisation in theory rooms, which have no machinery to measure."}),
  ]));

  QL.push(cgrid(1,[
    cx("Interactivity Index by Trade",null,
      W=>bars({W,cats:live.map(r=>SP[r].short),v:live.map(inter),
        fmtV:x=>pc(x),max:100,vlabel:"Interactive",minH:208,
        statusOf:x=>ryg(x,65),threshold:65,thresholdLabel:"flag under"}),
      ()=>mkTable(["Room","Type","Interactivity"],
        live.map(r=>[SP[r].name,SP[r].type,pc(inter(r))])),
      "Share of session time the instructor is standing, moving or at the board rather than seated."),
    cx("Equipment Utilisation by Trade",null,
      W=>bars({W,cats:equip.map(r=>SP[r].short),v:equip.map(equipV),
        fmtV:x=>pc(x),max:100,vlabel:"Equipment active",minH:208,
        statusOf:x=>ryg(x,70),threshold:70,thresholdLabel:"flag under"}),
      ()=>mkTable(["Lab","Stations","Utilisation"],
        equip.map(r=>[SP[r].name,String(SP[r].stations),pc(equipV(r))])),
      "Share of a practical session in which the machinery showed activity rather than sitting idle."),
  ]));

  const zid=(live.includes(S.space)&&SP[S.space].stations>0)?S.space:(equip[0]||live[0]);
  if(zid&&SP[zid].stations>0){
    const nSt=Math.min(SP[zid].stations,12);
    const hrsR=["09","10","11","12","13","14","15","16"];
    const zr=rng(hashStr("zone"+zid+d)), base=equipV(zid);
    const zval=Array.from({length:nSt},()=>hrsR.map((hh,hi)=>
      hh==="13"?Math.round(zr()*14)
        :Math.round(clamp(base*(1-Math.abs(hi-3)/12)*(0.6+zr()*0.75),0,100))));
    QR.push(sec(SP[zid].name,"station level · first "+nSt+" of "+SP[zid].stations));
    QR.push(cgrid(1,[
      cx("Workstation Utilisation by Hour",null,
        ()=>heat({rows:Array.from({length:nSt},(_,i)=>i+1),cols:hrsR,val:zval,
          rowLab:r=>(SP[zid].type==="computer-lab"?"PC-":"ST-")+String(r).padStart(2,"0"),

/* Splits missing feed into per-camera outages (server up, camera off) and
   whole-centre outages (server down) inside the covered window of a day. */
function offStats(date){
  /* the ALL series is a cross-day MEAN, so it is only -1 when every day was
     dark at that slot — reading it directly reported zero outages. Average
     the four real days instead. */
  if(date===ALLD){
    const per=FEED_DATES.map(offStats).filter(Boolean);
    if(!per.length) return null;
    const worstBy={};
    per.forEach(o=>{if(o.worst) worstBy[o.worst]=(worstBy[o.worst]||0)+o.worstMin;});
    let worst=null,worstMin=0;
    Object.keys(worstBy).forEach(c=>{const m=worstBy[c]/per.length;
      if(m>worstMin){worstMin=m;worst=c;}});
    return {srvMin:avg(per.map(o=>o.srvMin)), camMin:avg(per.map(o=>o.camMin)),
            camSlotMin:avg(per.map(o=>o.camSlotMin)), worst, worstMin};
  }
  const win=PARTIAL[date]; if(!win) return null;
  const s0=sl(win.from), s1=sl(win.to);
  /* srv and cam are both WALL-CLOCK minutes: a slot counts once, whether one
     camera or three were dark in it. camSlotMin keeps the camera-minutes total
     separately so the detail survives without being mislabelled as clock time. */
  let srv=0, cam=0, camSlots=0;
  for(let i=s0;i<=s1;i++){
    let down=0;
    for(const c of CAMS) if(SER10[c][date][i]<0) down++;
    if(down===CAMS.length) srv++;
    else if(down>0){ cam++; camSlots+=down; }
  }
  let worst=null, worstN=0;
  CAMS.forEach(c=>{let n=0;
    for(let i=s0;i<=s1;i++){
      if(SER10[c][date][i]>=0) continue;
      let allDark=true;
      for(const o of CAMS) if(SER10[o][date][i]>=0){allDark=false;break;}
      if(!allDark) n++;                     /* server-down minutes are not this camera's fault */
    }
    if(n>worstN){worstN=n;worst=c;}});
  return {srvMin:srv*BUCKET, camMin:cam*BUCKET, camSlotMin:camSlots*BUCKET,
          worst, worstMin:worstN*BUCKET};
}
function pageCoverage(){

     true worst reading across the real days instead. */
  const nightMax=S.date===ALLD
    ? Math.max.apply(null,FEED_DATES.flatMap(dd=>

      tone:totalNoData>600?"warn":"good",

    kcard({lbl:"Server-Off Minutes",src:"measured",

      tone:(()=>{const o=offStats(d);return o&&o.srvMin>60?"crit":o&&o.srvMin>10?"warn":"good";})(),
      chip:(()=>{const n=FEED_DATES.filter(x=>{const o=offStats(x);return o&&o.srvMin>10;}).length;
        return {t:n+" of "+FEED_DATES.length+" days — "+(n>=3?"pattern":"isolated"),

        cur:FEED_DATES.indexOf(d),lbl:"days the server was down"},

    kcard({lbl:"Overnight Baseline Reading",src:"measured",val:fmt(nightAvg,2),unit:"persons",
      range:{v:nightAvg,lo:Math.min.apply(null,rows.map(r=>r.nightAvg==null?0:r.nightAvg)),

  /* per-camera coverage, positioned on the 24h clock */
  const cv=el("ul",{class:"cvlist"});

  if(cRooms.length){

          at:r.peakMin!=null?r.peakMin:null},
        foot:hrs(r.anyMin)+"h with anyone present",
        chip:{t:fmt(r.personMin)+" people-minutes",tone:"n"},

/* Pack the page into slides that fit the screen. Runs AFTER the charts have
   built, because a chart is 0px tall until it does and every slide would
   otherwise be packed against the wrong height. */
function buildDeck(host){
  const page=host.firstElementChild;
  if(!page) return;
  const kids=[...page.children];
  if(!kids.length) return;

  /* a section rule starts a group; everything under it travels with it */
  const groups=[];let cur=null;
  kids.forEach(k=>{
    if(k.classList.contains("sec")||cur===null){cur={nodes:[],h:0,
      title:k.classList.contains("sec")?(k.querySelector("b")||{}).textContent||"":""};
      groups.push(cur);}
    cur.nodes.push(k);
  });
  groups.forEach(g=>{g.h=g.nodes.reduce((a,n)=>{
    const st=getComputedStyle(n);
    return a+n.offsetHeight+parseFloat(st.marginTop||0)+parseFloat(st.marginBottom||0);},0);});

  const top=host.getBoundingClientRect().top+scrollY;
  const avail=Math.max(320,innerHeight-top-44-20);

  const slides=[];let s0=null;
  groups.forEach(g=>{
    if(!s0||(s0.h+g.h>avail&&s0.groups.length)){s0={groups:[],h:0};slides.push(s0);}
    s0.groups.push(g);s0.h+=g.h;
  });
  if(slides.length<2){
    /* nothing to page — but it still has to fill the screen it is shown on.
       min-height, not height: a camera drawer opening later must be able to
       grow the page rather than spill past a frozen frame. */
    S.slideN=1;S.slide=0;
    if(page.querySelector(".geo,.duo,.cg,.panel")){
      page.classList.add("solo");
      page.style.minHeight=Math.max(320,innerHeight-top-20)+"px";
    }
    return;
  }

  const deck=el("div",{class:"deck"});
  const track=el("div",{class:"track"});
  slides.forEach((sl,i)=>{
    const sec=el("section",{class:"slide",role:"group",
      "aria-label":"Slide "+(i+1)+" of "+slides.length});
    sl.groups.forEach(g=>g.nodes.forEach(n=>sec.appendChild(n)));
    if(!sec.querySelector(".geo,.duo,.cg,.panel")) sec.classList.add("centered");
    track.appendChild(sec);
  });
  deck.appendChild(track);
  page.appendChild(deck);

  const bar=el("nav",{class:"stepper","aria-label":"Slides on this page"});
  const list=el("ol",{class:"st-list"});
  const stepBtns=slides.map((sl,i)=>{
    const name=sl.groups.map(g=>g.title).filter(Boolean)[0]||("Slide "+(i+1));
    const extra=sl.groups.map(g=>g.title).filter(Boolean).slice(1);
    const b=el("button",{title:extra.length?name+" · "+extra.join(" · "):name},
      [el("i",{text:String(i+1)}),el("span",{text:name})]);
    b.addEventListener("click",()=>go(i));
    list.appendChild(el("li",{},[b]));
    return b;});
  const prev=el("button",{class:"st-nav",text:"‹","aria-label":"Previous slide"});
  const next=el("button",{class:"st-nav",text:"›","aria-label":"Next slide"});
  bar.appendChild(list);
  bar.appendChild(el("div",{class:"st-arrows"},[prev,next]));
  host.insertBefore(bar,host.firstChild);

  S.slideN=slides.length;
  if(!(S.slide>=0&&S.slide<slides.length)) S.slide=0;

  function go(i,animate){
    /* cap the frame at what the screen has, so an over-tall slide scrolls */
    const capH=Math.max(320,innerHeight-deck.getBoundingClientRect().top-16);
    S.slide=clamp(i,0,slides.length-1);
    const secs=[...track.children];
    if(animate!==false){deck.classList.add("anim");track.classList.add("anim");}
    track.style.transform="translateX("+(-S.slide*100)+"%)";
    const cur=secs[S.slide];
    /* the map block is the only thing that should claim the whole frame */
    const fills=cur.querySelector(".geo,.duo,.cg")||cur.classList.contains("centered");
    deck.style.height=(fills?capH:Math.min(cur.scrollHeight+8,capH))+"px";
    secs.forEach((n,k)=>n.setAttribute("aria-hidden",String(k!==S.slide)));
    stepBtns.forEach((b,k)=>{
      b.setAttribute("aria-current",String(k===S.slide));
      if(k===S.slide) b.scrollIntoView({block:"nearest",inline:"nearest"});
    });
    prev.disabled=S.slide===0;next.disabled=S.slide===slides.length-1;
    const live=secs[S.slide];
    [...live.querySelectorAll(".sec,.kg,.cg,.panel")].slice(0,8)
      .forEach((n,k)=>{n.classList.remove("reveal");void n.offsetWidth;
        n.classList.add("reveal");n.style.animationDelay=(k*34)+"ms";});
  }
  prev.addEventListener("click",()=>go(S.slide-1));
  next.addEventListener("click",()=>go(S.slide+1));
  DECK_GO=go;
  DECK_SYNC=()=>{const n=track.children[S.slide];
    if(!n) return;
    const cap=Math.max(320,innerHeight-deck.getBoundingClientRect().top-16);
    const fills=n.querySelector(".geo,.duo,.cg")||n.classList.contains("centered");
    deck.style.height=(fills?cap:Math.min(n.scrollHeight+8,cap))+"px";};
  go(S.slide,false);
  /* a strip or chart that resizes changes the slide's height under us */
  requestAnimationFrame(()=>{if(DECK_GO!==go) return;
    /* clamp to the screen, exactly as go() and DECK_SYNC do — an unclamped
       fix-up can pin the frame taller than the window, which puts the bottom
       of the slide below the fold where nothing can scroll it back */
    const cap=Math.max(320,innerHeight-deck.getBoundingClientRect().top-16);
    deck.style.height=Math.min(track.children[S.slide].offsetHeight,cap)+"px";});
}
let DECK_GO=null;

/* the deck is driven from the keyboard: a presenter has one hand on a clicker */
addEventListener("keydown",e=>{
  if(!DECK_GO) return;
  const t=e.target;
  if(t&&/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
  if(t&&t.closest&&t.closest("[role=tablist]")) return;   // tabs own left/right
  let d=0;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" ") d=1;
  else if(e.key==="ArrowLeft"||e.key==="PageUp") d=-1;
  else if(e.key==="Home"){e.preventDefault();DECK_GO(0);return;}
  else if(e.key==="End"){e.preventDefault();DECK_GO(S.slideN-1);return;}
  if(!d) return;
  e.preventDefault();DECK_GO(S.slide+d);
});

function render(){
  if(camLoop){cancelAnimationFrame(camLoop);camLoop=null;}
  hideTip(); SYNCS=[];
  [...tabsEl.children].forEach((b,i)=>{
    const on=PAGES[i].id===S.tab;
    b.setAttribute("aria-selected",String(on));
    b.setAttribute("tabindex",on?"0":"-1");
  });
  drawCrumb();
  const atCentre=S.geo.lvl==="ctr";
  ["cellDay","cellSpace"].forEach(id=>{
    const n=document.getElementById(id); if(n) n.style.display=atCentre?"":"none";});
  viewEl.setAttribute("aria-labelledby","tab-"+S.tab);
  viewEl.innerHTML="";
  viewEl.appendChild((PAGES.find(p=>p.id===S.tab)||PAGES[0]).fn());
  /* build synchronously: rAF is throttled in a background tab and a presenter
     who alt-tabs must not return to empty frames */
  SYNCS.forEach(f=>{try{f();}catch(e){}});
  window.scrollTo({top:0,behavior:"instant"});
  DECK_GO=null;DECK_SYNC=null;CAMDRAWER=null;MDRAWER=null;
  buildDeck(viewEl);
  /* a rate that was open before the map recoloured stays open */
  if(S.mopen){
    const b=[...viewEl.querySelectorAll(".mr")].find(n=>n.classList.contains("on"));
    const k=S.mopen; S.mopen=null;
    if(b) toggleMetricDrawer(b,k);
  }
  if(!DECK_GO)
    [...viewEl.querySelectorAll(".sec,.kg,.cg")].slice(0,10)
      .forEach((n,i)=>{n.classList.add("reveal");n.style.animationDelay=(i*38)+"ms";});
}

let rzT=null;
let lastW=innerWidth,lastH=innerHeight;
addEventListener("resize",()=>{clearTimeout(rzT);
  rzT=setTimeout(()=>{
    const dw=Math.abs(innerWidth-lastW),dh=Math.abs(innerHeight-lastH);
    lastW=innerWidth;lastH=innerHeight;
    /* an open camera view is state the reviewer created — never destroy it */
    if(CAMDRAWER){
      SYNCS.forEach(f=>{try{f();}catch(e){}});
      if(DECK_SYNC) DECK_SYNC();
      return;
    }
    if(dw<2&&dh<2){
      SYNCS.forEach(f=>{try{f();}catch(e){}});
      if(DECK_SYNC) DECK_SYNC();
      return;
    }
    render();
  },260);});

/* masthead stat strip — numbers, no sentence */
(function(){
  const host=document.getElementById("mstat"); if(!host) return;
  const last=PARTIAL[FEED_DATES[FEED_DATES.length-1]];
  const stats=[
    ["States / UTs", "36"],
    ["Districts", fmt(NAT_DISTRICTS)],
    ["Centres", fmt(NCENTRES.length)],
    ["Enrolled", inr(NAT_AGG.enrolled)]
  ];
  stats.forEach(([k,val])=>host.appendChild(el("div",{},[
    el("u",{text:k}),el("b",{text:val})])));
})();

render();

</script>
