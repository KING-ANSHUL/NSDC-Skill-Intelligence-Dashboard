<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSDC Skill Intelligence — Centre Monitoring Prototype</title>
<style>
/* ============================================================
   NSDC Skill Intelligence — visual system
   Direction: institutional instrument panel.
   Light paper plane, deep navy ink, hairline modular grid,
   dark inset CCTV panels as the visual anchor. No card-soup,
   no shadows-as-hierarchy, no neon.
   Data colours: validated categorical palette (dataviz skill),
   checked against surface #fbfcfd — all gates PASS.
   ============================================================ */
:root{
  color-scheme: light;

  /* planes & ink */
  --paper:#f1f4f7;
  --surface:#fbfcfd;
  --surface-2:#f6f8fa;
  --ink:#0e1720;
  --ink-2:#46586a;
  --muted:#5f6d7a;          /* 4.9:1 on --surface — it carries real copy, not just chrome */
  --hair:#e4e8ed;          /* gridline hairline */
  --rule:#ccd4dd;          /* baseline / axis */
  --ring:rgba(14,23,32,.10);

  /* ui accent (chrome only — deeper than series-1 for text contrast) */
  --accent:#175a9e;
  --accent-soft:#e8f0f8;

  /* categorical series — validated order, never cycled */
  --s1:#2a78d6; --s2:#eb6834; --s3:#0f8a5f; --s4:#b87b00;   /* s3/s4 darkened: both sat under 3:1 on this surface */
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;

  /* sequential blue ramp (magnitude) */
  --q1:#cde2fb; --q2:#9ec5f4; --q3:#6da7ec; --q4:#3987e5; --q5:#256abf; --q6:#184f95;

  /* status — reserved, never used as a series */
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#006300;

  /* dark video plane */
  --vid:#0a0f16; --vid-2:#111b26; --vid-ink:#dfe8f2; --vid-muted:#7e94aa;

  --font:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;

  /* control geometry — two families, no third
     inline: anything that sits inside a KPI card or a chart header
     chrome: anything in the shell around the content */
  --r-ctl:2px;          /* chrome corner */
  --r-pill:999px;       /* inline corner — a true pill at any height */
  --h-inline:20px;
  --h-ctl:26px;
  --fs-inline:10px;
  --focus:var(--accent);
}

/* ---------- inline control family ----------
   Same height, same corner, same type size, whether it reports a status or
   opens the camera behind the figure. The button keeps a border and a hover
   state, which is what separates an affordance from a label — not a different
   shape language. */
.kc-chip,.kc-d,.kc-cam,.cx-h .tv,.chart-h .tv{
  height:var(--h-inline);
  display:inline-flex;align-items:center;
  border-radius:var(--r-pill);
  font-size:var(--fs-inline);font-weight:700;
  padding:0 8px;line-height:1;
  border:1px solid transparent;   /* chips too, so the heights match exactly */
  box-sizing:border-box;
}
.kc-cam,.cx-h .tv,.chart-h .tv{border-color:var(--rule);cursor:pointer}
.kc-cam:hover,.cx-h .tv:hover,.chart-h .tv:hover{
  border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- chrome control family ---------- */
.ghost,.backbtn,.mp-back,.cd-x,.pill{
  height:var(--h-ctl);
  display:inline-flex;align-items:center;
  border-radius:var(--r-ctl);
  font-size:11px;line-height:1;
  box-sizing:border-box;
}
.st-nav{height:var(--h-ctl);width:var(--h-ctl);border-radius:var(--r-ctl);
  font-size:14px;box-sizing:border-box}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font);
  font-size:13px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}

/* ---------- type utilities ---------- */
.micro{
  font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  font-weight:650;color:var(--muted);
}
.micro-ink{color:var(--ink-2)}

/* ---------- masthead ---------- */
.masthead{
  display:flex;align-items:center;gap:10px;
  padding:7px 16px;background:var(--surface);
  border-bottom:1px solid var(--rule);flex-wrap:nowrap;overflow:hidden;
}
.mh-lockup{display:flex;align-items:center;gap:14px;text-decoration:none;flex:none}
.mh-nsdc{height:32px;width:auto;display:block}
.mh-msde{height:25px;width:auto;display:block}
.mh-sep{width:1px;height:22px;background:var(--hair);flex:none}
@media(max-width:1120px){.mh-msde{display:none}}
.mh-div{width:1px;align-self:stretch;background:var(--hair)}
.mh-title{display:flex;flex-direction:column;gap:0;min-width:0;flex:none}
.mh-title b{font-size:13.5px;font-weight:680;letter-spacing:-.005em;white-space:nowrap}
.mh-title span{font-size:10px;color:var(--muted);white-space:nowrap}
@media(max-width:1700px){.mh-title span{display:none}}
.mh-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
/* the stat strip repeats what the map panel already prints, so it is what
   gives way once identity + scope + controls have taken their room */
@media(max-width:1900px){.mstat>div:nth-child(1),.mstat>div:nth-child(2){display:none}}
@media(max-width:1600px){.mh-right .mh-div,.mstat{display:none}}
/* a long centre name must not push the controls off the row */
.crumb{max-width:24ch;overflow:hidden}
.crumb span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fSpace{max-width:190px}
#fDay{max-width:150px}
@media(max-width:1240px){.mh-msde,.mh-sep{display:none}}
.clock{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.clock b{font-weight:650;color:var(--ink)}


.f-cell{display:flex;align-items:center;gap:6px;flex:none;min-width:0}
.f-cell label{white-space:nowrap}
.f-cell label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:650;color:var(--muted)}
select{
  font-family:inherit;font-size:12px;color:var(--ink);
  background:var(--surface);border:1px solid var(--rule);border-radius:2px;
  padding:4px 8px;min-width:96px;
}
/* a presenter driving this from the keyboard has to be able to see where they are */
select:focus-visible,
.ghost:focus-visible,
.tab:focus-visible,
.chart-h .tv:focus-visible,
.thumb:focus-visible,
.tl-btn:focus-visible,
.tl-speed:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.hm-c:focus-visible,
.strip i:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
/* every control answers to the same ring, including the ones that had none */
.mp-back:focus-visible,.cd-x:focus-visible,.kc-cam:focus-visible,
.cx-h .tv:focus-visible,.lb tbody tr:focus-visible,
.mp-dot:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lb tbody tr:focus-visible{outline-offset:-2px}
svg.viz [tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ghost{
  font-family:inherit;font-size:11px;font-weight:600;
  color:var(--accent);background:transparent;
  border:1px solid var(--rule);border-radius:2px;padding:5px 11px;cursor:pointer;
}
.ghost:hover{background:var(--accent-soft);border-color:var(--accent)}
.ghost[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- tabs ---------- */
.tabrow{display:flex;align-items:center;gap:18px;background:var(--surface);
  border-bottom:1px solid var(--rule);padding:0 22px}
.tabs{display:flex;background:none;border-bottom:0;padding:0;overflow-x:auto;flex:1;min-width:0}
/* the provenance key is the only thing that decodes the dot on every card, so
   it lives where there is permanent room for it rather than in the masthead,
   which overflows at presentation width */
.tabrow .skey{margin-left:auto;flex:none}
@media(max-width:900px){.tabrow .skey{display:none}}
.tab{
  font-family:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:650;
  color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;
  padding:11px 16px;cursor:pointer;white-space:nowrap;
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{padding:14px 22px 18px;max-width:1560px;margin-inline:auto;width:100%;min-height:0}

/* the hairline grid — separators come from cell borders, not gaps */
.grid{display:grid}
.cell{padding:14px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);min-width:0}
.cell:last-child{border-right:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:920px){.g4,.g3,.g2{grid-template-columns:1fr}.cell{border-right:0}}

/* ---------- chart card ---------- */
.chart-h{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
.chart-h h3{font-size:13px;font-weight:660;margin:0;letter-spacing:-.005em}
.chart-h .tv{margin-left:auto;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:650;color:var(--muted);background:none;border:1px solid var(--hair);border-radius:2px;padding:2px 6px;cursor:pointer;font-family:inherit}
.chart-h .tv:hover{color:var(--accent);border-color:var(--accent)}
.chart-sub{font-size:11.5px;color:var(--muted);margin:0 0 10px;max-width:66ch}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin:0 0 9px}
.legend i{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);font-style:normal}
.legend i b{width:9px;height:9px;border-radius:2px;flex:none}
svg.viz{display:block;width:100%;height:auto;overflow:visible}
.viz text{font-family:var(--font)}
.ax{font-size:10px;fill:var(--muted);font-variant-numeric:tabular-nums}
.dl{font-size:10.5px;fill:var(--ink);font-weight:640;font-variant-numeric:tabular-nums}
.grid-l{stroke:var(--hair);stroke-width:1}
.base-l{stroke:var(--rule);stroke-width:1}

/* table view twin */
.tbl-wrap{overflow-x:auto;margin-top:4px}
table.dv{border-collapse:collapse;width:100%;font-size:11.5px}
table.dv th,table.dv td{text-align:right;padding:5px 9px;border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums;white-space:nowrap}
table.dv th:first-child,table.dv td:first-child{text-align:left;font-variant-numeric:normal}
table.dv th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;border-bottom:1px solid var(--rule)}
.hide{display:none!important}

/* ---------- tooltip ---------- */
#tip{
  position:fixed;z-index:90;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--ink);color:#fff;font-size:11.5px;line-height:1.5;
  padding:7px 10px;border-radius:3px;max-width:270px;
  box-shadow:0 3px 14px rgba(14,23,32,.22);
}
#tip b{font-weight:650}
#tip .r{display:flex;align-items:center;gap:6px;justify-content:space-between;gap:14px}
#tip .r i{display:inline-flex;align-items:center;gap:5px;font-style:normal;color:#c9d5e1}
#tip .r i b{width:8px;height:8px;border-radius:2px;display:inline-block}
#tip .v{font-variant-numeric:tabular-nums;font-weight:650}
#tip .hd{font-weight:650;margin-bottom:3px;padding-bottom:3px;border-bottom:1px solid rgba(255,255,255,.16)}

/* ============================================================
   CAMERA / VISION PANELS — the dark inset plane
   ============================================================ */
.vwrap{background:var(--vid);border:1px solid var(--rule)}
.vgrid{display:grid;grid-template-columns:minmax(0,2.05fr) minmax(0,1fr)}
@media(max-width:1080px){.vgrid{grid-template-columns:1fr}}

.vstage{position:relative;background:var(--vid);border-right:1px solid #1e2b39}
.vstage canvas{display:block;width:100%;height:auto}

/* HUD is DOM, not canvas — crisper text, easier layout */
.hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}
.hud-tl,.hud-tr,.hud-bl,.hud-br{position:absolute;display:flex;align-items:center;gap:8px}
.hud-tl{top:10px;left:11px} .hud-tr{top:10px;right:11px}
.hud-bl{bottom:10px;left:11px} .hud-br{bottom:10px;right:11px}
.hud-id{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--vid-ink);text-transform:uppercase}
.hud-room{font-size:10.5px;letter-spacing:.06em;color:var(--vid-muted);text-transform:uppercase}
.rec{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.11em;color:#ff6a6a}
.rec b{width:6px;height:6px;border-radius:50%;background:#ff4d4d;animation:blink 1.6s steps(1,end) infinite}
/* a replay of a recorded export must not wear the visual grammar of a live
   recording — no pulsing red dot */
.rec.replay b{background:#7aa7d4;animation:none}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
.hud-ts{font-size:10.5px;color:var(--vid-ink);letter-spacing:.04em}
.hud-stat{display:flex;align-items:center;gap:6px;background:rgba(6,11,17,.72);border:1px solid #22303f;padding:4px 8px;border-radius:2px}
.hud-stat u{text-decoration:none;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--vid-muted);font-weight:650}
.hud-stat s{text-decoration:none;font-size:12px;font-weight:680;color:var(--vid-ink)}

/* ---------- presence strip ---------- */
.strip{display:flex;gap:2px;margin:8px 0 4px}
.strip i{flex:1;height:20px;border-radius:1px;min-width:2px}
.strip-ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- heatmap ---------- */
.hmbox{display:flex;flex-direction:column;height:100%;min-height:0}
.hmbox .hm{flex:1;min-height:0}
.hm{display:grid;gap:3px;margin-top:4px;width:100%;max-width:960px;
  grid-auto-rows:minmax(26px,1fr)}
.hm-c{min-height:26px;height:auto;border-radius:1px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums;cursor:default}
.hm-rl{font-size:11px;color:var(--ink-2);display:flex;align-items:center;padding-right:8px;white-space:nowrap;justify-content:flex-end}
.hm-cl{font-size:10.5px;color:var(--ink-2);text-align:center;letter-spacing:.03em;font-weight:600;padding-bottom:3px}
.hm-scale{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:11px;color:var(--ink-2)}
.hm-scale .sw{display:flex;gap:2px}
.hm-scale .sw i{width:24px;height:11px;border-radius:1px}
/* the reference is a boundary between two swatches, not a swatch of its own */
.hm-scale .sw i.ref{box-shadow:inset 2px 0 0 var(--ink)}
.hm-scale em{font-style:normal;color:var(--muted);margin-left:2px;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


/* ---------- footer ---------- */


.note{
  padding:11px 14px;background:var(--surface-2);border-left:2px solid var(--rule);
  font-size:11.5px;line-height:1.55;color:var(--ink-2);margin:0 0 14px;
}
.note>span,.note>b:first-child{max-width:104ch}
.note b{font-weight:650;color:var(--ink)}


/* ---------- provenance: the trust layer ---------- */
/* "only what we can already do" mode */
body.focus-measured .is-modelled{opacity:.55;filter:saturate(.4)}
body.focus-measured .is-modelled:hover{opacity:1;filter:none}

/* ---------- coverage bar (declared vs seen) ---------- */
.cvlist{margin:0;padding:0;list-style:none}
.cvlist li{display:grid;grid-template-columns:minmax(210px,30%) 1fr auto;gap:14px;
  align-items:center;padding:6px 0;border-bottom:1px solid var(--hair);font-size:11.5px}
.cvlist li:last-child{border-bottom:0}
.cvlist .tk{height:6px;background:var(--q1);border-radius:2px;overflow:hidden}
.cvlist .tk i{display:block;height:100%}
.cvlist .rt{font-variant-numeric:tabular-nums;font-weight:640;min-width:52px;text-align:right}
.cvlist .nm{color:var(--ink-2)}



/* ---------- transport + timeline scrubber ---------- */
/* transport and ruler share one grid so the scale sits under the track it
   labels — as two flex rows they drifted by up to a fifth of the width */
.tl{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;
  align-items:center;gap:6px 10px;padding:8px 11px 6px;
  background:rgba(6,11,17,.9);border-top:1px solid #1e2b39}
.tl-btn{font-family:inherit;font-size:10px;line-height:1;color:var(--vid-ink);
  background:#16232f;border:1px solid #2a3a4b;border-radius:2px;
  padding:5px 8px;cursor:pointer;min-width:30px}
.tl-btn:hover{background:#1e2f3e}
.tl-btn:hover{border-color:#3a5570}
.tl-time{font-size:11.5px;font-weight:680;color:var(--vid-ink);
  font-variant-numeric:tabular-nums;min-width:44px}
.tl-track{position:relative;grid-column:3;height:26px;background:#0d1520;
  border:1px solid #22303f;border-radius:2px;cursor:pointer;min-width:0}
.tl-track:focus-visible{outline:2px solid var(--s1);outline-offset:1px}
.tl-spark{position:absolute;left:0;top:0;right:0;width:100%;height:26px;display:block;border-radius:2px}
.tl-gaps{position:absolute;inset:0;overflow:hidden;border-radius:2px}
.tl-gaps i{position:absolute;top:0;bottom:0;
  background:repeating-linear-gradient(45deg,rgba(190,205,220,.20) 0 3px,transparent 3px 6px)}
.tl-marks{position:absolute;inset:0;overflow:hidden;border-radius:2px}
.tl-marks i{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px}
.tl-marks .m-start{background:rgba(12,163,12,.9)}
.tl-marks .m-peak{background:rgba(255,196,110,.95)}
.tl-marks .m-end{background:rgba(208,59,59,.85)}
.tl-marks .m-lunch{background:rgba(150,170,190,.5)}
.tl-head{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;
  background:#fff;pointer-events:none}
.tl-head::before{content:"";position:absolute;left:-3px;top:-1px;width:8px;height:4px;
  background:#fff;border-radius:1px}
.tl-speed{font-size:10px;padding:3px 5px;background:#16232f;color:var(--vid-ink);
  border:1px solid #2a3a4b;border-radius:2px;min-width:52px}
.tl-scale{display:flex;justify-content:space-between;
  font-size:10px;letter-spacing:.06em;color:var(--vid-muted);
  font-variant-numeric:tabular-nums}
.vstage .hud{bottom:92px}   /* clears the transport + its ruler and key row */


.cvlist.plain li{grid-template-columns:1fr auto}
.cvlist .tk.span24{position:relative;background:var(--surface-2);
  border:1px solid var(--hair);height:9px;border-radius:2px}
.cvlist .tk.span24 i{position:absolute;top:0;bottom:0;border-radius:2px}
.cv24{display:flex;justify-content:space-between;margin-top:6px;padding-left:calc(30% + 14px);
  font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}

.tl .tl-scale{grid-column:3;padding:0;background:none;min-width:0;margin-top:-2px}
.tl .tl-key{grid-column:1 / -1;justify-self:end;padding:0 0 2px}
.tl-foot{display:contents}
.tl-key{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.04em;
  color:var(--vid-muted);white-space:nowrap}
.tl-key .k{width:8px;height:8px;border-radius:1px;flex:none;margin-left:8px}
.tl-key .k:first-child{margin-left:0}
.tl-key .m-start{background:rgba(12,163,12,.9)}
.tl-key .m-peak{background:rgba(255,196,110,.95)}
.tl-key .m-end{background:rgba(208,59,59,.85)}
.tl-key .m-gap{background:repeating-linear-gradient(45deg,rgba(190,205,220,.5) 0 2px,transparent 2px 4px);
  border:1px solid #2a3a4b}

/* ================================================================
   KPI-FIRST PRESENTATION LAYER
   Rule the components enforce: a label of <= 4 words, a number, and a
   MARK. Never a sentence. Anything that needs explaining lives in the
   hover. If a chart shows it, nothing may also write it.
   ================================================================ */
:root{
  /* red -> green scoring ramp: the single fastest way to say good/bad */
  --ryg0:#c0392b;--ryg1:#dd6a35;--ryg2:#c9971f;--ryg3:#6aa96a;--ryg4:#3f9455;--ryg5:#0f7a45;
  --card:0 1px 2px rgba(14,23,32,.05),0 2px 10px rgba(14,23,32,.04);
}

/* ---- section rule: a word and a hairline, never a card header ---- */
.sec{display:flex;align-items:center;gap:11px;margin:0 0 6px;flex:none}
.sec:not(:first-child){margin-top:11px}
.sec b{font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:750;
  color:var(--ink-2);white-space:nowrap}
.sec span{font-size:10.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sec::after{content:"";flex:1;height:1px;background:var(--hair)}

/* ---- the KPI card ---- */
.kg{display:grid;gap:8px;margin-bottom:2px;flex:none}
/* auto-fit: three cards in a four-wide grid still fill the row */
.kg.n5{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.kg.n4{grid-template-columns:repeat(auto-fit,minmax(216px,1fr))}
.kg.n3{grid-template-columns:repeat(auto-fit,minmax(252px,1fr))}
.kg.n6{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}


.kc{position:relative;background:var(--surface);border:1px solid var(--hair);
  border-left:3px solid var(--s1);border-radius:3px;padding:6px 11px 6px;
  box-shadow:var(--card);min-width:0;display:flex;flex-direction:column}
.kc.b-declared{border-left-color:var(--muted)}
.kc.b-modelled{border-left-color:var(--warning)}
.kc.b-biometric{border-left-color:var(--s7)}
.kc.b-good{border-left-color:var(--good)}
.kc.b-warn{border-left-color:var(--warning)}
.kc.b-crit{border-left-color:var(--critical)}

.kc-h{display:flex;align-items:center;gap:6px;min-height:14px;flex:none}
.kc-h{align-items:flex-start}
.kc-h u{text-decoration:none;font-size:10.5px;text-transform:uppercase;letter-spacing:.085em;
  font-weight:700;color:var(--muted);min-width:0;overflow:hidden;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal}
.kc-d{margin-left:auto;flex:none;gap:3px;
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.kc-d.up{color:#0a6b36;background:#e6f4ea}
.kc-d.dn{color:#8f2020;background:#fbe9e7}
.kc-d.fl{color:var(--ink-2);background:var(--surface-2)}

.kc-v{display:flex;align-items:baseline;gap:5px;margin:3px 0 0;line-height:1}
.kc-v b{font-size:clamp(23px,2vw,30px);font-weight:680;letter-spacing:-.025em;color:var(--ink)}
.kc-v i{font-style:normal;font-size:13px;font-weight:620;color:var(--muted)}
.kc-v.crit b{color:var(--critical)} .kc-v.warn b{color:#8a5a00} .kc-v.good b{color:var(--good-ink)}

/* wraps deliberately: on a six-across KPI row a chip plus the Camera Signals
   button exceed the card width, and a nowrap row cut the button off entirely.
   Wrapping costs one line of height; clipping cost the affordance. */
.kc-f{margin-top:auto;padding-top:4px;display:flex;align-items:center;gap:6px;
  min-height:15px;flex-wrap:wrap;row-gap:5px}
.kc-f>*{max-width:100%}
.kc-chip{gap:5px;letter-spacing:.02em;white-space:nowrap}
.kc-chip .dt{width:5px;height:5px;border-radius:50%;flex:none}
.kc-chip.t-ok{color:#0a6b36;background:#e6f4ea}
.kc-chip.t-ok .dt{background:var(--good)}
.kc-chip.t-warn{color:#7a5200;background:#fdf3dd}
.kc-chip.t-warn .dt{background:var(--warning)}
.kc-chip.t-crit{color:#8f2020;background:#fbe9e7}
.kc-chip.t-crit .dt{background:var(--critical)}
.kc-chip.t-n{color:var(--ink-2);background:var(--surface-2)}
.kc-chip.t-n .dt{background:var(--muted)}
.kc-f em{font-style:normal;font-size:10.5px;color:var(--muted);overflow:hidden;
  line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  white-space:normal}

.kc-spark{margin-top:4px;height:18px}
.kc-spark svg{display:block;width:100%;height:18px;overflow:visible}

/* declared vs seen — one metaphor, repeated */
.kc-cmp{margin-top:10px}
.kc-bar{position:relative;height:20px;background:var(--surface-2);
  border:1px solid var(--hair);border-radius:2px;overflow:hidden}
.kc-bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:0 2px 2px 0}
.kc-bar>u{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;
  background:var(--ink);border-radius:1px;text-decoration:none}
.kc-cax{display:flex;justify-content:space-between;margin-top:4px;font-size:10.5px;
  color:var(--muted);font-variant-numeric:tabular-nums}
.kc-cax b{color:var(--ink-2);font-weight:700}

/* three-state room bar */
.kc-tri{display:flex;height:20px;gap:2px;margin-top:10px}
.kc-tri i{display:block;border-radius:1px;min-width:2px}

/* source dot, explained once in the filter bar */
.sd{width:8px;height:8px;flex:none;border-radius:50%;display:inline-block}
.sd-measured{background:var(--s1)}
.sd-declared{background:var(--muted);border-radius:1px}
.sd-modelled{background:transparent;border:1.6px solid var(--warning);
  width:7px;height:7px;border-radius:0;transform:rotate(45deg)}
.sd-biometric{background:var(--s7);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.skey{display:flex;align-items:center;gap:12px;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.07em;font-weight:700;color:var(--muted)}
.skey i{display:inline-flex;align-items:center;gap:5px;font-style:normal}

/* ---- chart box: a title, and nothing else ---- */
.cg{display:grid;gap:8px;margin-bottom:2px;flex:none}
.cg.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.cg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1120px){.cg.c2,.cg.c3{grid-template-columns:1fr}}
.cx{background:var(--surface);border:1px solid var(--hair);border-radius:3px;
  padding:6px 11px 6px;box-shadow:var(--card);min-width:0}
.cx-h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.cx-h b{font-size:12.5px;font-weight:670;letter-spacing:-.005em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.cx-h .tv{margin-left:auto;flex:none;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);background:none;font-family:inherit}
.cx-lg{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:5px}
.cx-lg i{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;
  color:var(--ink-2);font-style:normal}
.cx-lg i b{width:9px;height:9px;border-radius:2px;flex:none}

/* masthead stat strip */
.mstat{display:flex;align-items:center;gap:0}
.mstat div{padding:0 15px;border-left:1px solid var(--hair)}
.mstat div:first-child{border-left:0}
.mstat u{display:block;text-decoration:none;font-size:10px;text-transform:uppercase;
  letter-spacing:.1em;font-weight:700;color:var(--muted)}
.mstat b{display:block;font-size:12.5px;font-weight:680;color:var(--ink);
  font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
@media(max-width:1240px){.mstat div:nth-child(n+3){display:none}}

@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.reveal{animation:rise .44s cubic-bezier(.16,.84,.44,1) both}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ================================================================
   NATIONAL LAYER — map, funnel, leaderboard
   The map is the first thing on the screen and it has to be readable
   from the back of a room, so: one hue ramp shared with every score
   in the file, a legend that names its own reference line, and no
   label small enough to need leaning in for.
   ================================================================ */
.geo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0;
  align-items:stretch;grid-auto-rows:minmax(0,1fr);flex:1;min-height:340px}
@media(max-width:1000px){.geo{grid-template-columns:1fr;grid-auto-rows:auto}}
@media(max-width:1180px){.geo{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--hair);border-radius:3px;
  box-shadow:var(--card);display:flex;flex-direction:column;min-width:0;min-height:0}
.panel-h{display:flex;align-items:center;gap:9px;padding:7px 12px 6px;
  border-bottom:1px solid var(--hair);flex-wrap:wrap}
.geo>.panel:first-child .panel-h{align-items:flex-start}
.geo>.panel:first-child .pills{margin-left:0;flex-basis:100%}
.panel-h b{font-size:12.5px;font-weight:700;letter-spacing:-.005em}
.panel-h em{font-style:normal;font-size:10.5px;color:var(--muted)}
.panel-b{padding:12px 14px}

/* metric switcher */
.pills{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.pill{font-family:inherit;font-weight:640;letter-spacing:.01em;
  padding:4px 9px;border:1px solid var(--rule);background:var(--surface);
  color:var(--ink-2);border-radius:2px;cursor:pointer;white-space:nowrap}
.pill:hover{background:var(--surface-2)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* map + rail */
.mapgrid{display:flex;flex-direction:column;gap:7px;padding:6px 12px 9px;
  min-height:0;flex:1}
@media(max-width:1100px){.geo{grid-template-columns:1fr;grid-auto-rows:auto}}

.mapstage{position:relative;background:linear-gradient(180deg,#f7fafc,#eef3f8);
  border:1px solid var(--hair);border-radius:3px;overflow:hidden;
  flex:1;min-height:0;width:100%}
.mapstage svg{display:block;width:100%;height:100%}
.geo>.panel{min-height:0;overflow:hidden}
.mp-st{cursor:pointer;transition:filter .12s ease}
.mp-st:hover{filter:brightness(1.12) saturate(1.15)}
.mp-st:focus-visible{outline:none;stroke:var(--ink);stroke-width:2.4}
.mp-sel{stroke:var(--ink);stroke-width:2.2;paint-order:stroke}
.mp-dot{cursor:pointer}
.mp-dot:hover circle{stroke:var(--ink);stroke-width:2}
.mp-badge{position:absolute;left:9px;top:9px;display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.93);border:1px solid var(--rule);border-radius:2px;
  padding:4px 8px;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2)}
.mp-badge i{width:6px;height:6px;border-radius:50%;background:var(--good);
  box-shadow:0 0 0 3px rgba(12,163,12,.16)}
.mp-count{position:absolute;right:9px;top:9px;background:rgba(255,255,255,.93);
  border:1px solid var(--rule);border-radius:2px;padding:4px 8px;font-size:10.5px;
  color:var(--ink-2);font-variant-numeric:tabular-nums}
.mp-back{position:absolute;left:9px;bottom:9px;font-family:inherit;font-weight:640;
  background:var(--surface);border:1px solid var(--rule);border-radius:2px;
  padding:5px 10px;cursor:pointer;color:var(--ink)}
.mp-back:hover{background:var(--surface-2)}

.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 16px;
  min-width:0;align-content:start;overflow:hidden;flex:none}
.rail h5{margin:0 0 3px}
.rail .rank a{padding:2px 0;font-size:11px}
.rail .cov-r{padding:2px 0;font-size:10.5px}
.rail .rail-avg{margin-top:4px;padding-top:4px}
.rail .rail-avg b{font-size:15px}
@media(max-width:1200px){.rail{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rail h5{margin:0 0 6px;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;
  font-weight:700;color:var(--muted)}
.ramp{display:flex;height:9px;border-radius:2px;overflow:hidden;border:1px solid var(--hair)}
.ramp i{flex:1}
.ramp-ax{display:flex;justify-content:space-between;margin-top:3px;font-size:9.5px;
  color:var(--muted);font-variant-numeric:tabular-nums}
.rail-avg{display:flex;align-items:baseline;gap:6px;margin-top:7px;
  padding-top:7px;border-top:1px dashed var(--rule)}
.rail-avg b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rail-avg span{font-size:10px;color:var(--muted)}
.rank{display:flex;flex-direction:column;gap:0}
.rank a{display:flex;align-items:center;gap:7px;padding:3.5px 0;font-size:11.5px;
  color:var(--ink);text-decoration:none;cursor:pointer;border-bottom:1px solid var(--hair)}
.rank a:last-child{border-bottom:0}
.rank a:hover{color:var(--accent)}
.rank a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rank i{width:7px;height:7px;border-radius:50%;flex:none}
.rank u{text-decoration:none;flex:1;min-width:0;overflow:hidden;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal}
.rank b{font-variant-numeric:tabular-nums;font-weight:680;font-size:11.5px}
.cov{display:flex;flex-direction:column;gap:0}
.cov-r{display:flex;align-items:center;gap:7px;padding:3.5px 0;font-size:11px;
  border-bottom:1px solid var(--hair)}
.cov-r:last-child{border-bottom:0}
.cov-r i{width:5px;height:5px;border-radius:50%;flex:none}
.cov-r i.t-ok{background:var(--good)}.cov-r i.t-warn{background:var(--warning)}
.cov-r i.t-crit{background:var(--critical)}
.cov-r u{text-decoration:none;flex:1;color:var(--muted);min-width:0;overflow:hidden;
  line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  white-space:normal}
.cov-r b{font-variant-numeric:tabular-nums;font-weight:680}

/* funnel */
.fun{display:flex;flex-direction:column;gap:5px;padding:9px 14px 12px;flex:1;min-height:0}
.fun>.fun-r{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.fun-r{position:relative;border-left:3px solid;padding:6px 11px;
  background:var(--surface-2);border-radius:0 3px 3px 0;overflow:hidden}
.fun-fill{position:absolute;inset:0;right:auto;opacity:.13;pointer-events:none}
.fun-t{position:relative;display:flex;align-items:baseline;gap:8px}
.fun-t b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.fun-t u{text-decoration:none;font-size:11.5px;font-weight:640;color:var(--ink-2)}
.fun-t s{text-decoration:none;margin-left:auto;font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums}
.fun-s{position:relative;display:flex;align-items:center;gap:6px;margin-top:1px;
  font-size:10px;color:var(--muted)}
.fun-d{position:relative;font-size:10px;font-weight:700;color:var(--critical);
  font-variant-numeric:tabular-nums}

.rampbox{position:relative}
.ramp-ref{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);
  text-decoration:none;transform:translateX(-1px)}
.ramp-ref::after{content:"";position:absolute;left:-2px;top:-4px;border:3px solid transparent;
  border-top-color:var(--ink)}

/* ================================================================
   SLIDE DECK
   A projector crops whatever runs past the fold, and a reviewer will
   not scroll a page they are being shown. Each page is packed into
   slides that fit the screen it is on, measured after the charts have
   laid out — not guessed at a fixed count per slide.
   ================================================================ */
.deck{position:relative;overflow:hidden}
.deck.anim{transition:height .30s cubic-bezier(.22,1,.36,1)}
.track{display:flex;align-items:stretch;height:100%}
.track.anim{transition:transform .34s cubic-bezier(.22,1,.36,1)}
/* a group that genuinely cannot fit — a full-height chart on a short
   screen — scrolls inside its own slide rather than being clipped */
.slide{flex:0 0 100%;min-width:0;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;height:100%}
.slide[aria-hidden="true"]{visibility:hidden}

.stepper{display:flex;align-items:flex-end;gap:12px;margin:0 0 13px;
  border-bottom:1px solid var(--hair)}
.st-list{display:flex;list-style:none;margin:0;padding:0;gap:1px;flex:1;min-width:0;
  overflow-x:auto;scrollbar-width:none}
.st-list::-webkit-scrollbar{display:none}
.st-list li{flex:none}
.st-list button{font:inherit;display:flex;align-items:center;gap:7px;background:none;
  border:0;border-bottom:2px solid transparent;padding:6px 13px 7px;cursor:pointer;
  color:var(--muted);white-space:nowrap;font-size:11.5px;font-weight:640;
  transition:color .14s,border-color .14s}
.st-list button:hover{color:var(--ink)}
.st-list button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.st-list button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:2px}
.st-list i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;
  width:17px;height:17px;border-radius:50%;font-size:9.5px;font-weight:700;flex:none;
  background:var(--surface-2);border:1px solid var(--hair);color:var(--muted);
  font-variant-numeric:tabular-nums}
.st-list button[aria-current="true"] i{background:var(--accent);border-color:var(--accent);color:#fff}
.st-arrows{display:flex;gap:4px;flex:none;padding-bottom:5px}
.st-nav{font-family:inherit;display:inline-flex;align-items:center;
  justify-content:center;border:1px solid var(--rule);border-radius:2px;
  background:var(--surface);color:var(--ink);cursor:pointer;font-size:15px;line-height:1}
.st-nav:hover:not(:disabled){background:var(--surface-2);border-color:var(--ink-2)}
.st-nav:disabled{opacity:.3;cursor:default}
.st-nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.deck.anim,.track.anim{transition:none}}

.kc-v.kc-na b{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
/* ---- the headline rate rail beside the map ---- */
.mrail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;min-width:0}
@media(max-width:1240px){.mrail{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.mrail{grid-template-columns:1fr}}
.mr{font:inherit;text-align:left;display:flex;flex-direction:column;gap:5px;
  justify-content:center;overflow:hidden;padding:8px 13px;border:1px solid var(--hair);border-left:3px solid var(--rule);
  border-radius:3px;background:var(--surface);cursor:pointer;box-shadow:var(--card);
  transition:border-color .14s,background .14s}
.mr:hover{background:var(--surface-2);border-left-color:var(--accent)}
.mr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mr.on{border-left-color:var(--ink);background:var(--surface)}
.mr-h{display:flex;align-items:center;gap:7px}
.mr-h u{text-decoration:none;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;
  font-weight:700;color:var(--muted);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mr-x{font-style:normal;font-size:9px;color:var(--rule);transition:transform .18s}
.mr[aria-expanded="true"] .mr-x{transform:rotate(180deg);color:var(--accent)}
.mr-v{display:flex;align-items:baseline;gap:8px}
.mr-v b{font-size:25px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  line-height:1}
.mr-v s{text-decoration:none;margin-left:auto;font-size:9.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.mr-bar{position:relative;height:6px;background:var(--surface-2);border-radius:1px;
  overflow:hidden}
.mr-bar i{display:block;height:100%;border-radius:1px}
.mr-bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);
  text-decoration:none;transform:translateX(-1px)}
.mr-f{display:flex}
.mr-f .kc-chip{font-size:9.5px}


.mdrawer{margin:2px 0 14px;border:1px solid var(--hair);border-radius:3px;
  background:var(--surface);box-shadow:var(--card);overflow:hidden;
  animation:cdIn .26s cubic-bezier(.22,1,.36,1)}
@media(prefers-reduced-motion:reduce){.mdrawer{animation:none}}
.md-h{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--hair);background:var(--surface-2)}
.md-h b{font-size:12.5px;font-weight:700}
.md-h em{font-style:normal;font-size:10.5px;color:var(--muted)}
.md-h .cd-x{background:var(--surface);border-color:var(--rule);color:var(--ink)}
.md-h .cd-x:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.md-b{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:16px;
  padding:12px 14px 14px}
@media(max-width:1000px){.md-b{grid-template-columns:1fr}}
.md-r{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
@media(max-width:640px){.md-r{grid-template-columns:1fr}}
.md-t{margin:0 0 5px;font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;
  font-weight:700;color:var(--muted)}
.md-lb td,.md-lb th{padding:4px 6px;font-size:11px}
.md-lb td:first-child{text-align:left}
.md-lb .nm{font-weight:600}

/* Two related blocks side by side. A drilldown is not a new chapter — it
   belongs next to the thing it drills into, not a screen below it. */
.slide>.duo,.solo>.duo{flex:1;min-height:0}
.solo{display:flex;flex-direction:column;min-height:0}
.slide>.cg,.solo>.cg{flex:1 1 auto;min-height:0}
.slide>.cg .cx,.solo>.cg .cx{height:100%;display:flex;flex-direction:column;min-height:0}
.slide>.cg .cx>div:not(.cx-h):not(.cx-lg),
.solo>.cg .cx>div:not(.cx-h):not(.cx-lg){flex:1;min-height:0}
/* a panel that stretches must hand that height to its content, or the bottom
   half of the card is blank white. These two blocks are built from fixed-height
   rows, so they need to be told to distribute. */
/* height:100% because cx() nests the built node inside an unclassed wrapper
   div — the wrapper is the flex item that stretches, not this block */
.cvfill,.pfill{display:flex;flex-direction:column;min-height:0;justify-content:center;height:100%}
/* rows grow to fill, but only to a sane ceiling — with fewer cameras the
   remainder is split above and below rather than dumped at the bottom */
.cg .cvfill .cvlist,.duo .cvfill .cvlist{flex:1;display:flex;flex-direction:column;justify-content:center}
.cg .cvfill .cvlist li,.duo .cvfill .cvlist li{flex:1;min-height:30px;max-height:74px}
.cg .cvfill .cvlist .tk,.duo .cvfill .cvlist .tk{height:11px}
.cg .cvfill .cvlist .tk.span24,.duo .cvfill .cvlist .tk.span24{height:11px}
.cg .pfill .strip,.duo .pfill .strip{flex:1;min-height:20px;max-height:120px;align-items:stretch}
.cg .pfill .strip i,.duo .pfill .strip i{height:auto;align-self:stretch}
.slide>.cg .cx svg.viz,.solo>.cg .cx svg.viz{width:100%;height:100%}
/* a slide with no chart at all centres its cards in the frame instead of
   leaving a dead band under them */
.slide.centered{justify-content:space-evenly}
.slide.centered .sec:not(:first-child){margin-top:0}
.duo{display:grid;grid-template-columns:var(--duo,minmax(0,1.25fr) minmax(0,1fr));
  gap:16px;align-items:start;margin-bottom:2px}
.duo>section{min-width:0;display:flex;flex-direction:column}
.duo{align-items:stretch}
.duo .kg.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.duo .kg.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
/* the chart is the last thing in each duo column: it absorbs the leftover
   height so both columns end on the same line, not in a ragged hem */
.duo>section>.cg:last-child{flex:1;min-height:0}
.duo .cx{height:100%;display:flex;flex-direction:column;min-height:0}
.duo .cx>div:not(.cx-h):not(.cx-lg){flex:1;min-height:0}
.duo .cx svg.viz{width:100%;height:100%}
.duo .sec{margin-top:0}
@media(max-width:1080px){.duo{grid-template-columns:1fr}}


/* ---- camera affordance on a KPI card ---- */
.kc-cam{margin-left:auto;gap:5px;font-family:inherit;
  text-transform:uppercase;letter-spacing:.06em;
  background:var(--surface);color:var(--ink-2);white-space:nowrap;flex:none}
.kc-cam:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kc-cam[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.kc-cam i{width:6px;height:6px;border-radius:50%;background:var(--s1);flex:none}
.kc-cam[aria-expanded="true"] i{background:#fff}

.camdrawer{margin:2px 0 14px;border:1px solid #223449;border-radius:3px;overflow:hidden;
  background:var(--vid);animation:cdIn .26s cubic-bezier(.22,1,.36,1)}
@keyframes cdIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.camdrawer{animation:none}}
.cd-h{display:flex;align-items:center;gap:9px;padding:9px 13px;
  background:linear-gradient(180deg,#14243a,#0d1721);border-bottom:1px solid #1d2c3d}
.cd-h b{font-size:12.5px;color:var(--vid-ink);font-weight:680}
.cd-h em{font-style:normal;font-size:10.5px;color:var(--vid-muted)}
/* the same static blue as .rec.replay — a recorded export does not get a
   glowing green dot just because the panel it opens is dark */
.cd-dot{width:7px;height:7px;border-radius:50%;background:#7aa7d4;flex:none}
.cd-x{margin-left:auto;font:inherit;font-size:11px;font-weight:650;padding:4px 11px;
  border:1px solid #2b4159;border-radius:2px;background:#16283c;color:#cfe0f2;cursor:pointer}
.cd-x:hover{background:#1e3550}
.cd-x:focus-visible{outline:2px solid #6fb2ff;outline-offset:2px}

/* ---- the KPI rail inside the drawer ---- */
.vk-big{padding:10px 14px 2px;display:flex;align-items:baseline;gap:7px}
.vk-big b{font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--vid-ink);
  font-variant-numeric:tabular-nums;line-height:1}
.vk-big b.t-good{color:#7ee0a8}.vk-big b.t-warn{color:#ffc46e}.vk-big b.t-crit{color:#ff8f8f}
.vk-big i{font-style:normal;font-size:11px;color:var(--vid-muted)}
.vk-day{display:flex;align-items:baseline;gap:8px;margin:6px 14px 7px;padding-bottom:7px;
  border-bottom:1px solid rgba(120,160,200,.16)}
.vk-day u{text-decoration:none;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;
  font-weight:650;color:var(--vid-muted);flex:1}
.vk-day b{font-size:13px;font-weight:700;color:#9ecbff;font-variant-numeric:tabular-nums}
.vk{padding:0 14px 8px}
.vk-r{display:flex;align-items:baseline;gap:10px;padding:3.5px 0;
  border-bottom:1px solid rgba(120,160,200,.08)}
.vk-r:last-child{border-bottom:0}
.vk-r u{text-decoration:none;font-size:10.5px;color:var(--vid-muted);flex:1;min-width:0}
.vk-r b{font-size:12px;font-weight:700;color:var(--vid-ink);font-variant-numeric:tabular-nums;
  text-align:right}
.vk-r b.t-good{color:#7ee0a8}.vk-r b.t-warn{color:#ffc46e}.vk-r b.t-crit{color:#ff8f8f}

/* breadcrumb */
.backbtn[hidden]{display:none}
.backbtn{font-family:inherit;font-weight:650;display:inline-flex;align-items:center;
  gap:6px;padding:4px 10px 4px 8px;margin-right:8px;border:1px solid var(--rule);
  border-radius:2px;background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.backbtn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.backbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.backbtn::before{content:"‹";font-size:15px;line-height:1;margin-top:-1px}
.crumb{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.crumb button{font:inherit;font-size:12px;font-weight:640;background:none;border:0;
  padding:2px 4px;color:var(--accent);cursor:pointer;border-radius:2px}
.crumb button:hover{background:var(--accent-soft)}
.crumb button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.crumb span{font-size:12px;font-weight:680;color:var(--ink)}
.crumb i{font-style:normal;color:var(--rule);font-size:12px}

/* leaderboard */
.lb{width:100%;border-collapse:collapse;font-size:11.5px}
.lb th{text-align:right;padding:4px 9px;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.08em;font-weight:700;color:var(--muted);border-bottom:1px solid var(--rule);
  white-space:nowrap}
.lb th:nth-child(2){text-align:left}
.lb td{text-align:right;padding:4px 9px;border-bottom:1px solid var(--hair);
  font-variant-numeric:tabular-nums}
.lb td:nth-child(2){text-align:left}
.lb tbody tr{cursor:pointer}
.lb tbody tr:hover{background:var(--surface-2)}
.lb .r{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
  border-radius:2px;font-size:10px;font-weight:700;background:var(--surface-2);
  border:1px solid var(--hair);color:var(--ink-2)}
.lb .nm{font-weight:640}
.lb .nm em{display:block;font-style:normal;font-size:9.5px;color:var(--muted)}
/* every centre in scope is listed; the panel scrolls, the page does not */
.lb-scroll{padding:0 6px 4px;overflow-y:auto;min-height:0;flex:1}
.slide>.panel,.solo>.panel{flex:none}
.slide>.panel.grow,.solo>.panel.grow{flex:1;min-height:0}
.slide>.camdrawer,.slide>.mdrawer,.solo>.camdrawer,.solo>.mdrawer{flex:none}
.slide>.cx,.solo>.cx{flex:none}
.lb thead th{position:sticky;top:0;background:var(--surface);z-index:2;
  box-shadow:0 1px 0 var(--rule)}
.lb .sw{display:inline-block;width:44px;height:7px;border-radius:1px;vertical-align:middle}
.lb.tc td:nth-child(2),.lb.tc td:nth-child(3),
.lb.tc th:nth-child(2),.lb.tc th:nth-child(3){text-align:left}
.lb.tc td:last-child,.lb.tc th:last-child{text-align:left;white-space:nowrap}

/* ================================================================
   CARD MARK VOCABULARY
   Every KPI card that carried only a number had 60-90px of void under
   it, and `meter:` — set on fourteen cards — had no rule at all, so it
   rendered a zero-height transparent div. These marks fill that void
   with the figure's own shape: a countable set as glyphs, a time as a
   position on the day, a confidence as a range, a frequency as four
   dots. Height-neutral: a grid row is already as tall as its tallest
   card, so a mark inside a previously empty card costs nothing.
   ================================================================ */

/* the card meter — the missing rule. Track is the light step of its own
   ramp; the reference is a rule, not a hint. */
.km{position:relative;height:8px;margin-top:9px;background:var(--surface-2);
  border:1px solid var(--hair);border-radius:2px}
.km>i{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:1px 0 0 1px}
.km.ok{background:#eaf7ea}   .km.ok>i{background:var(--good)}
.km.warn{background:#fdf6e6} .km.warn>i{background:var(--warning)}
.km.crit{background:#fbeeee} .km.crit>i{background:var(--critical)}
.km>u{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;
  background:var(--ink);text-decoration:none;border-radius:1px}
.km-ax{display:flex;justify-content:space-between;gap:8px;margin-top:4px;
  font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.km-ax b{color:var(--ink-2);font-weight:700}
.km-ax span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.km-ax span:last-child{flex:none}

/* a countable set is shown as the set. "6 of 8" as eight glyphs reads from
   the back of a room and cannot raise the question "per cent of what?". */
.ku{display:flex;flex-wrap:wrap;gap:3px;margin-top:9px;align-items:center}
.ku i{width:13px;height:13px;border-radius:2px;background:var(--s1);flex:none}
.ku i.off{background:transparent;border:1.5px solid var(--rule)}
/* the status class must not repaint the hollow glyphs: an "off" unit is the
   room nobody is watching, and colouring it in erases the whole point */
.ku.ok i.on{background:var(--good)} .ku.warn i.on{background:var(--warning)}
.ku.crit i.on{background:var(--critical)} .ku.dec i.on{background:var(--muted)}
.ku s{text-decoration:none;font-size:10px;color:var(--muted);margin-left:3px;
  font-variant-numeric:tabular-nums}

/* declared content is more informative than its own cardinality: the sectors,
   the room categories, the mismatched pairs — not just how many there are */
.ktags{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px;overflow:hidden;max-height:44px}
.ktags b{font-weight:640;font-size:10px;letter-spacing:.02em;padding:2px 6px;
  border:1px solid var(--hair);border-radius:9px;background:var(--surface-2);
  color:var(--ink-2);white-space:nowrap}

/* a per-item spread under a centre-wide total: which course holds the seats,
   where the vacancy actually is */
.kmini{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:9px}
.kmini i{flex:1;min-width:3px;background:var(--q3);border-radius:1px 1px 0 0;
  align-self:flex-end}
.kmini i.hi{background:var(--s1)}
.kmini-ax{display:flex;gap:3px;margin-top:3px}
.kmini-ax span{flex:1;min-width:0;font-size:9px;color:var(--muted);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}

/* a mean is not a distribution. A confidence or a floor reading gets its
   spread drawn, so nobody reads the average as the whole story. */
.krg{position:relative;height:20px;margin-top:9px}
.krg .tk{position:absolute;left:0;right:0;top:9px;height:2px;background:var(--hair)}
.krg .sp{position:absolute;top:7px;height:6px;background:var(--q2);border-radius:3px}
.krg .mn,.krg .mx{position:absolute;top:4px;height:12px;width:1.5px;background:var(--rule)}
.krg .vv{position:absolute;top:3px;width:3px;height:14px;margin-left:-1.5px;
  background:var(--ink);border-radius:1px}
.krg-ax{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);
  font-variant-numeric:tabular-nums;margin-top:-2px}

/* a time is a position, not a number. Feed windows, first detection and the
   busiest moment in a corridor all live on the same day rail. */
.kdb{position:relative;height:11px;margin-top:9px;background:var(--surface-2);
  border:1px solid var(--hair);border-radius:2px;overflow:hidden}
.kdb>i{position:absolute;top:0;bottom:0;background:var(--s1);border-radius:1px}
.kdb.warn>i{background:var(--warning)}
.kdb>u{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;
  background:var(--ink);text-decoration:none;overflow:visible}
.kdb>s{position:absolute;top:0;bottom:0;text-decoration:none;
  background:repeating-linear-gradient(45deg,var(--rule) 0 2px,transparent 2px 5px)}

/* frequency across the four days of feed is what separates an intentional
   switch-off from a technical fault, so it is drawn, not written */
.kdays{display:flex;align-items:center;gap:5px;margin-top:9px}
.kdays i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--rule);
  background:transparent;flex:none}
.kdays i.on{background:var(--critical);border-color:var(--critical)}
.kdays i.cur{box-shadow:0 0 0 2px var(--accent-soft)}
.kdays em{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:600;
  margin-left:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* the one licensed band scale: for People-on-System the interpretation IS the
   content — 1.0 expected, 1.2 the breach line, 1.1 the assessor behind a
   screen. A bare "1.1" invites exactly the wrong conclusion. */
.kband{position:relative;height:22px;margin-top:9px}
.kband .tk{position:absolute;left:0;right:0;top:6px;height:9px;border-radius:2px;
  background:linear-gradient(90deg,#eaf7ea 0 60%,#fdf6e6 60% 78%,#fbeeee 78% 100%);
  border:1px solid var(--hair)}
.kband .bl{position:absolute;top:2px;bottom:5px;width:1.5px;background:var(--rule)}
.kband .vv{position:absolute;top:1px;width:3px;height:19px;margin-left:-1.5px;
  background:var(--ink);border-radius:1px}
.kband-ax{position:relative;height:12px;font-size:10px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.kband-ax span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* a modelled figure is a promise, not a measurement — so it differs in KIND,
   not only in the hue of its dot: the rail is hatched and so is every fill
   inside it. The dot alone was carrying this distinction on its own. */
.kc.is-modelled{border-left-color:#efdcae}
.kc.is-modelled::before{content:"";position:absolute;left:-3px;top:-1px;bottom:-1px;
  width:3px;pointer-events:none;
  background:repeating-linear-gradient(180deg,var(--warning) 0 3px,transparent 3px 7px)}
.kc.is-modelled .km>i,.kc.is-modelled .kc-bar>i,.kc.is-modelled .kc-tri i,
.kc.is-modelled .ku i,.kc.is-modelled .kmini i{
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 2px,transparent 2px 4px)}

/* three cards that are three slices of one whole show the whole, each
   emphasising its own slice — so the reader can see that they sum */
.kc-tri i.dim{opacity:.30}
.kc-tri i.hi{box-shadow:inset 0 0 0 1.5px var(--ink)}
.kc-tri-ax{display:flex;gap:10px;margin-top:4px;font-size:10px;color:var(--muted)}
.kc-tri-ax i{display:inline-flex;align-items:center;gap:4px;font-style:normal}
.kc-tri-ax i b{width:7px;height:7px;border-radius:1px;flex:none}
</style>
</head>
