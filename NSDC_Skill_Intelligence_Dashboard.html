  {k:"assess", short:"Assessment",   n:"Assessment Attendance Rate", ref:90, page:4,
   sub:"Candidates detected present on assessment day against the eligible list"},
  {k:"enrol",  short:"Enrollment",   n:"Center-Wide Enrollment Utilization Rate", ref:85, page:1,
   sub:"Total enrolled headcount against total sanctioned capacity"},
  {k:"cover",  short:"Coverage",     n:"Camera Coverage Ratio",      ref:78, page:1,
   sub:"Spaces with a working camera against total declared spaces"}
];
const MET=Object.fromEntries(METRICS.map(m=>[m.k,m]));

/* ---- outline geometry: parsed once, so centres scatter INSIDE their own
   state instead of piling onto its centroid ---- */
const hs=str=>{let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};
function pathRings(d){
  return d.split("Z").filter(t=>t.length>3).map(seg=>{
    const pts=[],re=/(-?\d*\.?\d+) (-?\d*\.?\d+)/g;let m;
    while((m=re.exec(seg))) pts.push([+m[1],+m[2]]);
    return pts;
  });
}
function ringsBox(rings){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  rings.forEach(p=>p.forEach(pt=>{
    if(pt[0]<x0)x0=pt[0]; if(pt[0]>x1)x1=pt[0];
    if(pt[1]<y0)y0=pt[1]; if(pt[1]>y1)y1=pt[1];}));
  return [x0,y0,x1,y1];
}
function inRings(rings,x,y){
  let inside=false;
  rings.forEach(p=>{
    for(let i=0,j=p.length-1;i<p.length;j=i++){
      const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];
      if((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/((yj-yi)||1e-9)+xi) inside=!inside;
    }
  });
  return inside;
}
const GEOM={};
Object.keys(GEO).forEach(k=>{const r=pathRings(GEO[k][1]);GEOM[k]={rings:r,box:ringsBox(r)};});

/* ---- the national roster ---- */
const NAMEF=[d=>"Govt. ITI, "+d, d=>d+" Skill Development Centre",
             d=>"PMKVY Training Centre, "+d, d=>d+" Kaushal Kendra",
             d=>"NSDC Partner Centre, "+d];
const NCENTRES=[];
Object.keys(GEO).forEach(code=>{
  const g=GEO[code], ds=DISTRICTS[code]||[g[0]], gm=GEOM[code];
  const r=rng(hs("st:"+code));
  const n=Math.max(3,Math.round(g[4]*12));
  /* one state-wide bias, so the choropleth reads as geography and not as noise */
  const bias=(r()-0.5)*0.30;
  for(let i=0;i<n;i++){
    const dist=ds[i%ds.length];
    let x=g[2],y=g[3];
    const bx=gm.box;
    for(let t=0;t<60;t++){
      const px=bx[0]+(bx[2]-bx[0])*r(), py=bx[1]+(bx[3]-bx[1])*r();
      if(inRings(gm.rings,px,py)){x=px;y=py;break;}
    }
    const nTrades=2+Math.floor(r()*4);
    const trades=[];
    let guard=0;
    while(trades.length<nTrades&&guard++<200){
      /* weighted: a national mix is dominated by automotive, IT and
         healthcare, not spread evenly across twelve QP families */
      let x=r()*TW_TOT, t=TRADE_CAT[0];
      for(let k=0;k<TRADE_CAT.length;k++){x-=TRADE_W[TRADE_CAT[k].c];if(x<=0){t=TRADE_CAT[k];break;}}
      if(trades.indexOf(t.c)<0) trades.push(t.c);
    }
    const sanctioned=trades.length*(30+Math.floor(r()*5)*10);
    const q=clamp(0.5+bias+(r()-0.5)*0.42,0.06,0.99);      // the centre's own standing
    const enrolled=Math.round(sanctioned*clamp(0.55+q*0.5+(r()-0.5)*0.16,0.3,1));
    const spaces=trades.length+1+Math.floor(r()*3);
    const watched=Math.min(spaces,Math.max(1,Math.round(spaces*clamp(0.55+q*0.55,0.35,1))));
    NCENTRES.push({
      id:code+"-"+String(i+1).padStart(2,"0"),
      code:"TC-"+code+"-"+String(1000+Math.floor(r()*8999)),
      name:NAMEF[Math.floor(r()*NAMEF.length)](dist),
      st:code, stName:g[0], district:dist, x:+x.toFixed(1), y:+y.toFixed(1),
      trades, sanctioned, enrolled, spaces, watched,
      accDays:20+Math.floor(r()*680),
      m:{
        attend : clamp(38+q*56+(r()-0.5)*9, 12,99.4),
        equip  : clamp(30+q*62+(r()-0.5)*11, 8,99.0),
        assess : clamp(55+q*46+(r()-0.5)*9, 20,99.8),
        enrol  : enrolled/sanctioned*100,
        cover  : watched/spaces*100
      }
    });
  }
});
const NC=Object.fromEntries(NCENTRES.map(c=>[c.id,c]));

/* enrolment-weighted: a 400-seat centre and a 40-seat centre are not
   the same weight of evidence */
function aggOf(list){
  const w=list.reduce((a,c)=>a+c.enrolled,0)||1;
  const o={n:list.length, enrolled:0, sanctioned:0, spaces:0, watched:0};
  METRICS.forEach(m=>o[m.k]=0);
  list.forEach(c=>{
    o.enrolled+=c.enrolled; o.sanctioned+=c.sanctioned;
    o.spaces+=c.spaces; o.watched+=c.watched;
    METRICS.forEach(m=>o[m.k]+=c.m[m.k]*c.enrolled);
  });
  METRICS.forEach(m=>o[m.k]/=w);
  o.enrol=o.enrolled/(o.sanctioned||1)*100;
  o.cover=o.watched/(o.spaces||1)*100;
  return o;
}
const ST_LIST={}; NCENTRES.forEach(c=>{(ST_LIST[c.st]=ST_LIST[c.st]||[]).push(c);});
const ST_AGG={};  Object.keys(ST_LIST).forEach(k=>{ST_AGG[k]=aggOf(ST_LIST[k]);});
const NAT_AGG=aggOf(NCENTRES);
const NAT_DISTRICTS=new Set(NCENTRES.map(c=>c.st+"/"+c.district)).size;

/* scope readers — pages ask these, never S.geo directly */
const scopeCentre=()=>S.geo.ctr?NC[S.geo.ctr]:null;
const scopeList=()=>S.geo.lvl==="in"?NCENTRES:
                    S.geo.lvl==="st"?ST_LIST[S.geo.st]:[NC[S.geo.ctr]];
const scopeAgg=()=>S.geo.lvl==="in"?NAT_AGG:
                   S.geo.lvl==="st"?ST_AGG[S.geo.st]:aggOf([NC[S.geo.ctr]]);
const scopeLabel=()=>S.geo.lvl==="in"?"India":
                     S.geo.lvl==="st"?GEO[S.geo.st][0]:NC[S.geo.ctr].name;

/* The funnel is OUR story, not the scheme's: it is the attrition that
   appears the moment a camera is asked to confirm each declared stage. */
function funnelOf(a){
  const e=a.enrolled;
  const present  = e*clamp(a.attend/100*1.06,0,1);
  const thresh   = present*clamp(0.70+a.attend/100*0.26,0,1);
  const concord  = thresh*clamp(a.equip/100*0.32+0.66,0,1);
  const assessed = concord*0.92;
  const certified= assessed*clamp(0.62+a.equip/100*0.24,0,1);
  return [
    {k:"Enrolled",                 v:e,         s:"declared",note:"Declared at registration"},
    {k:"Camera-Verified Present",  v:present,   s:"measured",note:"Observed in frame in at least one session"},
    {k:"Attendance Threshold Met", v:thresh,    s:"measured",note:"Present for 70% of the session minutes the camera observed"},
    {k:"Equipment-Active Session", v:concord, s:"modelled",note:"Machinery showed detected activity during the session"},
    {k:"Assessment Attendance",    v:assessed,  s:"modelled",note:"Detected present on assessment day — proposed detector"},
    {k:"Certified",                v:certified, s:"declared",note:"Awarding body record"}
  ];
}

/* ================================================================
   4 · derive everything from the real series
   One derivation pass; every page reads these, so a tile can always
   be cross-checked against the curve it came from.
   ================================================================ */
function deriveDay(camId,date){
  const s=SER10[camId]&&SER10[camId][date];
  if(!s) return null;
  const a=sl(DAY_FROM), b=sl(DAY_TO);
  let peak=0,peakSlot=-1,sumIn=0,nIn=0,firstIn=-1,lastIn=-1,noData=0,present=0;
  let nightSum=0,nightN=0,nightMax=0;
  /* footfall measures, for spaces where "a cohort of 3" is the wrong question.
     The open-area camera's own overnight false positives reach 2.7, so the
     batch threshold cannot be reused there. */
  let personMin=0,anySum=0,anyN=0;
  for(let i=0;i<SLOTS;i++){
    const v=s[i];
    const night=(i<sl(6*60)||i>=sl(21*60));
    if(v<0){ if(i>=a&&i<b) noData++; continue; }
    const p=v/10;
    if(night){nightSum+=p;nightN++;if(p>nightMax)nightMax=p;}
    if(i<a||i>=b) continue;
    if(p>peak){peak=p;peakSlot=i;}
    personMin+=p*BUCKET;
    if(p>=0.75){anySum+=p;anyN++;}
    if(p>=COHORT_THR){
      present++; sumIn+=p; nIn++;
      if(firstIn<0) firstIn=i; lastIn=i;
    }
  }
  const c=courseOf(camId);
  const schedFrom=c?c.start:null, schedTo=c?c.start+c.hours*60:null;
  return {
    cam:camId,date,peak,peakMin:peakSlot>=0?mn(peakSlot):null,
    avgIn:nIn?sumIn/nIn:0,
    personMin,                                   // footfall: sum of people x minutes
    anyAvg:anyN?anySum/anyN:null,                // mean while anyone at all is present
    anyMin:anyN*BUCKET,
    presentMin:present*BUCKET,
    firstMin:firstIn>=0?mn(firstIn):null,
    lastMin:lastIn>=0?mn(lastIn):null,
    noDataMin:noData*BUCKET,
    nightAvg:nightN?nightSum/nightN:0, nightMax,
    cov:COV[camId]?COV[camId][date]:[0,0],
    gapsMin:(FEEDMETA[camId]&&FEEDMETA[camId][date]?FEEDMETA[camId][date].gaps:0)*BUCKET,
    schedFrom,schedTo,
    committedMin:c?c.hours*60:0,
    /* There is deliberately NO "committed minutes actually covered by the
       export" field here. It can only be computed by walking from COURSES[].start
       — a declared DAILY batch timing — and the moment such a field exists,
       something wires a KPI to it: the card colour on Active Class-Hours did
       exactly that, under a note promising it did not. The two-source rule is
       enforced by the field not existing, not by a comment asking nicely. */
    /* signed: a negative value means the cohort was in the room before the
       assumed start, which is evidence about the assumption, not the room */
    lateStart:(c&&firstIn>=0)?(mn(firstIn)-schedFrom):null,
    earlyFinish:(c&&lastIn>=0)?Math.max(0,schedTo-mn(lastIn)):null,
    running:present*BUCKET>=30      // a real session, not a stray detection
  };
}
const D={};   // D[date][cam]
FEED_DATES.forEach(d=>{D[d]={};CAMS.forEach(c=>{const r=deriveDay(c,d);if(r)D[d][c]=r;});});

/* series accessors used by the charts */
function curveOf(camId,date,fromMin,toMin,bucketMin){
  const s=SER10[camId]&&SER10[camId][date]; if(!s) return null;
  const step=Math.max(1,Math.round(bucketMin/BUCKET));
  const stepMin=step*BUCKET;              // the bucket ACTUALLY used
  const out=[],lab=[];
  for(let i=sl(fromMin);i<sl(toMin);i+=step){
    let a=0,n=0;
    for(let k=i;k<Math.min(sl(toMin),i+step);k++){ if(s[k]>=0){a+=s[k]/10;n++;} }
    out.push(n?a/n:null); lab.push(hm(mn(i)));
  }
  /* callers place bands by index, so they must use stepMin — never the
     bucketMin they asked for, which gets rounded to a multiple of BUCKET */
  return {v:out,lab,stepMin,from:fromMin,
          idxOf:m=>clamp(Math.round((m-fromMin)/stepMin),0,out.length-1)};
}
/* mean of a set of cameras over an hour band, real data only */
function hourMean(camIds,date,hour){
  let a=0,n=0;
  camIds.forEach(c=>{const s=SER10[c]&&SER10[c][date];if(!s)return;
    for(let i=sl(hour*60);i<sl((hour+1)*60);i++) if(s[i]>=0){a+=s[i]/10;n++;}});
  return n?a/n:null;
}

/* ---- centre / day rollups (measured) ---- */
function roll(date,centre){
  const rooms=ROOMS.filter(r=>!centre||SP[r].centre===centre);
  const rs=rooms.map(r=>D[date][r]).filter(Boolean);
  const live=rs.filter(r=>r.running);
  let peak=0,peakCam=null;      // classrooms only - corridors are footfall, not attendance
  rs.forEach(r=>{if(r.peak>peak){peak=r.peak;peakCam=r.cam;}});
  const activeMin=rs.reduce((a,r)=>a+r.presentMin,0);
  const committed=rs.reduce((a,r)=>a+r.committedMin,0);
  return {
    rooms:rooms.length, running:live.length,
    /* null, not 0, when nothing ran — "no session" is not "zero students" */
    avgAtt:live.length?live.reduce((a,r)=>a+r.avgIn,0)/live.length:null,
    peak,peakCam,
    activeHours:activeMin/60, committedHours:committed/60,
    /* against the hours-per-day committed at ACCREDITATION — the only
       commitment a centre cannot move after the fact */
    util:committed?activeMin/committed*100:null,
    nightAvg:rs.length?rs.reduce((a,r)=>a+r.nightAvg,0)/rs.length:null,
    noDataMin:rs.reduce((a,r)=>a+r.noDataMin,0),
    gapsMin:rs.reduce((a,r)=>a+r.gapsMin,0)
  };
}

/* ================================================================
   5 · the MODELLED layer
   Deterministic, seeded, and derived from the real curve so it never
   contradicts it — but it is still an illustration, and every figure
   built from it is tagged Modelled.
   ================================================================ */
const MCH={ "cam-5":{instr:.93,inter:.68,equip:.74}, "cam-6":{instr:.90,inter:.62,equip:.71},
            "cam-7":{instr:.96,inter:.66,equip:.88}, "cam-8":{instr:.58,inter:.41,equip:.34},
            "cam-2":{instr:.12,inter:.10,equip:0},  "cam-3":{instr:.15,inter:.12,equip:0} };

function modelInstructor(camId,date){
  const r=D[date]&&D[date][camId]; if(!r) return null;
  const ch=MCH[camId]||{instr:.8,inter:.6};
  const g=rng(hashStr(camId+date));
  const s=SER10[camId][date];
  const bits=[];              // one per 10-minute block across the teaching day
  const step=sl(10);
  for(let i=sl(DAY_FROM);i<sl(DAY_TO);i+=step){
    let occ=0,n=0;
    for(let k=i;k<i+step&&k<SLOTS;k++){ if(s[k]>=0){occ+=(s[k]/10>=COHORT_THR)?1:0;n++;} }
    const cohort=n&&occ/n>0.4;
    bits.push(cohort?(g()<ch.instr?1:0):-1);   // -1 = no cohort in the room
  }
  const withCohort=bits.filter(b=>b>=0).length;
  const withInstr=bits.filter(b=>b===1).length;
  return {bits,step:10,from:DAY_FROM,
    presentMin:withInstr*10, cohortMin:withCohort*10,
    coverage:withCohort?withInstr/withCohort:null,   // null, not 0: no cohort means no denominator
    interactivity:ch.inter,
    firstSeenMin:(()=>{const i=bits.indexOf(1);return i<0?null:DAY_FROM+i*10;})()};
}
function hashStr(x){let h=2166136261;for(let i=0;i<x.length;i++){h^=x.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const MI={};  // MI[date][cam]
FEED_DATES.forEach(d=>{MI[d]={};ROOMS.forEach(c=>{const m=modelInstructor(c,d);if(m)MI[d][c]=m;});});

/* A room is in one of three states, and the split needs the instructor model,
   so it is folded back onto the derived day once MI exists:
     active       cohort AND instructor
     unsupervised cohort present, nobody teaching
     idle         nobody in the room
   Only the idle share is purely measured; the other two inherit the model. */
FEED_DATES.forEach(d=>ROOMS.forEach(c=>{
  const r=D[d]&&D[d][c], m=MI[d]&&MI[d][c];
  if(!r) return;
  if(!m){ r.activeMin=0; r.unsupMin=0; r.idleMin=DAY_TO-DAY_FROM; r.instrMin=0; return; }
  const blk=m.step;
  r.activeMin=m.bits.filter(b=>b===1).length*blk;
  r.unsupMin =m.bits.filter(b=>b===0).length*blk;
  r.idleMin  =Math.max(0,(DAY_TO-DAY_FROM)-r.activeMin-r.unsupMin);
  r.instrMin =r.activeMin;
}));

/* AEBAS (modelled): sits above the camera peak, and far above it in the
   room the feed shows as under-attended — the gap the spec's
   triangulation exists to surface. */
const AEBAS={};
FEED_DATES.forEach(d=>{AEBAS[d]={};COURSES.forEach(c=>{
  const r=D[d][c.space]; if(!r) return;
  const g=rng(hashStr("aebas"+c.code+d));
  const dark=!r.running;
  const infl=dark?Math.round(c.enrolled*(0.72+g()*0.16))          // "attendance" for a room with nobody in it
                 :(c.code==="WLD"?6+Math.floor(g()*4):Math.floor(g()*3));
  AEBAS[d][c.code]=Math.min(c.enrolled,Math.round((dark?0:r.peak)+infl));
});});

/* ================================================================
   4b · "All days" aggregate — synthetic date key "ALL"
   Peak here is the AVERAGE of the daily peaks (the aggregation the
   review meeting asked for), never a re-computed instantaneous max.
   ================================================================ */
const ALLD="ALL";
(function(){
  CAMS.concat(COMMON).forEach(c=>{ if(!SER10[c]) return;
    const out=new Int16Array(SLOTS);
    for(let i=0;i<SLOTS;i++){
      let sum=0,n=0;
      FEED_DATES.forEach(d=>{const v=SER10[c][d]&&SER10[c][d][i];
        if(v!=null&&v>=0){sum+=v;n++;}});
      out[i]=n?Math.round(sum/n):-1;
    }
    SER10[c][ALLD]=out;
  });
  /* average the covered window — unioning it would erase the two partial
     export days and inflate Feed Availability to a flat 24 h */
  const covLen=avg(FEED_DATES.map(d=>PARTIAL[d].to-PARTIAL[d].from));
  const covFrom=avg(FEED_DATES.map(d=>PARTIAL[d].from));
  PARTIAL[ALLD]={from:Math.round(covFrom),to:Math.round(covFrom+covLen),full:false};
  Object.keys(COV).forEach(c=>{ if(!COV[c]) return;
    const f=Math.min(...FEED_DATES.map(d=>COV[c][d]?COV[c][d][0]:1e9));
    const t=Math.max(...FEED_DATES.map(d=>COV[c][d]?COV[c][d][1]:-1));
    if(t>=0) COV[c][ALLD]=[f,t]; });
  Object.keys(FEEDMETA).forEach(c=>{
    FEEDMETA[c][ALLD]={
      slots:Math.round(avg(FEED_DATES.map(d=>FEEDMETA[c][d]?FEEDMETA[c][d].slots:0))),
      /* averaged, not summed — the drawer prints slots and gaps adjacently
         and a summed gap count against a mean slot count is 4x too high */
      gaps:Math.round(avg(FEED_DATES.map(d=>FEEDMETA[c][d]?FEEDMETA[c][d].gaps:0)))};
  });
  D[ALLD]={};
  /* a presence strip has no meaningful average: averaging 0/1 bits across days
     would invent a state that never occurred. The All-days strip therefore shows
     the LATEST day, and every reader of it must say so on screen. */
  MI[ALLD]=MI[FEED_DATES[FEED_DATES.length-1]];
  ROOMS.concat(COMMON).forEach(r=>{
    const recs=FEED_DATES.map(d=>D[d][r]).filter(Boolean);
    if(!recs.length) return;
    const o={cam:r};
    /* average every numeric field generically — a hand-written field list
       silently breaks any page that reads a field the list forgot */
    Object.keys(recs[0]).forEach(k=>{
      const vs=recs.map(x=>x[k]).filter(v=>typeof v==="number"&&isFinite(v));
      if(vs.length) o[k]=avg(vs);
    });
    o.running=recs.some(x=>x.running);
    /* the coverage page reads r.cov — union the daily windows */
    const wins=recs.map(x=>x.cov).filter(w=>Array.isArray(w)&&w.length===2);
    o.cov=wins.length?[Math.min.apply(null,wins.map(w=>w[0])),
                       Math.max.apply(null,wins.map(w=>w[1]))]:[0,0];
    const fm=recs.map(x=>x.firstMin).filter(v=>typeof v==="number");
    o.firstMin=fm.length?Math.min.apply(null,fm):null;
    o.peakMin=null;            // an averaged peak has no single minute
    D[ALLD][r]=o;
  });
  AEBAS[ALLD]={};
  COURSES.forEach(c=>{AEBAS[ALLD][c.code]=
    Math.round(avg(FEED_DATES.map(d=>AEBAS[d][c.code])));});
})();

/* ================================================================
   5b · state — declared before anything reads it
   ================================================================ */
const S={tab:"overview",date:FEED_DATES[FEED_DATES.length-1],centre:"",
         space:"cam-7",focusCam:"cam-7",tables:false,measuredOnly:false,
         /* map scope: "in" national | "st" one state | "ctr" one centre.
            At centre level S.centre stays "" — every centre opens the one
            real camera export, which is the whole point of the drill. */
         geo:{lvl:"in",st:null,ctr:null}, metric:"attend",
         slide:0, slideN:1, mopen:null};

/* ================================================================
   6 · tiny DOM helpers
   ================================================================ */
function el(t,a,kids){
  const n=document.createElement(t);
  if(a) for(const k in a){
    const v=a[k];
    if(v==null) continue;
    if(k==="class") n.className=v;
    else if(k==="html") n.innerHTML=v;
    else if(k==="text") n.textContent=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v);
  }
  (kids||[]).forEach(c=>c&&n.appendChild(c));
  return n;
}
let SYNCS=[];   // per-chart re-layout hooks, refreshed every render
const NS="http://www.w3.org/2000/svg";
function sv(t,a){const n=document.createElementNS(NS,t);for(const k in a){if(a[k]!=null)n.setAttribute(k,a[k]);}return n;}
const CSSV=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SER=["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"].map(CSSV);
const SEQ=["--q1","--q2","--q3","--q4","--q5","--q6"].map(CSSV);
const ST={good:CSSV("--good"),warning:CSSV("--warning"),serious:CSSV("--serious"),critical:CSSV("--critical")};
const SURFACE=CSSV("--surface");

/* Axis ceilings land on a round number so four evenly-spaced ticks carry
   evenly-spaced values. value*1.15 was giving ladders like 0-7-14-22-29. */
function niceMax(v,ticks){
  if(!(v>0)) return 1;
  const t=ticks||4, want=v/t;                 // the step each tick must carry
  const p=Math.pow(10,Math.floor(Math.log10(want))), n=want/p;
  const step=(n<=1?1:n<=1.5?1.5:n<=2?2:n<=2.5?2.5:n<=3?3:n<=4?4:n<=5?5:n<=6?6:n<=8?8:10)*p;
  return step*t;                              // ceiling divides evenly by ticks
}

/* "higher is better" bars use emphasis, not a wall of green: every bar carries
   the neutral series hue, and only a bar that falls short takes a status colour.
   Severity charts (lateness, gaps) keep full status colouring — there the
   magnitude IS the severity. */
const shortfall=(warn,crit)=>v=>v<crit?ST.critical:v<warn?ST.warning:SER[0];

/* ---- tooltip ---- */
const tip=document.getElementById("tip");
function showTip(e,html){
  tip.innerHTML=html;tip.style.opacity="1";
  const r=tip.getBoundingClientRect();
  let x=e.clientX+14,y=e.clientY-10;
  if(x+r.width>innerWidth-8) x=e.clientX-r.width-14;
  if(y+r.height>innerHeight-8) y=innerHeight-r.height-8;
  if(y<8) y=8;
  tip.style.left=x+"px";tip.style.top=y+"px";
}
const hideTip=()=>{tip.style.opacity="0";};
function hoverable(node,html){
  node.addEventListener("mousemove",e=>showTip(e,typeof html==="function"?html(e):html));
  node.addEventListener("mouseleave",hideTip);
  node.addEventListener("focus",e=>showTip({clientX:node.getBoundingClientRect().left+20,clientY:node.getBoundingClientRect().top},typeof html==="function"?html(e):html));
  node.addEventListener("blur",hideTip);
}

/* ================================================================
   7 · chart primitives
   Specs from the dataviz method: ≤24px bars with a 4px rounded
   data-end, 2px lines, ≥8px markers, 2px surface gaps, hairline
   solid grid, selective direct labels, legend for ≥2 series,
   and a table-view twin for every chart.
   ================================================================ */

/* an empty selection is a real answer, not an error state */
function emptyViz(msg){
  const box=el("div",{style:"padding:26px 14px;text-align:center"});
  box.appendChild(el("div",{class:"micro",text:"Nothing to plot"}));
  box.appendChild(el("p",{style:"margin:7px 0 0;font-size:12px;color:var(--ink-2);max-width:46ch;display:inline-block",
    text:msg||"No rows match the current Centre, Day and Space selection."}));
  return box;
}

function mkTable(cols,rows){
  const t=el("table",{class:"dv"});
  t.appendChild(el("thead",{},[el("tr",{},cols.map(c=>el("th",{text:c})))]));
  t.appendChild(el("tbody",{},rows.map(r=>el("tr",{},r.map(c=>el("td",{text:c}))))));
  return t;
}

/* --- grouped / single bar chart (vertical columns) --- */
function columns(opts){
  const {cats,series,fmtV=v=>fmt(v),yMax,labelEvery=1,h=210,statusOf=null}=opts;
  if(!cats||!cats.length||!series||!series.length) return emptyViz(opts.emptyNote);
  const W=opts.W||760,PL=42,PR=14,PT=16,PB=42;
  const plotW=W-PL-PR, plotH=h-PT-PB;
  const max=yMax||niceMax(Math.max(...series.flatMap(s=>s.v),0)*1.04);
  const svg=sv("svg",{class:"viz",viewBox:`0 0 ${W} ${h}`,role:"img"});
  /* cap the band so two categories do not spread across 700px of void, and
     stop the grid where the bands stop so the emptiness is not ruled off */
  const band=Math.min(plotW/cats.length,Math.max(90,26*series.length+58));
  const runW=band*cats.length;
  const xEnd=PL+runW;
  // grid
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const y=PT+plotH-(plotH*i/ticks);
    svg.appendChild(sv("line",{x1:PL,x2:xEnd,y1:y,y2:y,class:i?"grid-l":"base-l"}));
    const tv=sv("text",{x:PL-8,y:y+3.5,class:"ax","text-anchor":"end"});
    tv.textContent=fmt(max*i/ticks, Number.isInteger(max/ticks)?0:1);
    svg.appendChild(tv);
  }
  const n=series.length;
  const GAP=2;                                  // the surface gap
  const bw=Math.min(24,(band*0.62-GAP*(n-1))/n);
  cats.forEach((cat,ci)=>{
    const groupW=bw*n+GAP*(n-1);
    const x0=PL+band*ci+(band-groupW)/2;
    series.forEach((s,si)=>{
      const v=s.v[ci]||0;
      const bh=v==null?0:Math.max(3,plotH*(Math.max(0,v)/max));
      const x=x0+si*(bw+GAP), y=PT+plotH-bh;
      const col=statusOf?statusOf(v,ci,si):s.c;
      // 4px rounded data-end, square at baseline
      const r=Math.min(4,bh);
      const p=sv("path",{
        d:`M${x},${PT+plotH} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+bw-r},${y} Q${x+bw},${y} ${x+bw},${y+r} L${x+bw},${PT+plotH} Z`,
        fill:col});
      p.setAttribute("tabindex","0");
      hoverable(p,()=>`<div class="hd">${cat}</div>`+series.map((ss,k)=>
        `<div class="r"><i><b style="background:${statusOf?statusOf(ss.v[ci],ci,k):ss.c}"></b>${ss.k}</i><span class="v">${fmtV(ss.v[ci]||0)}</span></div>`).join(""));
      svg.appendChild(p);
      /* label the cap when it fits, and ALWAYS label a zero — "this room
         delivered nothing" is the finding, and it must not be the one bar
         on the chart without a number on it */
      if(n<=2&&ci%labelEvery===0&&(bh>14||v===0)){
        const t=sv("text",{x:x+bw/2,y:(v===0?PT+plotH-6:y-5),class:"dl","text-anchor":"middle"});
        t.textContent=fmtV(v);svg.appendChild(t);
      }
    });
    /* a name too wide for its band drops to a second line rather than
       colliding with its neighbour */
    const cx=PL+band*ci+band/2;
    const maxCh=Math.floor(band/6.1);
    let l1=cat,l2=opts.cats2?opts.cats2[ci]:null;
    if(cat.length>maxCh&&cat.includes(" ")&&!l2){
      const words=cat.split(" ");let a="",b="";
      words.forEach(w=>{ if((a+" "+w).trim().length<=maxCh&&!b) a=(a+" "+w).trim(); else b=(b+" "+w).trim(); });
      l1=a;l2=b;
    }
    const lab=sv("text",{x:cx,y:h-PB+16,class:"ax","text-anchor":"middle"});
    lab.textContent=l1;svg.appendChild(lab);
    if(l2){
      const t2=sv("text",{x:cx,y:h-PB+28,class:"ax","text-anchor":"middle"});
      t2.textContent=l2;t2.setAttribute("opacity",".85");svg.appendChild(t2);
    }
  });
  return svg;
}

/* --- horizontal bars (good for long category names) --- */
/* draw the flag threshold as a hairline so a 46%-amber next to a 44%-red
   reads as a rule being applied rather than an arbitrary call */
function bars(opts){
  const {cats,v,c=SER[0],fmtV=x=>fmt(x),max,statusOf=null,minH=196}=opts;
  if(!cats||!cats.length) return emptyViz(opts.emptyNote);
  const W=opts.W||760,PL=Math.min(210,Math.max(...cats.map(s=>String(s).length),4)*6.6+12),PR=54;
  /* grow the row pitch so a 2-row chart still fills the cell it shares with a
     taller neighbour — the dead space was the biggest "unfinished" tell */
  /* pitch is capped: a short chart that top-aligns in a tall cell reads better
     than one stretched until the bars are lost in white space */
  const rowH=Math.max(opts.rowH||26,Math.min(56,(minH-10)/Math.max(1,cats.length)));
  const lane=opts.threshold!=null?16:0;      // clear lane for the threshold label
  const h=cats.length*rowH+10+lane;
  const mx=max||niceMax(Math.max(...v.filter(x=>x!=null),0)*1.04);
  const plotW=W-PL-PR;
  const svg=sv("svg",{class:"viz",viewBox:`0 0 ${W} ${h}`,role:"img"});
  svg.appendChild(sv("line",{x1:PL,x2:PL,y1:2+lane,y2:h-8,class:"base-l"}));
  cats.forEach((cat,i)=>{
    const y=i*rowH+4+lane, bh=Math.min(18,rowH-9);
    /* a defined value always gets a visible stub — a bare number beside an
       empty track reads as a broken chart, and "0 students" is the finding */
    const val=v[i];
    const bwid=val==null?0:Math.max(3,plotW*(Math.max(0,val)/mx));
    const col=val==null?CSSV("--hair"):(val<0?CSSV("--q3"):(statusOf?statusOf(val,i):c));
    const r=Math.min(4,bwid);
    svg.appendChild(sv("path",{
      d:`M${PL},${y} L${PL+bwid-r},${y} Q${PL+bwid},${y} ${PL+bwid},${y+r} L${PL+bwid},${y+bh-r} Q${PL+bwid},${y+bh} ${PL+bwid-r},${y+bh} L${PL},${y+bh} Z`,
      fill:col}));
    const lc=sv("text",{x:PL-9,y:y+bh/2+3.6,class:"ax","text-anchor":"end"});
    lc.textContent=cat;svg.appendChild(lc);
    const vt=sv("text",{x:PL+bwid+7,y:y+bh/2+3.8,class:"dl"});
    vt.textContent=fmtV(v[i]);svg.appendChild(vt);
    const hit=sv("rect",{x:PL,y:y-3,width:plotW,height:bh+6,fill:"transparent",tabindex:"0"});
    hoverable(hit,`<div class="hd">${cat}</div><div class="r"><i>${opts.vlabel||"Value"}</i><span class="v">${fmtV(v[i])}</span></div>`);
    svg.appendChild(hit);
  });
  /* drawn last so a bar can never paint over the rule or its label */
  if(opts.threshold!=null&&mx>0){
    const tx=PL+plotW*clamp(opts.threshold/mx,0,1);
    svg.appendChild(sv("line",{x1:tx,x2:tx,y1:lane,y2:h-8,stroke:CSSV("--rule"),
      "stroke-width":1,"stroke-dasharray":"3 3"}));
    const near=tx>PL+plotW*0.82;
    const tl=sv("text",{x:tx+(near?-5:5),y:11,class:"ax",
      "text-anchor":near?"end":"start"});
    tl.textContent=(opts.thresholdLabel||"flag")+" "+fmtV(opts.threshold);
    svg.appendChild(tl);
  }
  return svg;
}


/* --- line / area with crosshair --- */
function lines(opts){
  const {xs,series,h=230,fmtV=v=>fmt(v,1),xTick=i=>xs[i],yMax,area=false,markers=true,xEvery,bands=[]}=opts;
  if(!xs||!xs.length||!series||!series.length) return emptyViz(opts.emptyNote);
  const W=opts.W||760,PL=44,PR=52,PT=16,PB=36;
  const plotW=W-PL-PR,plotH=h-PT-PB;
  const max=yMax||niceMax(Math.max(...series.flatMap(s=>s.v).filter(v=>v!=null),0)*1.04);
  const X=i=>PL+(xs.length<2?plotW/2:plotW*i/(xs.length-1));
  const Y=v=>PT+plotH-plotH*(v/max);
  const svg=sv("svg",{class:"viz",viewBox:`0 0 ${W} ${h}`,role:"img"});
  bands.forEach(b=>{
    svg.appendChild(sv("rect",{x:X(b.from),y:PT,width:Math.max(1,X(b.to)-X(b.from)),height:plotH,fill:b.fill||"#eef2f6"}));
    // band labels are left-anchored at the band start, so a nested band
    // (lunch inside the scheduled session) never collides with its parent
    if(b.label){const t=sv("text",{x:X(b.from)+4,y:PT+11,class:"ax","text-anchor":"start"});t.textContent=b.label;svg.appendChild(t);}
  });
  for(let i=0;i<=4;i++){
    const y=PT+plotH-plotH*i/4;
    svg.appendChild(sv("line",{x1:PL,x2:W-PR,y1:y,y2:y,class:i?"grid-l":"base-l"}));
    const t=sv("text",{x:PL-8,y:y+3.5,class:"ax","text-anchor":"end"});
    t.textContent=fmt(max*i/4,Number.isInteger(max/4)?0:1);svg.appendChild(t);
  }
  const step=xEvery||Math.max(1,Math.round(xs.length/8));
  xs.forEach((x,i)=>{if(i%step&&i!==xs.length-1)return;
    const anch=i===0?"start":(i===xs.length-1?"end":"middle");
    const t=sv("text",{x:X(i),y:h-PB+15,class:"ax","text-anchor":anch});
    t.textContent=xTick(i);svg.appendChild(t);});
  const endLabels=[];
  series.forEach(s=>{
    /* a null is missing data, not zero. Break the path there and hatch the
       stretch instead — drawing through a gap would claim the room was
       verifiably empty when the export simply has no row. */
    const runs=[];let cur=null;
    s.v.forEach((v,i)=>{
      if(v==null){ if(cur){runs.push(cur);cur=null;} return; }
      if(!cur){cur={from:i,pts:[]};}
      cur.pts.push([X(i),Y(v)]);cur.to=i;
    });
    if(cur) runs.push(cur);
    if(area) runs.forEach(r=>{
      if(r.pts.length<2) return;
      let d=`M${r.pts[0][0]},${Y(0)}`;
      r.pts.forEach(p=>d+=` L${p[0]},${p[1]}`);
      d+=` L${r.pts[r.pts.length-1][0]},${Y(0)} Z`;
      svg.appendChild(sv("path",{d,fill:s.c,opacity:".10"}));
    });
    runs.forEach(r=>{
      if(r.pts.length===1){
        svg.appendChild(sv("circle",{cx:r.pts[0][0],cy:r.pts[0][1],r:2.4,fill:s.c}));
        return;
      }
      let d="";r.pts.forEach((p,i)=>d+=(i?" L":"M")+p[0]+","+p[1]);
      svg.appendChild(sv("path",{d,fill:"none",stroke:s.c,"stroke-width":2,
        "stroke-linejoin":"round","stroke-linecap":"round"}));
    });
    if(markers&&xs.length<=14) s.v.forEach((v,i)=>{
      if(v==null) return;
      svg.appendChild(sv("circle",{cx:X(i),cy:Y(v),r:4.5,fill:s.c,stroke:SURFACE,"stroke-width":2}));
    });
    /* end label rides the last point that actually exists; collected first so
       converging series can be pushed apart instead of overplotting */
    let last=-1;for(let i=s.v.length-1;i>=0;i--){if(s.v[i]!=null){last=i;break;}}
    if(last>=0){
      /* if the series stops before the axis does, the space to its right is
         the hatch — put the label on the data side instead */
      const trails=last<s.v.length-1;
      endLabels.push({x:X(last)+(trails?-6:9),y:Y(s.v[last]),
        txt:fmtV(s.v[last]),anchor:trails?"end":"start"});
    }
  });
  /* greedy vertical de-collide: 11px minimum pitch, nudged downward */
  endLabels.sort((a,b)=>a.y-b.y);
  for(let i=1;i<endLabels.length;i++){
    if(endLabels[i].y-endLabels[i-1].y<11) endLabels[i].y=endLabels[i-1].y+11;
  }
  /* the push is downward, so clamp the whole stack back inside the plot */
  if(endLabels.length){
    const over=endLabels[endLabels.length-1].y-(PT+plotH);
    if(over>0) endLabels.forEach(L=>L.y-=over);
  }
  endLabels.forEach(L=>{
    const t=sv("text",{x:L.x,y:L.y+3.6,class:"dl","text-anchor":L.anchor||"start"});
    t.textContent=L.txt;svg.appendChild(t);
  });
  /* hatch the no-data stretches once, behind nothing, so they are unmissable */
  (function(){
    const anyNull=series.some(s=>s.v.some(v=>v==null));
    if(!anyNull) return;
    const miss=xs.map((_,i)=>series.every(s=>s.v[i]==null));
    let run=null;
    const put=(a,b)=>{
      const x0=X(a),x1=X(Math.min(b,xs.length-1));
      const r=sv("rect",{x:x0,y:PT,width:Math.max(4,x1-x0),height:plotH,
        fill:"url(#nodata)",opacity:".9"});
      r.setAttribute("tabindex","0");
      hoverable(r,`<div class="hd">No feed</div>${xTick(a)} – ${xTick(Math.min(b,xs.length-1))}<br>The export has no row here. Not the same as an empty room.`);
      svg.appendChild(r);
    };
    for(let i=0;i<=xs.length;i++){
      const m=i<xs.length&&miss[i];
      if(m&&run===null) run=i;
      if(!m&&run!==null){put(run,i);run=null;}
    }
    const defs=sv("defs",{});
    const pat=sv("pattern",{id:"nodata",width:6,height:6,patternUnits:"userSpaceOnUse",
      patternTransform:"rotate(45)"});
    pat.appendChild(sv("rect",{width:6,height:6,fill:CSSV("--surface-2")}));
    pat.appendChild(sv("rect",{width:2,height:6,fill:CSSV("--hair")}));
    defs.appendChild(pat);svg.insertBefore(defs,svg.firstChild);
  })();
  // crosshair layer
  const cross=sv("line",{x1:0,x2:0,y1:PT,y2:PT+plotH,stroke:CSSV("--rule"),"stroke-width":1,opacity:"0"});
  svg.appendChild(cross);
  const hit=sv("rect",{x:PL,y:PT,width:plotW,height:plotH,fill:"transparent"});
  hit.addEventListener("mousemove",e=>{
    const bb=svg.getBoundingClientRect();
    const rel=(e.clientX-bb.left)/bb.width*W;
    let i=Math.round((rel-PL)/plotW*(xs.length-1));i=clamp(i,0,xs.length-1);
    cross.setAttribute("x1",X(i));cross.setAttribute("x2",X(i));cross.setAttribute("opacity","1");
    showTip(e,`<div class="hd">${xs[i]}</div>`+series.map(s=>
      `<div class="r"><i><b style="background:${s.c}"></b>${s.k}</i><span class="v">${s.v[i]==null?"no feed":fmtV(s.v[i])}</span></div>`).join(""));
  });
  hit.addEventListener("mouseleave",()=>{cross.setAttribute("opacity","0");hideTip();});
  svg.appendChild(hit);
  return svg;
}


function heat(o){
  const {rows,cols,val,fmtV=v=>fmt(v),rowLab,colLab,unit="",colorOf}=o;
  if(!rows||!rows.length||!cols||!cols.length) return emptyViz(o.emptyNote);
  const flat=val.flat().filter(v=>v!=null);
  const mx=Math.max(...flat)||1,mn=Math.min(...flat);
  const box=el("div",{class:"hmbox"});
  const g=el("div",{class:"hm",style:`grid-template-columns:auto repeat(${cols.length},minmax(0,1fr))`});
  g.appendChild(el("div"));
  cols.forEach(c=>g.appendChild(el("div",{class:"hm-cl",text:c})));
  rows.forEach((r,ri)=>{
    g.appendChild(el("div",{class:"hm-rl",text:rowLab?rowLab(r):r}));
    cols.forEach((c,ci)=>{
      const v=val[ri][ci];
      if(v==null){
        const n=el("div",{class:"hm-c",style:"background:repeating-linear-gradient(45deg,#f2f4f7 0 5px,#e8ecf1 5px 10px);color:var(--muted)",text:"—"});
        hoverable(n,`<div class="hd">${rowLab?rowLab(r):r} · ${c}</div>${o.nullNote||"No reading"}`);
        g.appendChild(n);return;
      }
      const t=(v-mn)/((mx-mn)||1);
      const idx=clamp(Math.floor(t*SEQ.length),0,SEQ.length-1);
      const bg=colorOf?colorOf(v,ri):SEQ[idx];
      const ink=colorOf?"#fff":(idx>=4?"#fff":CSSV("--ink"));
      const n=el("div",{class:"hm-c",style:`background:${bg};color:${ink}`,tabindex:"0",text:fmtV(v)});
      hoverable(n,`<div class="hd">${rowLab?rowLab(r):r} · ${c}</div><div class="r"><i>${o.vlabel||"Value"}</i><span class="v">${fmtV(v)}${unit}</span></div>`);
      g.appendChild(n);
    });
  });
  box.appendChild(g);
  const sc=colorOf
    ? el("div",{class:"hm-scale"},[
        el("span",{text:"under"}),
        el("span",{class:"sw"},RYG.map((c,i)=>
          el("i",{class:i===3?"ref":null,style:"background:"+c}))),
        el("span",{text:"above"}),
        o.refLabel?el("em",{text:o.refLabel}):null
      ].filter(Boolean))
    : el("div",{class:"hm-scale"},[
        el("span",{text:fmtV(mn)+unit}),
        el("span",{class:"sw"},SEQ.map(c=>el("i",{style:"background:"+c}))),
        el("span",{text:fmtV(mx)+unit})
      ]);
  box.appendChild(sc);
  return box;
}

/* --- presence strip --- */
function presenceStrip(bits,t0,step,legend){
  /* three states, and they must stay three: 1 detected, 0 not detected while a
     cohort WAS in the room, -1 no cohort so the question does not apply.
     Collapsing -1 into 0 turns an empty room into 12 hours of teacher absence. */
  const box=el("div",{class:"pfill"});
  const st=el("div",{class:"strip"});
  const COL={1:ST.good,0:ST.critical,"-1":CSSV("--hair")};
  const TXT={1:"Instructor detected",0:"Cohort present, no instructor detected","-1":"No cohort in the room — not applicable"};
  bits.forEach((b,i)=>{
    const key=b===1?1:b===0?0:"-1";
    const n=el("i",{style:"background:"+COL[key],tabindex:"0"});
    if(key==="-1") n.style.opacity=".55";
    hoverable(n,`<div class="hd">${hm(t0+i*step)} – ${hm(t0+(i+1)*step)}</div>${TXT[key]}`);
    st.appendChild(n);
  });
  box.appendChild(st);
  box.appendChild(el("div",{class:"strip-ax"},[
    el("span",{text:hm(t0)}),el("span",{text:hm(t0+bits.length*step)})
  ]));
  if(legend!==false){
    box.appendChild(el("div",{class:"legend",style:"margin-top:8px"},[
      el("i",{},[el("b",{style:"background:"+ST.good}),document.createTextNode("Instructor detected")]),
      el("i",{},[el("b",{style:"background:"+ST.critical}),document.createTextNode("Cohort present, none detected")]),
      el("i",{},[el("b",{style:"background:"+CSSV("--hair")+";opacity:.55"}),document.createTextNode("No cohort — not applicable")])
    ]));
  }
  return box;
}

/* ================================================================
   8 · CAMERA ENGINE — the differentiator
   A synthetic CCTV scene: perspective room, tracked persons with
   corner-bracket boxes + re-ID labels, an instructor motion trail,
   and a board-area fence with dwell. Everything drawn here is
   fabricated — it stands in for detector output, it is not one.
   ================================================================ */
const REDUCED=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* ---------------------------------------------------------------
   ROOM CLASSES
   A welding bay is not a lecture room and a computer lab is not either.
   Each class lays its stations out on the floor once; the plate draws the
   furniture on those coordinates and the scene seats people on the same
   ones, so "is the equipment being used" is answerable from the frame.
   --------------------------------------------------------------- */
const STATION_GRID={
  "computer-lab" :{cols:5,y0:0.34,y1:0.88,w:0.78},
  "welding-lab"  :{cols:4,y0:0.42,y1:0.86,w:0.80},
  "practical-lab":{cols:4,y0:0.36,y1:0.87,w:0.80},
  "retail-lab"   :{cols:4,y0:0.40,y1:0.84,w:0.76},
  "assessment"   :{cols:4,y0:0.40,y1:0.88,w:0.46,cx:0.68}
};
const ROOM_NOUN={"computer-lab":"workstation","welding-lab":"welding booth",
  "practical-lab":"work bench","retail-lab":"practice bay",
  "assessment":"assessment desk"};
function stationLayout(sp){
  const g=STATION_GRID[sp.type];
  if(!g||!sp.stations) return [];
  const n=sp.stations, cols=g.cols, rows=Math.ceil(n/cols), out=[];
  for(let i=0;i<n;i++){
    const r=Math.floor(i/cols), c=i%cols, inRow=Math.min(cols,n-r*cols);
    const cx=g.cx==null?0.5:g.cx;
    out.push({
      x:inRow<=1?cx:(cx-g.w/2)+g.w*(c/(inRow-1)),
      y:rows<=1?(g.y0+g.y1)/2:g.y0+(g.y1-g.y0)*(r/(rows-1)),
      i:i, busy:0
    });
  }
  return out;
}

// project floor coords (x:0..1 across, y:0..1 far\u2192near) into canvas space
function proj(x,y,W,H){
  const horizon=H*0.16;
  const d=Math.pow(y,1.35);                      // depth easing
  const scale=lerp(0.42,1.0,d);
  const cy=horizon+(H*0.99-horizon)*d;
  const cx=W/2+(x-0.5)*W*0.94*lerp(0.62,1.02,d);
  return {x:cx,y:cy,s:scale};
}

/* ================================================================
   8 · THE VISION PANEL
   Built as a video-management console rather than as a fake video.
   What makes it read as a real product is the console around the
   frame — a scrubbable timeline cut from the actual export, event
   markers at real timestamps, per-camera status — not a rendered
   room pretending to be photographic.

   The scrubber is the important part: dragging it moves every
   camera to that minute of 08 Aug 2026 and the number of people in
   frame changes to the count the export actually recorded. Nothing
   about the occupancy is invented.

   OPTIONAL — drop in real footage:
   set VIDEO_SRC to a path or data: URI and the frame plays that
   instead, with every overlay composited on top unchanged. Use
   footage the centre owns or has cleared; a monitoring demo built
   on somebody else's classroom recording is a liability.
   ================================================================ */
const VIDEO_SRC = null;
let VIDEO_EL = null;
if(VIDEO_SRC){
  VIDEO_EL=document.createElement("video");
  Object.assign(VIDEO_EL,{src:VIDEO_SRC,muted:true,loop:true,playsInline:true,autoplay:true});
  VIDEO_EL.play().catch(()=>{VIDEO_EL=null;});
}

/* real occupancy for a camera at a given minute, or null if the export
   has no row there — "unknown" and "empty" must never be the same thing */
function occAt(camId,date,minute){
  const s=SER10[camId]&&SER10[camId][date]; if(!s) return null;
  const i=clamp(sl(minute),0,SLOTS-1);
  return s[i]<0?null:s[i]/10;
}

/* ---------------- the room plate (static, drawn once) ---------------- */
function buildRoomPlate(sc,W,H){
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const g=cv.getContext("2d");
  const sp=sc.sp, horizon=H*0.17, T=sp.type;
  const circ=sc.circ, rr=rng(hashStr(sp.id+"b"));

  /* flat, quiet room. A camera sees a dim box, not a lit stage. */
  const air=g.createLinearGradient(0,0,0,H);
  air.addColorStop(0,"#0b131c");air.addColorStop(.5,"#0d1721");air.addColorStop(1,"#070d14");
  g.fillStyle=air;g.fillRect(0,0,W,H);
  g.fillStyle="#111e2a";g.fillRect(0,0,W,horizon);
  g.fillStyle="rgba(120,160,200,.10)";g.fillRect(0,horizon-1,W,1);

  /* ---- back wall furniture, one lockup per room class ---- */
  const wallRack=(x0,wid,bars,col)=>{
    const bx=W*x0,bw=W*wid,by=horizon*0.20,bh=horizon*0.56;
    g.fillStyle="#16242f";g.fillRect(bx,by,bw,bh);
    g.strokeStyle="rgba(130,175,215,.22)";g.lineWidth=1;g.strokeRect(bx+.5,by+.5,bw,bh);
    g.fillStyle=col;
    for(let i=0;i<bars;i++){
      const tw=bw*(0.06+0.09*rr()), tx=bx+bw*(0.06+0.88*(i/(bars-1||1)))-tw/2;
      g.fillRect(tx,by+bh*0.16,tw,bh*(0.42+0.36*rr()));
    }
  };
  if(!circ){
    if(T==="welding-lab"){
      /* extraction hoods + a gas cylinder bank read as a welding shop at a glance */
      wallRack(0.06,0.26,6,"rgba(214,150,80,.34)");        // electrode / rod rack
      const cy=horizon*0.30,ch=horizon*0.62;
      for(let i=0;i<4;i++){
        const cx0=W*(0.72+i*0.055);
        g.fillStyle="rgba(70,96,120,.85)";g.fillRect(cx0,cy,W*0.028,ch);
        g.fillStyle="rgba(160,80,60,.75)";g.fillRect(cx0,cy,W*0.028,ch*0.14);
      }
      g.fillStyle="rgba(150,190,220,.14)";
      g.fillRect(W*0.36,horizon*0.16,W*0.30,horizon*0.22);  // extraction duct
    } else if(T==="computer-lab"){
      const bw=W*0.30,bh=horizon*0.48,bx=W*0.35,by=horizon*0.26;
      g.fillStyle="#18293a";g.fillRect(bx,by,bw,bh);        // projection screen
      g.strokeStyle="rgba(130,175,215,.22)";g.lineWidth=1;g.strokeRect(bx+.5,by+.5,bw,bh);
      g.fillStyle="rgba(140,190,235,.13)";g.fillRect(bx+2,by+2,bw-4,bh-4);
      g.fillStyle="rgba(90,130,175,.30)";                    // server / switch cabinet
      g.fillRect(W*0.80,horizon*0.22,W*0.07,horizon*0.66);
    } else if(T==="practical-lab"){
      wallRack(0.05,0.30,7,"rgba(150,190,220,.30)");         // tool board
      g.fillStyle="rgba(90,130,175,.26)";
      g.fillRect(W*0.70,horizon*0.26,W*0.16,horizon*0.58);   // component cabinet
    } else if(T==="retail-lab"){
      for(let r0=0;r0<3;r0++){                               // shelving
        g.fillStyle="rgba(90,130,175,.20)";
        g.fillRect(W*0.62,horizon*(0.24+r0*0.20),W*0.30,horizon*0.055);
      }
    } else if(T==="assessment"){
      const bw=W*0.26,bh=horizon*0.42,bx=W*0.37,by=horizon*0.28;
      g.fillStyle="#18293a";g.fillRect(bx,by,bw,bh);
      g.strokeStyle="rgba(130,175,215,.20)";g.lineWidth=1;g.strokeRect(bx+.5,by+.5,bw,bh);
      g.fillStyle="rgba(150,190,220,.18)";
      g.fillRect(bx+bw*0.1,by+bh*0.28,bw*0.55,1.4);
      g.fillRect(bx+bw*0.1,by+bh*0.52,bw*0.72,1.4);
    } else {
      const bw=W*0.34,bh=horizon*0.5,bx=W*0.33,by=horizon*0.24;
      g.fillStyle="#18293a";g.fillRect(bx,by,bw,bh);
      g.strokeStyle="rgba(130,175,215,.20)";g.lineWidth=1;g.strokeRect(bx+.5,by+.5,bw,bh);
      g.fillStyle="rgba(150,190,220,.16)";
      for(let i=0;i<4;i++) g.fillRect(bx+bw*0.08,by+bh*(0.22+i*0.18),bw*(0.2+0.45*rr()),1.2);
    }
  }

  /* floor: convergence lines only. A checkerboard reads as an
     architectural render, which is the opposite of what we want. */
  g.strokeStyle="rgba(90,130,175,.10)";g.lineWidth=1;
  for(let i=0;i<=8;i++){const a=proj(i/8,0.02,W,H),b=proj(i/8,1,W,H);
    g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();}
  for(let j=1;j<=5;j++){const y=j/5;const a=proj(0,y,W,H),b=proj(1,y,W,H);
    g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();}
  const p=proj(0.5,0.5,W,H);
  const lp=g.createRadialGradient(p.x,p.y,0,p.x,p.y,W*0.5);
  lp.addColorStop(0,"rgba(170,205,240,.055)");lp.addColorStop(1,"rgba(170,205,240,0)");
  g.fillStyle=lp;g.fillRect(0,horizon,W,H-horizon);

  /* ---- station furniture, drawn on the same floor coordinates the
     people are seated on ---- */
  const ST=sc.stations||[];
  if(ST.length){
    /* far rows first so near furniture overlaps correctly */
    ST.slice().sort((a,b)=>a.y-b.y).forEach(st=>{
      const q=proj(st.x,st.y,W,H), k=q.s;
      const shade=(x,y,w,h)=>{
        const sh=g.createLinearGradient(0,y+h,0,y+h+h*0.9);
        sh.addColorStop(0,"rgba(0,0,0,.42)");sh.addColorStop(1,"rgba(0,0,0,0)");
        g.fillStyle=sh;g.fillRect(x-3,y+h,w+6,h*0.8);
      };
      if(T==="computer-lab"){
        const dw=34*k,dh=11*k;
        shade(q.x-dw/2,q.y-dh*0.2,dw,dh);
        g.fillStyle="rgba(26,44,62,.96)";g.fillRect(q.x-dw/2,q.y-dh*0.2,dw,dh);
        g.fillStyle="rgba(58,88,118,.92)";g.fillRect(q.x-dw/2,q.y-dh*0.55,dw,dh*0.35);
        const mw=17*k,mh=12*k;                       // monitor
        g.fillStyle="rgba(10,20,30,.97)";g.fillRect(q.x-mw/2,q.y-dh*0.55-mh,mw,mh);
        g.fillStyle="rgba(96,170,232,.26)";g.fillRect(q.x-mw/2+1.2,q.y-dh*0.55-mh+1.2,mw-2.4,mh-2.4);
        g.fillStyle="rgba(40,64,88,.9)";             // tower
        g.fillRect(q.x+mw*0.62,q.y-dh*0.55-mh*0.62,5*k,mh*0.62);
      } else if(T==="welding-lab"){
        const bw=30*k,bh=13*k;
        g.fillStyle="rgba(18,30,42,.9)";             // curtain screen behind the booth
        g.fillRect(q.x-bw*0.62,q.y-bh*3.1,bw*1.24,bh*2.5);
        g.fillStyle="rgba(120,64,40,.30)";
        g.fillRect(q.x-bw*0.62,q.y-bh*3.1,bw*1.24,bh*0.22);
        shade(q.x-bw/2,q.y-bh*0.2,bw,bh);
        g.fillStyle="rgba(30,38,46,.97)";g.fillRect(q.x-bw/2,q.y-bh*0.2,bw,bh);
        g.fillStyle="rgba(74,86,98,.95)";g.fillRect(q.x-bw/2,q.y-bh*0.55,bw,bh*0.35);
        g.fillStyle="rgba(150,110,70,.55)";          // workpiece
        g.fillRect(q.x-7*k,q.y-bh*0.55-3.4*k,14*k,3.4*k);
      } else if(T==="practical-lab"){
        const bw=32*k,bh=12*k;
        shade(q.x-bw/2,q.y-bh*0.2,bw,bh);
        g.fillStyle="rgba(26,44,62,.96)";g.fillRect(q.x-bw/2,q.y-bh*0.2,bw,bh);
        g.fillStyle="rgba(58,88,118,.92)";g.fillRect(q.x-bw/2,q.y-bh*0.55,bw,bh*0.35);
        g.fillStyle="rgba(120,150,180,.55)";         // bench vice
        g.fillRect(q.x-4.4*k,q.y-bh*0.55-6*k,8.8*k,6*k);
        g.fillStyle="rgba(150,190,220,.30)";
        g.fillRect(q.x+bw*0.22,q.y-bh*0.55-3*k,7*k,3*k);
      } else if(T==="retail-lab"){
        const bw=30*k,bh=14*k;
        shade(q.x-bw/2,q.y-bh*0.2,bw,bh);
        g.fillStyle="rgba(26,44,62,.94)";g.fillRect(q.x-bw/2,q.y-bh*0.2,bw,bh);
        g.fillStyle="rgba(96,128,160,.8)";g.fillRect(q.x-bw/2,q.y-bh*0.62,bw,bh*0.42);
      } else if(T==="assessment"){
        const dw=26*k,dh=10*k;
        shade(q.x-dw/2,q.y-dh*0.2,dw,dh);
        g.fillStyle="rgba(26,44,62,.96)";g.fillRect(q.x-dw/2,q.y-dh*0.2,dw,dh);
        g.fillStyle="rgba(58,88,118,.92)";g.fillRect(q.x-dw/2,q.y-dh*0.55,dw,dh*0.35);
        g.fillStyle="rgba(190,215,238,.30)";         // answer sheet
        g.fillRect(q.x-6*k,q.y-dh*0.55-1.6*k,12*k,1.6*k);
      }
    });
  } else if(!circ){
    /* theory rooms keep plain benches */
    for(let r=0;r<sc.rowN;r++){
      const y=0.32+r*(0.58/Math.max(1,sc.rowN));
      const L=proj(0.10,y,W,H), R2=proj(0.90,y,W,H);
      const th=Math.max(5,13*L.s);
      const sh=g.createLinearGradient(0,L.y+th,0,L.y+th*2.4);
      sh.addColorStop(0,"rgba(0,0,0,.4)");sh.addColorStop(1,"rgba(0,0,0,0)");
      g.fillStyle=sh;g.fillRect(L.x-6,L.y+th,(R2.x-L.x)+12,th*1.4);
      g.fillStyle="rgba(26,44,62,.95)";g.fillRect(L.x,L.y+th*0.34,R2.x-L.x,th*0.66);
      g.fillStyle="rgba(58,88,118,.9)";g.fillRect(L.x,L.y,R2.x-L.x,th*0.34);
      g.fillStyle="rgba(120,160,200,.22)";g.fillRect(L.x,L.y,R2.x-L.x,1);
    }
  }

  /* the viva table sits apart from the desk grid — one candidate, one
     assessor, facing each other. It is what an assessment camera is for. */
  if(sc.viva){
    const q=proj(sc.viva.x,sc.viva.y,W,H), k=q.s, tw=40*k, th=13*k;
    const sh=g.createLinearGradient(0,q.y+th*0.8,0,q.y+th*2);
    sh.addColorStop(0,"rgba(0,0,0,.45)");sh.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=sh;g.fillRect(q.x-tw/2-4,q.y+th*0.8,tw+8,th*1.2);
    g.fillStyle="rgba(30,50,70,.97)";g.fillRect(q.x-tw/2,q.y-th*0.2,tw,th);
    g.fillStyle="rgba(70,104,138,.95)";g.fillRect(q.x-tw/2,q.y-th*0.58,tw,th*0.38);
    g.fillStyle="rgba(190,215,238,.34)";
    g.fillRect(q.x-tw*0.30,q.y-th*0.58-1.8*k,tw*0.26,1.8*k);
    g.fillRect(q.x+tw*0.06,q.y-th*0.58-1.8*k,tw*0.24,1.8*k);
  }
  return cv;
}

/* ---------------- frame render ---------------- */
function drawScene(ctx,sc,W,H,detail){
  ctx.clearRect(0,0,W,H);
  if(VIDEO_EL&&VIDEO_EL.readyState>=2){
    const vw=VIDEO_EL.videoWidth||16,vh=VIDEO_EL.videoHeight||9;
    const s=Math.max(W/vw,H/vh);
    ctx.drawImage(VIDEO_EL,(W-vw*s)/2,(H-vh*s)/2,vw*s,vh*s);
  }else{
    if(!sc.plate||sc.plateW!==W||sc.plateH!==H){
      sc.plate=buildRoomPlate(sc,W,H);sc.plateW=W;sc.plateH=H;}
    ctx.drawImage(sc.plate,0,0);
  }
  const horizon=H*0.17;
  const shown=sc.stu.slice(0,sc.visible);

  /* instruction-zone fence */
  const f=sc.fence, hot=sc.inst.inZone&&sc.hasInstr;
  const q1=proj(f.x0,0.03,W,H),q2=proj(f.x1,0.03,W,H),q3=proj(f.x1,f.y1,W,H),q4=proj(f.x0,f.y1,W,H);
  ctx.beginPath();ctx.moveTo(q1.x,q1.y);ctx.lineTo(q2.x,q2.y);ctx.lineTo(q3.x,q3.y);ctx.lineTo(q4.x,q4.y);ctx.closePath();
  ctx.fillStyle=hot?"rgba(42,120,214,.15)":"rgba(42,120,214,.05)";ctx.fill();
  ctx.strokeStyle=hot?"rgba(120,190,255,.9)":"rgba(80,130,180,.4)";
  ctx.lineWidth=hot?1.8:1;ctx.stroke();
  if(detail){
    /* pinned to the top edge of the quad, above the first row of ID labels */
    ctx.font="700 8.5px "+CSSV("--font");
    ctx.fillStyle=hot?"#9ccdff":"#5c86ab";
    ctx.fillText(sc.sp.type==="assessment"?"ZONE · ASSESSOR SUPERVISION AREA"
                                          :"ZONE · INSTRUCTION AREA",q1.x+5,q1.y-5);
  }

  /* ---- station status: the equipment answer, drawn under the people ---- */
  const ST=sc.stations||[];
  if(ST.length){
    const live=new Array(ST.length).fill(0);
    shown.forEach(s=>{if(s.st!=null) live[s.st]++;});
    sc.stBusy=live;
    ST.forEach((st,k)=>{
      const q=proj(st.x,st.y,W,H), kk=q.s, n=live[k];
      const w=30*kk, h=9*kk, x0=q.x-w/2, y0=q.y-h*0.55;
      const col=n===0?"rgba(150,170,190,.42)":n===1?"rgba(12,190,110,.85)":"rgba(255,168,64,.95)";
      ctx.strokeStyle=col;ctx.lineWidth=n>1?1.8:1.1;
      ctx.setLineDash(n===0?[3,3]:[]);
      ctx.strokeRect(x0,y0,w,h);
      ctx.setLineDash([]);
      if(n>1){ctx.fillStyle="rgba(255,168,64,.16)";ctx.fillRect(x0,y0,w,h);}
      if(detail&&kk>0.62){
        ctx.font="700 7.5px "+CSSV("--font");
        ctx.fillStyle=col;
        ctx.fillText(String(k+1).padStart(2,"0")+(n>1?" ×"+n:""),x0,y0-3);
      }
      /* an occupied welding booth throws light; an idle one does not */
      if(sc.sp.type==="welding-lab"&&n>0&&!REDUCED&&sc.playing){
        const f=Math.max(0,Math.sin(sc.t*9+k*2.1))*Math.max(0,Math.sin(sc.t*23+k));
        if(f>0.25){
          const gl=ctx.createRadialGradient(q.x,y0,0,q.x,y0,26*kk);
          gl.addColorStop(0,"rgba(190,225,255,"+(0.5*f).toFixed(3)+")");
          gl.addColorStop(1,"rgba(120,180,255,0)");
          ctx.fillStyle=gl;ctx.beginPath();ctx.arc(q.x,y0,26*kk,0,7);ctx.fill();
        }
      }
    });
  }

  /* cohort */
  shown.forEach(s=>{
    const sway=Math.sin(sc.t*0.8+s.ph)*0.7;
    const p=proj(s.bx,s.by,W,H), k=p.s;
    const bench=sc.circ?p.y:p.y+Math.max(5,13*k)*0.34;
    const torso=(s.stand?54:34)*k, headR=8.4*k, shoulder=22*k, waist=16*k;
    const cx=p.x+sway*k, ty=bench-torso-(s.stand?12*k:0);
    ctx.fillStyle="rgba(0,0,0,.3)";
    ctx.beginPath();ctx.ellipse(cx,bench+1.5*k,shoulder*0.6,2.6*k,0,0,7);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx-waist/2,bench);
    ctx.lineTo(cx-shoulder/2,ty+torso*0.24);
    ctx.quadraticCurveTo(cx-shoulder/2,ty,cx-shoulder*0.3,ty);
    ctx.lineTo(cx+shoulder*0.3,ty);
    ctx.quadraticCurveTo(cx+shoulder/2,ty,cx+shoulder/2,ty+torso*0.24);
    ctx.lineTo(cx+waist/2,bench);ctx.closePath();
    const bg=ctx.createLinearGradient(cx-shoulder/2,ty,cx+shoulder/2,bench);
    bg.addColorStop(0,"rgba(176,206,231,.5)");bg.addColorStop(1,"rgba(118,150,182,.36)");
    ctx.fillStyle=bg;ctx.fill();
    const hy=ty-headR*0.72;
    ctx.beginPath();ctx.ellipse(cx,hy,headR*0.84,headR,0,0,7);
    ctx.fillStyle="rgba(192,220,244,.6)";ctx.fill();
    const bx0=cx-shoulder/2-2.5*k, by0=hy-headR-2.5*k;
    const bw0=shoulder+5*k, bh0=(bench+(s.stand?12*k:0))-by0;
    const crowded=s.st!=null&&sc.stBusy&&sc.stBusy[s.st]>1;
    if(detail){
      drawBox(ctx,bx0,by0,bw0,bh0,
        crowded?"rgba(255,168,64,.95)":
        s.stand?"rgba(255,196,110,.92)":"rgba(126,204,255,.85)",1.2);
      if(!crowded){
        ctx.font="600 8.5px "+CSSV("--font");
        ctx.fillStyle=s.stand?"rgba(255,216,155,.95)":"rgba(196,229,255,.86)";
        ctx.fillText(`${s.id} ${s.conf.toFixed(2)}`,bx0,by0-4);
      }
    } else drawBox(ctx,bx0,by0,bw0,bh0,"rgba(126,204,255,.62)",1);
  });

  /* instructor */
  if(sc.hasInstr&&sc.visible>0){
    const T=sc.inst.trail;
    for(let i=1;i<T.length;i++){
      const pa=proj(T[i-1].x,T[i-1].y,W,H),pb=proj(T[i].x,T[i].y,W,H);
      const al=i/T.length;
      ctx.strokeStyle=`rgba(235,104,52,${(al*0.62).toFixed(3)})`;
      ctx.lineWidth=Math.max(1,2.6*al);ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();
    }
    const ip=proj(sc.inst.x,sc.inst.y,W,H),k=ip.s;
    const ih=74*k, shoulder=24*k, waist=18*k, headR=9*k, iy=ip.y-ih;
    ctx.fillStyle="rgba(0,0,0,.36)";
    ctx.beginPath();ctx.ellipse(ip.x,ip.y,shoulder*0.6,3*k,0,0,7);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(ip.x-waist/2,ip.y);
    ctx.lineTo(ip.x-shoulder/2,iy+ih*0.28);
    ctx.quadraticCurveTo(ip.x-shoulder/2,iy+ih*0.17,ip.x-shoulder*0.3,iy+ih*0.17);
    ctx.lineTo(ip.x+shoulder*0.3,iy+ih*0.17);
    ctx.quadraticCurveTo(ip.x+shoulder/2,iy+ih*0.17,ip.x+shoulder/2,iy+ih*0.28);
    ctx.lineTo(ip.x+waist/2,ip.y);ctx.closePath();
    const ig=ctx.createLinearGradient(ip.x-shoulder/2,iy,ip.x+shoulder/2,ip.y);
    ig.addColorStop(0,"rgba(242,150,100,.6)");ig.addColorStop(1,"rgba(198,96,52,.46)");
    ctx.fillStyle=ig;ctx.fill();
    const hy=iy+ih*0.17-headR*0.75;
    ctx.beginPath();ctx.ellipse(ip.x,hy,headR*0.84,headR,0,0,7);
    ctx.fillStyle="rgba(250,182,140,.66)";ctx.fill();
    drawBox(ctx,ip.x-shoulder/2-3,hy-headR-3,shoulder+6,ip.y-(hy-headR)+3,"#ff9a63",2);
    if(detail){
      ctx.font="700 9px "+CSSV("--font");
      const tag=`INSTRUCTOR ${sc.inst.conf.toFixed(2)}`;
      const tw=ctx.measureText(tag).width;
      ctx.fillStyle="rgba(176,56,12,.94)";
      ctx.fillRect(ip.x-shoulder/2-3,hy-headR-19,tw+8,13);
      ctx.fillStyle="#fff";ctx.fillText(tag,ip.x-shoulder/2+1,hy-headR-9);
    }
  }

  /* ---- viva pair: candidate and assessor, with the clock on them ---- */
  if(sc.viva&&sc.visible>0){
    const v=sc.viva, q=proj(v.x,v.y,W,H), k=q.s;
    const body=(cx,by,tone,ht)=>{
      const torso=ht*k, headR=8.6*k, shoulder=22*k, waist=16*k, ty=by-torso;
      ctx.fillStyle="rgba(0,0,0,.32)";
      ctx.beginPath();ctx.ellipse(cx,by+1.5*k,shoulder*0.6,2.6*k,0,0,7);ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx-waist/2,by);
      ctx.lineTo(cx-shoulder/2,ty+torso*0.24);
      ctx.quadraticCurveTo(cx-shoulder/2,ty,cx-shoulder*0.3,ty);
      ctx.lineTo(cx+shoulder*0.3,ty);
      ctx.quadraticCurveTo(cx+shoulder/2,ty,cx+shoulder/2,ty+torso*0.24);
      ctx.lineTo(cx+waist/2,by);ctx.closePath();
      ctx.fillStyle=tone[0];ctx.fill();
      ctx.beginPath();ctx.ellipse(cx,ty-headR*0.72,headR*0.84,headR,0,0,7);
      ctx.fillStyle=tone[1];ctx.fill();
      return {x0:cx-shoulder/2-3,y0:ty-headR*0.72-headR-3,w:shoulder+6,h:by-(ty-headR*1.72)+3};
    };
    const cand=body(q.x-24*k,q.y+2*k,["rgba(176,206,231,.55)","rgba(192,220,244,.62)"],40);
    const asr =body(q.x+24*k,q.y-2*k,["rgba(242,150,100,.58)","rgba(250,182,140,.66)"],44);
    drawBox(ctx,cand.x0,cand.y0,cand.w,cand.h,"rgba(126,204,255,.9)",1.4);
    drawBox(ctx,asr.x0,asr.y0,asr.w,asr.h,"#ff9a63",1.8);
    if(detail){
      ctx.font="700 8.5px "+CSSV("--font");
      ctx.fillStyle="rgba(196,229,255,.92)";
      ctx.fillText("CANDIDATE "+String(v.idx).padStart(2,"0"),cand.x0-2,cand.y0-16);
      ctx.fillStyle="rgba(255,190,150,.95)";
      ctx.fillText("ASSESSOR "+v.conf.toFixed(2),asr.x0-2,asr.y0-4);
      const mm=String(Math.floor(v.tSec/60)).padStart(2,"0")+":"+
               String(Math.floor(v.tSec%60)).padStart(2,"0");
      const tag="VIVA IN PROGRESS · "+mm+" · "+v.idx+" OF "+v.of;
      ctx.font="700 9px "+CSSV("--font");
      const tw=ctx.measureText(tag).width;
      ctx.fillStyle="rgba(24,60,110,.92)";
      ctx.fillRect(q.x-tw/2-6,q.y+16*k,tw+12,15);
      ctx.fillStyle="#dbeaff";ctx.fillText(tag,q.x-tw/2,q.y+16*k+11);
    }
  }

  /* ---- resource read-out: how many stations, how many in use ---- */
  if(detail&&ST.length){
    const live=sc.stBusy||[];
    const used=live.filter(n=>n>0).length, shared=live.filter(n=>n>1).length;
    const noun=ROOM_NOUN[sc.sp.type]||"station";
    const txt=used+" OF "+ST.length+" "+noun.toUpperCase()+"S IN USE"+
              (shared?"  ·  "+shared+" SHARED":"");
    ctx.font="700 9px "+CSSV("--font");
    const tw=ctx.measureText(txt).width;
    const y0=sc.viva?H-44:H-24;
    ctx.fillStyle="rgba(8,16,26,.74)";ctx.fillRect(10,y0,tw+14,16);
    ctx.fillStyle=shared?"#ffc46e":"#a8e6c4";ctx.fillText(txt,17,y0+11);
    if(shared&&sc.sp.type==="assessment"){
      const w2=live.reduce((a,n,i)=>n>a.n?{n,i}:a,{n:0,i:0});
      const flag="⚠ MALPRACTICE FLAG · "+w2.n+" CANDIDATES AT DESK "+
        String(w2.i+1).padStart(2,"0");
      const fw=ctx.measureText(flag).width;
      ctx.fillStyle="rgba(176,32,32,.92)";ctx.fillRect(10,H-22,fw+14,16);
      ctx.fillStyle="#fff";ctx.fillText(flag,17,H-11);
    }
  }

  /* empty-frame states — say WHY it is empty, don't just show nothing */
  if(detail&&sc.visible===0){
    ctx.font="700 10.5px "+CSSV("--font");
    const msg=sc.noData?"NO FEED AT THIS MINUTE — EXPORT HAS NO ROW":
              sc.circ?"NOBODY IN THIS SPACE AT THIS MINUTE":
              sc.ran?"BELOW BATCH THRESHOLD AT THIS MINUTE":
                     "NO COHORT RECORDED IN THIS ROOM ALL DAY";
    ctx.fillStyle=sc.noData?"rgba(160,180,200,.85)":"rgba(208,59,59,.92)";
    const w=ctx.measureText(msg).width;
    ctx.fillText(msg,(W-w)/2,H*0.54);
  }

  /* camera artefacts */
  if(detail&&!REDUCED&&sc.playing){
    const sy=(sc.t*0.05)%1, yy=horizon+(H-horizon)*sy;
    const g2=ctx.createLinearGradient(0,yy-16,0,yy+16);
    g2.addColorStop(0,"rgba(130,205,255,0)");g2.addColorStop(.5,"rgba(130,205,255,.07)");
    g2.addColorStop(1,"rgba(130,205,255,0)");
    ctx.fillStyle=g2;ctx.fillRect(0,yy-16,W,32);
  }
  const vg=ctx.createRadialGradient(W/2,H*0.46,Math.min(W,H)*0.24,W/2,H*0.5,Math.max(W,H)*0.74);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(.72,"rgba(0,0,0,.2)");vg.addColorStop(1,"rgba(0,0,0,.54)");
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(detail){
    if(!sc.noise||sc.noiseW!==W){
      const nc=document.createElement("canvas");nc.width=W;nc.height=H;
      const ng=nc.getContext("2d"),im=ng.createImageData(W,H),nr=rng(1234);
      for(let i=0;i<im.data.length;i+=4){const v=nr()*255|0;
        im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=11;}
      ng.putImageData(im,0,0);sc.noise=nc;sc.noiseW=W;}
    ctx.globalAlpha=.55;ctx.drawImage(sc.noise,0,0);ctx.globalAlpha=1;
    ctx.fillStyle="rgba(255,255,255,.01)";
    for(let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
  }
}

function drawBox(ctx,x,y,w,h,col,lw){
  const c=Math.min(w,h)*0.28;
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap="butt";
  ctx.beginPath();
  ctx.moveTo(x,y+c);ctx.lineTo(x,y);ctx.lineTo(x+c,y);
  ctx.moveTo(x+w-c,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+c);
  ctx.moveTo(x+w,y+h-c);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w-c,y+h);
  ctx.moveTo(x+c,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+h-c);
  ctx.stroke();
}

/* ---------------- scene construction ---------------- */
function makeScene(spaceId,seed,capOverride){
  const sp=SP[spaceId], c=courseOf(spaceId);
  const ch=MCH[spaceId]||{inter:.6,instr:.85};
  const r=rng(seed);
  const rec=D[S.date]&&D[S.date][spaceId];
  /* the pool is sized to the peak the export recorded, so the room can
     never show more people than the camera actually counted. capOverride is
     used only for a space that has NO camera — the assessment hall — and
     everything drawn from it is marked modelled, never measured. */
  const cap=capOverride!=null?capOverride:Math.max(0,Math.ceil(rec?rec.peak:0));
  /* a corridor is not a classroom: no benches, no rows, nobody seated.
     Drawing one as a lecture room invites exactly the question you do not
     want ("why is there a class in the corridor?"). */
  const circ=sp.role==="corridor"||sp.role==="open";
  const stations=circ?[]:stationLayout(sp);
  const rowN=circ?0:(cap<=2?1:(sp.type==="computer-lab"?5:sp.type==="outdoor"?3:4));
  const stu=[];let id=100;
  if(circ){
    for(let i=0;i<cap;i++)
      stu.push({id:id++,bx:0.12+r()*0.76,by:0.34+r()*0.54,
        ph:r()*Math.PI*2,conf:0.78+r()*0.16,stand:true,walk:true,
        vx:(r()-0.5)*0.04,vy:(r()-0.5)*0.02});
  } else if(stations.length){
    /* one learner per station until the stations run out. Sharing is not a
       drawing choice — it is the signal, and it has to be visible. */
    const share=sp.type==="assessment"?5:1;         // the crowded-desk case
    const order=[];
    for(let i=0;i<cap;i++){
      let k=i<stations.length?i:(i-stations.length)%stations.length;
      if(sp.type==="assessment"&&i<share&&stations.length>5) k=5;
      else if(sp.type==="assessment"&&i>=share) k=(i-share)%stations.length;
      order.push(k);
    }
    order.forEach(k=>{
      const st=stations[k], seat=st.busy++;
      const off=seat===0?0:((seat%2?1:-1)*0.020*Math.ceil(seat/2));
      stu.push({id:id++,st:k,bx:clamp(st.x+off,0.04,0.96),
        by:st.y-0.012+(seat?0.010*(seat%2):0),
        ph:r()*Math.PI*2,conf:0.86+r()*0.12,stand:false});
    });
  } else {
    const per=[];let rem=cap;
    for(let k=0;k<rowN;k++){const n=Math.round(rem/(rowN-k));per.push(n);rem-=n;}
    per.forEach((cnt,row)=>{
      for(let col=0;col<cnt;col++){
        const spread=cnt<=1?0.5:0.14+0.72*(col/(cnt-1));
        stu.push({id:id++,bx:spread+(r()-0.5)*0.03,
          by:0.32+row*(0.58/rowN)+(r()-0.5)*0.012,
          ph:r()*Math.PI*2,conf:0.86+r()*0.12,stand:false});
      }
    });
  }
  return {sp,course:c,ch,stu,rowN,cap,circ,stations,
    /* an assessment room runs a viva alongside the desks: one candidate,
       one assessor, and a clock on the pair */
    viva:sp.type==="assessment"?{x:0.155,y:0.66,tSec:0,idx:1,
      of:Math.max(1,cap),conf:0.94}:null,
    visible:cap, noData:false, ran:!!(rec&&rec.running),
    /* an instructor is only tracked in a classroom that actually held a cohort */
    hasInstr:!!(rec&&rec.running&&!circ), playing:true,
    inst:{x:0.5,y:0.13,tx:0.5,ty:0.13,trail:[],conf:0.93+r()*0.06,inZone:false,dwell:0},
    r,t:r()*100,fence:{x0:0.07,x1:0.93,y0:0.02,y1:0.24},events:[],lastEvt:-99};
}

function stepScene(sc,dt){
  sc.t+=dt;
  if(sc.viva&&sc.visible>0){
    sc.viva.tSec+=dt*12;                    /* demo clock, 12x wall time */
    if(sc.viva.tSec>=8*60){                 /* 8-minute viva slot */
      sc.viva.tSec=0;
      sc.viva.idx=sc.viva.idx>=sc.viva.of?1:sc.viva.idx+1;
      pushEvt(sc,"Viva concluded · candidate "+sc.viva.idx+" called");
    }
  }
  if(sc.circ){                       // circulation: people drift, nobody teaches
    sc.stu.forEach(s=>{
      s.bx+=s.vx*dt; s.by+=s.vy*dt;
      if(s.bx<0.08||s.bx>0.9) s.vx*=-1;
      if(s.by<0.3||s.by>0.9) s.vy*=-1;
    });
    return;
  }
  if(!sc.hasInstr||sc.visible===0) return;
  const I=sc.inst;
  if(Math.hypot(I.tx-I.x,I.ty-I.y)<0.02){
    const board=sc.r()<(sc.ch.inter||0.6);
    I.tx=board?0.2+sc.r()*0.6:0.12+sc.r()*0.76;
    I.ty=board?0.05+sc.r()*0.14:0.3+sc.r()*0.45;
  }
  I.x+=(I.tx-I.x)*0.17*dt*3.2; I.y+=(I.ty-I.y)*0.17*dt*3.2;
  I.trail.push({x:I.x,y:I.y}); if(I.trail.length>70) I.trail.shift();
  const f=sc.fence, inZ=I.x>f.x0&&I.x<f.x1&&I.y<f.y1;
  if(inZ) I.dwell+=dt;
  if(inZ!==I.inZone){pushEvt(sc,inZ?"Instructor entered instruction zone":"Instructor left instruction zone");I.inZone=inZ;}
  if(sc.r()<0.005*dt*60){
    const s=sc.stu[Math.floor(sc.r()*Math.max(1,sc.visible))];
    if(s){s.stand=!s.stand; if(s.stand) pushEvt(sc,`Movement · ID ${s.id} stood up`);}
  }
}
function pushEvt(sc,txt){
  if(sc.t-sc.lastEvt<0.8) return;
  sc.lastEvt=sc.t;
  sc.events.unshift({m:sc.clockMin||0,txt});
  if(sc.events.length>24) sc.events.pop();
}

let camLoop=null;   // the single rAF handle, cancelled on every page change

/* ================================================================
   CAMERA SIGNALS
   A KPI opens the camera it was measured from, and the camera answers
   THAT question at the minute the playhead sits on — so a reviewer can
   scrub and watch the figure move. Row labels are fixed per signal;
   only the values change, or the rail would reflow every frame.
   ================================================================ */
const CAMSIG={
  headcount:{
    n:"Learners in frame", unit:"learners",
    head:c=>c.occ===null?{t:"no feed",tone:"crit",u:""}:{t:ppl(c.occ),tone:null},
    rows:c=>{
      const roll=c.course?c.course.enrolled:null;
      const live=c.sc.visible>=COHORT_THR;
      return [
        ["Trade allocated here", c.course?c.course.name:"—"],
        ["Enrolled roll", roll?String(roll):"—"],
        ["Share of roll in frame", (roll&&c.occ!=null)?pc(c.occ/roll*100):"—",
          (roll&&c.occ!=null)?rygTone(c.occ/roll*100,75):null],
        ["Session state", c.occ===null?"no feed":(live?"in session":"below batch threshold"),
          c.occ===null?"crit":(live?"good":"warn")],
        ["Feed at this minute", c.occ===null?"missing":"present", c.occ===null?"crit":"good"]
      ];}
  },
  stations:{
    n:"Equipment in use", unit:"",
    head:c=>{
      const st=c.sc.stations||[], live=c.sc.stBusy||[];
      const used=live.filter(n=>n>0).length;
      return st.length?{t:used+" / "+st.length,
        tone:used/st.length>=0.8?"good":used/st.length>=0.5?"warn":"crit",u:""}
        :{t:"—",tone:null,u:""};},
    rows:c=>{
      const st=c.sc.stations||[], live=c.sc.stBusy||[];
      const used=live.filter(n=>n>0).length, shared=live.filter(n=>n>1).length;
      const noun=ROOM_NOUN[c.sp.type]||"station";
      return [
        [noun.charAt(0).toUpperCase()+noun.slice(1)+"s installed", String(st.length)],
        ["Occupied by one learner", String(used-shared)],
        ["Idle", String(st.length-used), (st.length-used)?"warn":"good"],
        /* sharing is a defect only in an exam room. Group practicals are
           assessed together — that is precisely why the review removed
           Head-to-Machine Ratio outright, so flagging a shared workbench as
           critical would reinstate the 1:1 judgement it rejected. */
        ["Shared by more than one", String(shared),
          c.sp.type==="assessment"?(shared?"crit":"good"):null],
        /* Infra Readiness is a yes/no presence check, never a utilisation %,
           so the drawer it opens must not end on one */
        ...(c.kpi==="Infra / Asset Readiness"?[]:[
          ["Utilisation at this minute", st.length?pc(used/st.length*100):"—",
            st.length?rygTone(used/st.length*100,70):null]])
      ];}
  },
  instructor:{
    n:"Instructor", unit:"",
    head:c=>c.sc.hasInstr
      ?{t:c.sc.inst.inZone?"in zone":"in room",tone:c.sc.inst.inZone?"good":"warn",u:""}
      :{t:"not detected",tone:"crit",u:""},
    rows:c=>[
      ["Trade allocated here", c.course?c.course.name:"—"],
      ["Instructor detected", c.sc.hasInstr?"yes":"no", c.sc.hasInstr?"good":"crit"],
      ["Position", c.sc.hasInstr?(c.sc.inst.inZone?"instruction zone":"among the benches"):"—"],
      ["Learners in frame", c.occ===null?"no feed":ppl(c.occ)],
      ["Interactivity index", MCH[c.cam]?pc(MCH[c.cam].inter*100):"—",
        MCH[c.cam]?rygTone(MCH[c.cam].inter*100,65):null]
    ]
  },
  trade:{
    n:"Trade identified", unit:"",
    head:c=>{
      const m=tradeMatch(c.cam);
      if(!m||m.state==="unobserved") return {t:"no session",tone:"crit",u:""};
      return {t:TC[m.obs].n,tone:m.state==="match"?"good":"crit",u:""};},
    rows:c=>{
      const m=tradeMatch(c.cam);
      return [
        ["Allocated at accreditation", c.course?c.course.name:"—"],
        ["Identified from camera", m&&m.obs?TC[m.obs].n:"—",
          m?(m.state==="match"?"good":m.state==="mismatch"?"crit":"warn"):null],
        ["Classifier confidence", m&&m.conf?m.conf.toFixed(2):"—"],
        ["Finding", m?(m.state==="match"?"Concordant":m.state==="mismatch"
            ?"Trade mismatch":"No session observed"):"—",
          m?(m.state==="match"?"good":m.state==="mismatch"?"crit":"warn"):null],
        ["Asked of the centre", "nothing", "good"]
      ];}
  },
  viva:{
    n:"Viva in progress", unit:"",
    head:c=>{
      const v=c.sc.viva;
      if(!v) return {t:"—",tone:null,u:""};
      return {t:String(v.idx)+" of "+v.of,tone:"good",u:"candidate"};},
    rows:c=>{
      const v=c.sc.viva, st=c.sc.stations||[], live=c.sc.stBusy||[];
      const used=live.filter(n=>n>0).length, shared=live.filter(n=>n>1).length;
      const worst=live.reduce((a,n,i)=>n>a.n?{n,i}:a,{n:0,i:0});
      return [
        ["Elapsed in this viva", v?(String(Math.floor(v.tSec/60)).padStart(2,"0")+":"+
          String(Math.floor(v.tSec%60)).padStart(2,"0")):"—"],
        ["Assessor detected", "yes", "good"],
        ["Assessment desks in use", used+" of "+st.length],
        ["Desks shared", String(shared), shared?"crit":"good"],
        ["Malpractice flag", shared?(worst.n+" at desk "+String(worst.i+1).padStart(2,"0")):"none",
          shared?"crit":"good"]
      ];}
  },
  feed:{
    n:"Feed at this minute", unit:"",
    head:c=>c.occ===null?{t:"missing",tone:"crit",u:""}:{t:"present",tone:"good",u:""},
    rows:c=>{
      const fm=FEEDMETA[c.cam]&&FEEDMETA[c.cam][c.date];
      const cv=COV[c.cam]&&COV[c.cam][c.date];
      return [
        ["Camera", camLabel(c.cam)],
        ["Rows in the export", fm?fmt(fm.slots*2):"—"],
        ["Gaps on this day", fm?String(fm.gaps):"—", fm&&fm.gaps?"warn":"good"],
        ["First row", cv?hm(cv[0]):"—"],
        ["Last row", cv?hm(cv[1]):"—"]
      ];}
  }
};

/* ---------------- the camera drawer ----------------
   Opens directly under the KPI row that asked for it, so the figure and
   its evidence are on screen together. One at a time. */
let CAMDRAWER=null, DECK_SYNC=null;
function closeCamDrawer(){
  if(!CAMDRAWER) return;
  if(camLoop){cancelAnimationFrame(camLoop);camLoop=null;}
  if(CAMDRAWER.btn) CAMDRAWER.btn.setAttribute("aria-expanded","false");
  SYNCS.length=CAMDRAWER.n0;
  CAMDRAWER.node.remove();
  CAMDRAWER=null;
  if(DECK_SYNC) DECK_SYNC();
}
function openCamDrawer(btn,o){
  const same=CAMDRAWER&&CAMDRAWER.btn===btn;
  closeCamDrawer();
  if(same) return;
  const cam=o.cam, sp=SP[cam.space];
  const host=btn.closest(".kg")||btn.closest(".panel")||btn.parentNode;
  const dr=el("div",{class:"camdrawer"});
  const close=el("button",{class:"cd-x",text:"Close","aria-label":"Close the camera view"});
  dr.appendChild(el("div",{class:"cd-h"},[
    el("i",{class:"cd-dot"}),
    el("b",{text:o.lbl}),
    el("em",{text:(SP[cam.space].role==="uncovered"
      ? "no camera on this space — modelled preview of "
      : (o.src==="modelled" ? "proposed detector over " : "measured from "))
      +sp.name+(SP[cam.space].role==="uncovered"?"":" · "+camLabel(cam.space))}),
    close]));
  const n0=SYNCS.length;
  dr.appendChild(buildCameraPanel({focus:cam.space,signal:cam.signal,cap:cam.cap,
    kpiLabel:o.lbl,
    dayLabel:cam.dayLabel||"This figure, whole day",
    dayValue:String(o.val)+(o.unit?" "+o.unit:"")}));
  host.parentNode.insertBefore(dr,host.nextSibling);
  btn.setAttribute("aria-expanded","true");
  CAMDRAWER={node:dr,btn,n0};
  close.addEventListener("click",()=>{closeCamDrawer();btn.focus();});
  SYNCS.slice(n0).forEach(f=>{try{f();}catch(e){}});
  if(DECK_SYNC) DECK_SYNC();
  bringIntoView(dr);
}
function bringIntoView(node){
  requestAnimationFrame(()=>{
    const r=node.getBoundingClientRect();
    if(r.bottom>innerHeight-8||r.top<90)
      node.scrollIntoView({block:"nearest",
        behavior:REDUCED?"instant":"smooth"});
  });
}
addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(CAMDRAWER){const b=CAMDRAWER.btn;closeCamDrawer();if(b)b.focus();return;}
  if(typeof MDRAWER!=="undefined"&&MDRAWER){
    const b=MDRAWER.btn;closeMetricDrawer();if(b)b.focus();}
});

/* the room this page should be showing, picked from the real feed rather
   than hard-coded, so a different day opens a different camera */
function busiestRoom(){
  const d=S.date;
  let best=null,bv=-1;
  roomsIn().forEach(r=>{const x=D[d]&&D[d][r];
    if(x&&x.peak>bv){bv=x.peak;best=r;}});
  return best||roomsIn()[0];
}
/* the camera each kind of finding points at, chosen from the real feed so a
   different day can point at a different room */
const mismatchCam=()=>roomsIn().find(r=>{const m=tradeMatch(r);
  return m&&m.state==="mismatch";})||busiestRoom();
const darkCam=()=>roomsIn().find(r=>{const m=tradeMatch(r);
  return m&&m.state==="unobserved";})||busiestRoom();
const equipCam=()=>{
  const e=roomsIn().filter(r=>SP[r].stations>0&&D[S.date][r]&&D[S.date][r].running);
  return e.length?e.reduce((a,b)=>((MCH[a]?MCH[a].equip:1)<(MCH[b]?MCH[b].equip:1)?a:b))
                 :busiestRoom();};
const instrCam=()=>{
  const e=roomsIn().filter(r=>D[S.date][r]&&D[S.date][r].running);
  return e.length?e.reduce((a,b)=>((MCH[a]?MCH[a].inter:1)<(MCH[b]?MCH[b].inter:1)?a:b))
                 :busiestRoom();};

function stationLine(id){
  const sp=SP[id]; if(!sp.stations) return null;
  const rec=D[S.date]&&D[S.date][id];
  const heads=Math.max(0,Math.ceil(rec?rec.peak:0));
  const used=Math.min(sp.stations,heads);
  return {used,of:sp.stations,txt:used+" of "+sp.stations,
          tone:used/sp.stations>=0.8?"good":used/sp.stations>=0.5?"warn":"crit"};
}
function tradeLine(id){
  const t=tradeMatch(id);
  if(!t) return {txt:"—",tone:null};
  if(t.state==="unobserved") return {txt:"no session",tone:"crit"};
  return {txt:TC[t.obs].n+" "+t.conf.toFixed(2),
          tone:t.state==="match"?"good":"crit"};
}
function quietestRoom(){
  const d=S.date;
  let best=null,bv=1e9;
  roomsIn().forEach(r=>{const x=D[d]&&D[d][r];
    if(x&&x.running&&x.peak<bv){bv=x.peak;best=r;}});
  return best||busiestRoom();
}

/* ---------------- the console ---------------- */
function buildCameraPanel(opt){
  opt=opt||{};
  const date=S.date;
  const FOCUS=opt.focus||S.focusCam;
  const SIG=CAMSIG[opt.signal]||CAMSIG.headcount;
  const CAM_MAXH=opt.maxH||300;
  const WALL=[FOCUS];
  const scenes={};
  WALL.forEach((id,i)=>scenes[id]=makeScene(id,9000+i*137,opt.cap));

  /* playhead: start at the busiest minute of this camera */
  const focusRec=D[date]&&D[date][FOCUS];
  /* open a little before the busiest minute so playback runs INTO the fullest
     frame rather than drifting away from it */
  const peakM=focusRec&&focusRec.peakMin!=null?focusRec.peakMin:11*60;
  let head=clamp((opt.minute!=null?opt.minute:peakM-22),DAY_FROM,DAY_TO-1);
  let playing=true, speed=4;      // feed-minutes per real second

  const wrap=el("div",{class:"vwrap"});
  const grid=el("div",{class:"vgrid"});

  const stage=el("div",{class:"vstage"});
  const cvs=el("canvas");stage.appendChild(cvs);
  const hud=el("div",{class:"hud"});
  const hTL=el("div",{class:"hud-tl"}),hTR=el("div",{class:"hud-tr"}),
        hBL=el("div",{class:"hud-bl"}),hBR=el("div",{class:"hud-br"});
